<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIMOIRE｜グリモアール</title>
<style>
:root{
  --navy:#0d1526;--navy2:#142038;--navy3:#1b2a47;--brown:#2a1d14;--brown2:#3a281b;
  --gold:#b8964e;--gold2:#d6b97a;--ivory:#e9e0c9;--ivory2:#c9bfa6;--green:#2c3e2f;--green2:#4b6b50;
  --danger:#a8553f;--ok:#6f9a6a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Times New Roman",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top,#16233f 0%,var(--navy) 55%,#080d18 100%) fixed;color:var(--ivory);font-family:var(--serif);font-size:16px;line-height:1.8;padding-bottom:84px}
a{color:var(--gold2);text-decoration:none;border-bottom:1px dotted rgba(214,185,122,.5)}
a:hover{color:#f0dba0}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--brown),#1d140e);border-bottom:1px solid var(--gold);box-shadow:0 2px 12px rgba(0,0,0,.5)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--serif);letter-spacing:.28em;font-size:22px;color:var(--gold2);border:none;white-space:nowrap}
.logo small{display:block;letter-spacing:.1em;font-size:10px;color:var(--ivory2)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch}
nav a{border:none;padding:8px 12px;color:var(--ivory2);font-family:var(--sans);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
nav a.on{color:var(--gold2);border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:20px 14px}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--gold2);line-height:1.4}
h1{font-size:28px;margin:.2em 0 .6em;letter-spacing:.06em}
h2{font-size:21px;margin:1.6em 0 .6em;padding-bottom:.25em;border-bottom:1px solid rgba(184,150,78,.4)}
h3{font-size:17px;margin:1.2em 0 .4em}
.card{background:linear-gradient(160deg,rgba(42,29,20,.85),rgba(20,32,56,.85));border:1px solid rgba(184,150,78,.45);border-radius:6px;padding:16px 18px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat b{display:block;font-size:26px;color:var(--gold2);font-family:var(--serif)}
.stat span{font-family:var(--sans);font-size:12px;color:var(--ivory2)}
.muted{color:var(--ivory2);font-size:14px}
.sans{font-family:var(--sans)}
.bar{height:8px;background:#0a1020;border:1px solid rgba(184,150,78,.4);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold))}
.btn,button{font-family:var(--sans);font-size:14px;color:var(--ivory);background:var(--brown2);border:1px solid var(--gold);border-radius:4px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover,button:hover{background:#4d3623}
button.pri{background:var(--green);border-color:var(--gold2)}
button.pri:hover{background:var(--green2)}
button.danger{border-color:var(--danger);color:#e8b7a8}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;padding:1px 8px;border:1px solid rgba(184,150,78,.6);border-radius:10px;color:var(--gold2);margin-right:4px}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.warn{border-color:var(--danger);color:#e8b7a8}
.tag.plan{border-color:#6c7a93;color:#9aa8c2}
input,select,textarea{font-family:var(--sans);font-size:15px;background:#0a1222;color:var(--ivory);border:1px solid rgba(184,150,78,.5);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.6}
label{display:block;font-family:var(--sans);font-size:13px;color:var(--ivory2);margin:10px 0 3px}
.form2{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lec{background:rgba(233,224,201,.05);border-left:3px solid var(--gold);padding:6px 18px;font-size:17px;line-height:2}
.lec p{margin:.9em 0}
.box{border:1px solid rgba(184,150,78,.4);background:rgba(0,0,0,.2);padding:10px 16px;border-radius:4px;margin:12px 0}
.box.warn{border-color:var(--danger)}
ul.clean{padding-left:1.3em;margin:.4em 0}
ul.clean li{margin:.25em 0}
.crumb{font-family:var(--sans);font-size:13px;color:var(--ivory2)}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14px}
th,td{border:1px solid rgba(184,150,78,.35);padding:6px 9px;text-align:left;vertical-align:top}
th{background:rgba(184,150,78,.15);color:var(--gold2)}
.tl{border-left:2px solid var(--gold);margin:10px 0 10px 8px;padding-left:16px}
.tl div{margin:.7em 0;position:relative}
.tl div:before{content:"";position:absolute;left:-23px;top:.6em;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl b{color:var(--gold2);font-family:var(--sans);font-size:13px;display:block}
svg.dia{width:100%;height:auto;max-width:720px;display:block;margin:10px auto}
.sv-box{fill:#1b2a47;stroke:#b8964e;stroke-width:1.4}
.sv-t{fill:#e9e0c9;font-size:14px;text-anchor:middle;font-family:var(--sans)}
.sv-s{fill:#c9bfa6;font-size:11px;text-anchor:middle;font-family:var(--sans)}
.sv-l{stroke:#b8964e;fill:none;stroke-width:1.5}
.opt{display:block;padding:7px 10px;border:1px solid rgba(184,150,78,.3);border-radius:4px;margin:5px 0;cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--ivory)}
.opt input{width:auto;margin-right:8px}
.opt.right{border-color:var(--ok);background:rgba(111,154,106,.15)}
.opt.wrong{border-color:var(--danger);background:rgba(168,85,63,.15)}
.glyph{font-size:34px;color:var(--gold);line-height:1}
#timerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(#1d140e,var(--brown));border-top:1px solid var(--gold);box-shadow:0 -2px 12px rgba(0,0,0,.6)}
.tb-in{max-width:1080px;margin:0 auto;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--sans);font-size:14px}
.tb-time{font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums;font-family:var(--serif)}
.tb-in select{width:auto;max-width:220px;padding:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:#0a1222;border:1px solid var(--gold);padding:10px 18px;border-radius:6px;font-family:var(--sans);font-size:14px;max-width:92vw;display:none;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.hide{display:none}
.ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;background:rgba(5,9,18,.8);display:none;align-items:center;justify-content:center;padding:16px}.dlg{background:linear-gradient(160deg,#2a1d14,#142038);border:1px solid var(--gold);border-radius:8px;padding:18px 20px;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.7)}.dlg .col{display:flex;flex-direction:column;gap:8px}.dlg button{text-align:left}.linkbtn{background:none;border:none;color:var(--ivory2);text-decoration:underline;min-height:30px}.sg svg{width:100%;max-width:340px;height:auto;display:block;margin:8px auto}.sgthumb svg{width:96px;height:96px;display:block}
@media (max-width:600px){body{padding-bottom:110px}.tb-in{gap:6px;padding:6px 10px;font-size:13px}.tb-in button{padding:5px 9px;font-size:13px;min-height:32px}.tb-time{font-size:18px}.tb-in .muted{font-size:12px}h1{font-size:23px}.lec{font-size:16px;padding:4px 12px}.logo{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card:hover{border-color:var(--gold)}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/home">GRIMOIRE<small>グリモアール</small></a>
  <nav id="nav"></nav>
</div></header>
<main id="app"><p class="muted">読み込み中…（JavaScriptが無効の場合、このサイトは動作しません）</p></main>
<div id="timerbar"></div>
<div id="toast" role="status"></div>
<div id="overlay" class="ov"></div>

<script>
'use strict';
/* =====================================================================
   GRIMOIRE  ―  基盤 v0.1.0
   構造:  [1] カリキュラムデータ(DOMAINS / LECTURES / TASKS / REFS)
          [2] 状態管理・保存・JSON入出力
          [3] 学習時間計測
          [4] 画面描画(ルーター)
   新しい授業は LECTURES、領域は DOMAINS、課題は TASKS、文献は REFS に
   データを追加するだけで表示・進捗管理の対象になる。
   ===================================================================== */
var APP_VERSION='0.4.0', SCHEMA=1, LS_KEY='grimoire.state.v1';

/* ---------- [1-a] 研究領域 ---------- */
var DOMAINS=[
{id:'chaos',name:'カオスマジック',en:'CHAOS MAGIC',glyph:'✺',
 overview:'20世紀後半のイギリスで形を取った、方法と信念を「道具」として扱う魔術の潮流。信念・象徴・意図・儀式が人間の認知や行動に与える影響を、仮説と検証の姿勢で研究する。',
 purpose:'信念、象徴、意図、儀式などを研究し、それらが人間の認知や行動に及ぼす影響を理解する。',
 chapters:[
 {n:1,title:'カオスマジックとは何か',lectures:[['chaos-1-1','カオスマジックとは何か（成立史と基本思想）'],['chaos-1-2','オースティン・オスマン・スペアとシジルの原型'],['chaos-1-3','ピーター・J・キャロルと「信念」という道具']]},
 {n:2,title:'信念と意識',lectures:[['chaos-2-1','信念の形成と思い込み'],['chaos-2-2','注意・期待・暗示'],['chaos-2-3','自己認識']]},
 {n:3,title:'シジル魔術',lectures:[['chaos-3-1','シジルの歴史と構造'],['chaos-3-2','象徴化と意図の設定'],['chaos-3-3','心理的な作用の検証']]},
 {n:4,title:'儀式の構造',lectures:[['chaos-4-1','儀式の歴史と構成要素'],['chaos-4-2','象徴・動作・集中と注意'],['chaos-4-3','自分だけの儀式の設計']]},
 {n:5,title:'実践と検証',lectures:[['chaos-5-1','行動目標の設定とシジルを使った行動実験'],['chaos-5-2','比較実験の設計'],['chaos-5-3','結果の記録と独自の研究']]}]},
{id:'kabbalah',name:'カバラ',en:'KABBALAH',glyph:'ק',
 overview:'ユダヤ教の神秘思想としてのカバラと、近代西洋オカルティズムが再構成したヘルメティック・カバラ。両者を区別しながら、生命の樹とセフィロトの象徴体系を学ぶ。',
 purpose:'生命の樹、セフィロト、象徴、数秘、宇宙観などを理解し、象徴体系を使って思考を整理する能力を養う。',
 chapters:[
 {n:1,title:'カバラとは何か',lectures:[['kabbalah-1-1','カバラとは何か（成立史と二つの系譜）'],['kabbalah-1-2','ユダヤ教における位置づけ'],['kabbalah-1-3','ヘルメティック・カバラとの違い']]},
 {n:2,title:'生命の樹',lectures:[['kabbalah-2-1','生命の樹とは何か'],['kabbalah-2-2','10のセフィロトと22のパス'],['kabbalah-2-3','象徴的な対応関係と全体構造']]},
 {n:3,title:'セフィロトの理解',lectures:[['kabbalah-3-1','ケテル・コクマー・ビナー'],['kabbalah-3-2','ケセド・ゲブラー・ティファレト'],['kabbalah-3-3','ネツァク・ホド・イェソド・マルクト']]},
 {n:4,title:'象徴体系',lectures:[['kabbalah-4-1','ヘブライ文字'],['kabbalah-4-2','数字と象徴・対応関係'],['kabbalah-4-3','タロットとの関連・惑星との対応']]},
 {n:5,title:'実践研究',lectures:[['kabbalah-5-1','生命の樹の作図'],['kabbalah-5-2','象徴体系の分析と概念の分類'],['kabbalah-5-3','独自の象徴体系の構築']]}]},
{id:'memory',name:'記憶術',en:'MEMORY ARTS',glyph:'⌂',
 overview:'古典的な記憶術（場所法・記憶の宮殿）と現代の認知科学（想起練習・分散学習）を組み合わせ、記憶の仕組みを理解して実際の記憶能力を高める。',
 purpose:'記憶の仕組みを理解し、古典的な記憶術と現代の認知科学を組み合わせ、実際に記憶能力を高める。',
 chapters:[
 {n:1,title:'記憶の仕組み',lectures:[['memory-1-1','記憶の仕組み（三つの段階と容量の制約）'],['memory-1-2','忘却の仕組み']]},
 {n:2,title:'古典記憶術',lectures:[['memory-2-1','記憶術の歴史'],['memory-2-2','場所法と記憶の宮殿'],['memory-2-3','連想法とイメージ法']]},
 {n:3,title:'数字と情報の記憶',lectures:[['memory-3-1','数字変換法'],['memory-3-2','グループ化・連想・大量の情報']]},
 {n:4,title:'現代の記憶科学',lectures:[['memory-4-1','想起練習と分散学習'],['memory-4-2','精緻化と睡眠'],['memory-4-3','忘却曲線とその限界']]},
 {n:5,title:'実践トレーニング',lectures:[['memory-5-1','単語・数字・順序の記憶'],['memory-5-2','文章記憶と記憶の宮殿の構築'],['memory-5-3','長期的な維持と再現率の測定']]}]},
{id:'mental',name:'精神制御・意識調整',en:'MENTAL MASTERY',glyph:'☾',
 overview:'「精神制御」を、他人を支配する技術ではなく、自分自身の思考・注意・感情・意識状態を理解し調整する知識と技術として扱う。歴史的主張と現代心理学の知見を区別して学ぶ。',
 purpose:'自分自身の思考、注意、集中、感情、意識状態を理解し、必要に応じて意図的に調整する能力を身につける。',
 chapters:[
 {n:1,title:'精神と意識の仕組み',lectures:[['mental-1-1','意識・注意・メタ認知の基礎'],['mental-1-2','自分の精神状態を観察する']]},
 {n:2,title:'思考の制御・雑念への対処',lectures:[['mental-2-1','思考抑制と「反動」の研究'],['mental-2-2','反芻思考と注意の切り替え'],['mental-2-3','認知的脱フュージョンとマインドフルネス']]},
 {n:3,title:'集中力・注意力の向上',lectures:[['mental-3-1','集中力とは何か'],['mental-3-2','集中を妨げる要因と環境設計'],['mental-3-3','集中の測定とトレーニング']]},
 {n:4,title:'感情・精神状態の調整',lectures:[['mental-4-1','感情の仕組みと身体反応'],['mental-4-2','呼吸法とリラクゼーション'],['mental-4-3','認知的再評価と感情との距離'],['mental-4-4','ストレスへの対処と睡眠']]},
 {n:5,title:'瞑想・自己暗示・催眠',lectures:[['mental-5-1','瞑想の歴史と技法'],['mental-5-2','自己暗示・催眠の心理学'],['mental-5-3','プラセボ効果とノセボ効果']]},
 {n:6,title:'精神状態の切り替えと実践',lectures:[['mental-6-1','学習・作業モードへの切り替え'],['mental-6-2','儀式と心理的な準備'],['mental-6-3','自分に適した手順の設計']]},
 {n:7,title:'応用研究',lectures:[['mental-7-1','長期実験の設計'],['mental-7-2','自己暗示・瞑想の効果検証'],['mental-7-3','独自の精神調整プログラムの構築']]}]}
];
/* ---------- [1-a2] 追加の研究領域（導入のみ執筆。章立ては設計済みで、講義は順次追加） ---------- */
DOMAINS.push(
{id:'psychmagic',name:'精神魔術・心理学',en:'PSYCHOLOGICAL MAGIC',glyph:'☿',
 overview:'魔術の象徴や儀式を「心の働き」として読み解く系譜（20世紀の心理学的魔術観、ユングの錬金術解釈）と、魔術的思考・暗示・自己認識に関する現代心理学の知見を、並べて学ぶ。',
 purpose:'魔術の心理学的な読み方の歴史と限界を理解し、魔術的思考や主観的妥当化といった認知の癖を自分で見抜けるようになる。',
 chapters:[
 {n:1,title:'精神魔術とは何か',lectures:[['psychmagic-1-1','精神魔術とは何か（魔術を心理の言葉で読む）'],['psychmagic-1-2','20世紀の心理学的魔術観']]},
 {n:2,title:'ユングと象徴',lectures:[['psychmagic-2-1','ユングの錬金術解釈と元型'],['psychmagic-2-2','アクティブ・イマジネーション']]},
 {n:3,title:'魔術的思考の心理学',lectures:[['psychmagic-3-1','類似と感染の法則'],['psychmagic-3-2','因果の錯覚と迷信']]},
 {n:4,title:'暗示・期待・自己認識',lectures:[['psychmagic-4-1','バーナム効果と主観的妥当化'],['psychmagic-4-2','占いと心理']]},
 {n:5,title:'実践と倫理',lectures:[['psychmagic-5-1','象徴を使った内省'],['psychmagic-5-2','心の危機と相談先']]}]},
{id:'verbal',name:'言語魔術・説得術',en:'VERBAL MAGIC & PERSUASION',glyph:'❝',
 overview:'呪文・祝詞・言霊など、言葉に力を認めてきた歴史と、言語学・修辞学・心理学が明らかにしてきた「言葉が人の認識や行動に及ぼす影響」を学ぶ。他人を操る技術ではなく、誠実な説得と、悪質な手口を見抜く力を目的とする。',
 purpose:'言葉が認識・記憶・判断・行動に与える影響を理解し、自分の言葉の使い方を意識的に整え、不当な誘導を見抜けるようになる。',
 chapters:[
 {n:1,title:'言葉の力の歴史',lectures:[['verbal-1-1','言葉は何をするのか（導入）'],['verbal-1-2','呪文・祝詞・言霊']]},
 {n:2,title:'言語行為',lectures:[['verbal-2-1','約束・命名・宣言'],['verbal-2-2','儀式の言葉の構造']]},
 {n:3,title:'説得の心理学',lectures:[['verbal-3-1','修辞学の三要素'],['verbal-3-2','影響力の原理と限界']]},
 {n:4,title:'言葉と認識',lectures:[['verbal-4-1','フレーミング'],['verbal-4-2','言葉が記憶の報告に与える影響']]},
 {n:5,title:'自己への言葉と倫理',lectures:[['verbal-5-1','セルフトーク'],['verbal-5-2','説得と操作の境界・悪質な手口の見抜き方']]}]},
{id:'natural',name:'自然魔術・植物学',en:'NATURAL MAGIC & BOTANY',glyph:'❦',
 overview:'ルネサンスの「自然魔術」（自然の隠れた性質の探究）から、本草学、近代植物学・薬理学へとつながる流れを学ぶ。観察と記録を土台にし、伝承・経験・実証を区別する。',
 purpose:'自然を観察して記録する方法を身につけ、歴史上の自然魔術の主張と、現代の植物学・薬理学で確認されていることを区別して理解する。',
 chapters:[

LECTURES['chaos-1-1']={
goals:['カオスマジックが成立した経緯と主要人物を説明できる','従来の西洋儀式魔術との方法論の違いを説明できる','「信念を道具として扱う」という考え方と、その検証上の注意点を説明できる'],
intro:'魔術と聞けば、多くの人は古代から受け継がれた秘伝の体系を思い浮かべるでしょう。ところが20世紀後半のイギリスに現れたカオスマジックは、まるで逆の方向を向いていました。体系の権威に従うのではなく、「それは実際に自分に何をもたらすのか」を試して確かめる。魔術を、信念と象徴を扱う実験的な技術として捉え直したのです。この講義では、その成立の道筋と考え方を、批判的な目で見ていきます。',
sections:[
{h:'系譜：スペアから1970年代のイギリスへ',p:['出発点としてよく挙げられるのが、画家・著述家のオースティン・オスマン・スペア（Austin Osman Spare, 1886–1956）です。1913年の『The Book of Pleasure』などで、自らの欲求を短い文にし、文字を整理して一つの図形（シジル）に変え、意識的な思考から手放すという方法を提示しました。{r:spare1913} スペア自身は生前、広い読者を得なかったとされ、後の世代による再評価を経て影響が広がりました。','1970年代後半、ピーター・J・キャロル（Peter J. Carroll, 1953–）らが、こうした流れを方法論として整理します。1978年に『Liber Null』が刊行され、同じ頃に魔術結社 Illuminates of Thanateros（IOT）が結成されました。後に『Liber Null & Psychonaut』の合本としても流通しています。{r:carroll1987} 実践の手引きとしては、フィル・ハイン（Phil Hine）の『Condensed Chaos』なども広く読まれました。{r:hine1995}']},
{h:'従来の西洋魔術との違い',p:['ゴールデン・ドーン（黄金の夜明け団）に連なる儀式魔術では、象徴の対応関係や位階、手順がかなり厳密に体系化されています。これに対してカオスマジックは、**特定の象徴体系そのものより、どう使うかという方法**を重視します。ある時は一つの世界観（パラダイム）を採用し、別の時には別のものに切り替える。この「パラダイムの切り替え」が、カオスマジックの特徴的な発想です。','もっとも、実際の実践者は従来の象徴体系も借用しますし、「何でもあり」を意味するわけではありません。「違い」は程度の問題であり、対立として単純化しないことが大切です。']},
{h:'信念は道具になるのか',p:['カオスマジックの中心にある主張は、信念は固定した真理ではなく、状態を変えるための道具として扱いうる、というものです。しかし、ここに本教材が最も慎重になる点があります。「信念を自由に切り替えられるのか」「それが行動や感情を実際に変えるのか」は、**経験的に検証すべき問い**であって、前提にしてよいことではありません。','心理学には、手がかりになりそうな知見があります。たとえば「もしXならYする」と具体的に決めておく実行意図（if-then 計画）は、目標の達成を助けることが報告されています。{r:gollwitzer1999} シジルなどの技法に何らかの効果があるとすれば、まずはこうした心理的な経路（注意の向け方、意図の明確化、行動の引き金）を通じて起こる可能性を検討するのが、本教材の立場です。超常的な作用が検証されているわけではありません。']},
{h:'この教材での扱い方',p:['本教材では、カオスマジックに関わる主張を次の三つに分けて扱います。①歴史的・思想的な主張（誰が何を述べたか）、②現代の心理学で説明・検証できる主張、③未検証の主張。③を「事実」として扱うことはしません。そのうえで、自分で仮説を立て、記録し、比較する。それがこの領域の学び方です。']}],
diagram:{type:'flow',items:[['信念','考え方・解釈'],['期待','予測する'],['注意','何に目が向くか'],['行動','実際の動き'],['結果','出来事']],loop:'結果の受け取り方が信念を強化する（確証バイアスが入り込みやすい箇所）',cap:'図1：信念から行動へのフィードバック・ループ（単純化したモデル）'},
examples:['仮説の例：「机の上を整えて深呼吸してから始めると、最初の10分の集中度が高い」。これを信じ込むのではなく、実施した日としなかった日を記録して比較する。','悪い例：「儀式をした日に良いことが起きた」とだけ記録し、起きなかった日を数えない。これでは確証バイアスで「効いた」ように見える。'],
life:['習慣づくり：行動の「きっかけ」を事前に決めておくと始めやすくなる、という考え方につながる。','期待が体験に与える影響（プラセボ効果など）を、自分の学習や仕事で意識できるようになる。','「信じるかどうか」ではなく「どう測るか」で物事を考える習慣がつく。'],
summary:['カオスマジックはスペアの系譜を受けて、1970年代後半に整理された、方法と信念を道具として扱う潮流。','従来の儀式魔術より、体系への忠実さより方法の実験性を重視する。','「信念を道具にできるか」は検証すべき問いであり、前提ではない。','本教材は、歴史的主張・心理学で説明できる主張・未検証の主張を区別する。'],
quiz:[
{q:'スペアが『The Book of Pleasure』を刊行した年として、本講義で示されたのはどれか。',o:['1913年','1978年','1888年','1966年'],a:0,e:'スペアの『The Book of Pleasure』は1913年の刊行です。1978年はキャロルの『Liber Null』と IOT の時期です。'},
{q:'カオスマジックの特徴として最も適切なものはどれか。',o:['固定された象徴体系と位階への忠実さを最も重んじる','方法や信念を道具として扱い、効果を試して確かめる姿勢を重んじる','超自然的な効果が科学的に証明された技術体系である','ユダヤ教の神秘思想の正統な継承である'],a:1,e:'体系への忠実さより、方法の実験性やパラダイムの切り替えが特徴です。超自然的効果は検証されていません。'},
{q:'本教材でシジルなどの効果を検討するときの基本的な立場はどれか。',o:['超常的な効果が起きると前提にする','行動や心理の変化として測定できる仮説を立て、記録して比較する','うまくいった例だけを記録する','信念は検証できないので検討しない'],a:1,e:'測定可能な仮説にして、記録・比較することが基本です。'},
{q:'実験の記録で、特に注意すべき認知バイアスはどれか。',o:['確証バイアス（当たった例だけを覚え、外れを軽視する）','後知恵バイアスは存在しない','記録は主観的であるほど正確になる','バイアスは訓練しても関係ない'],a:0,e:'外れた日も数えること、事前に仮説と指標を決めておくことが対策になります。'}],
refs:['spare1913','carroll1987','hine1995','gollwitzer1999']};

LECTURES['kabbalah-1-1']={
goals:['カバラの語義と、主要な文献・時代の流れを説明できる','ユダヤ教の伝統的カバラと、ヘルメティック・カバラの違いを説明できる','宗教的伝統への敬意を保った学び方を理解する'],
intro:'「カバラ」は、日本語の本や映画でもよく目にする言葉です。しかし、その中身は、ユダヤ教の長い神秘思想の伝統から、19世紀以降の西洋のオカルティズム、さらには現代の自己啓発的な用法まで、かなり幅があります。この講義では、まず混同されやすい二つの流れを分けて、地図を作ります。',
sections:[
{h:'「カバラ」とは何か',p:['カバラ（קַבָּלָה, Kabbalah）は、ヘブライ語で「受け取ること」「受け継がれたもの」を意味する語に由来し、ユダヤ教の神秘思想・伝統を指します。神がどのように世界を創り、人間はそれとどう関わるのかという問いを、聖書の解釈や象徴を通して探究する営みです。','代表的な古典として、10のセフィロト（ספירות, Sefirot）と22のヘブライ文字による創造を語る『セーフェル・イェツィラー』（成立年代は学説により異なる）{r:seferyetzirah}、13世紀後半に現れた『ゾーハル』{r:zohar} があります。『ゾーハル』は伝統的にはシモン・バル・ヨハイに帰されますが、学術的には13世紀後半のスペインで成立したとする見方が有力です。{r:scholem1941}']},
{h:'歴史の流れ',p:['12〜13世紀の南フランスやスペインで、カバラは文献として姿を現し、16世紀にはツファット（サフェド）でイサク・ルリアらが新しい展開を見せます。一方、15世紀末にはピコ・デッラ・ミランドラらのようなキリスト教徒の知識人もカバラに関心を寄せ、これは「キリスト教カバラ」と呼ばれます。','年代や学説については、研究者によって見解が分かれる点があります。ここでは大まかな流れを把握し、詳細は文献で確認してください。']},
{h:'二つの系譜：ユダヤ教のカバラとヘルメティック・カバラ',p:['19世紀以降、西洋のオカルティズムの中で、カバラの用語や「生命の樹」が再構成されました。これはしばしば**ヘルメティック・カバラ**（Hermetic Qabalah）と呼ばれ、綴りを Qabalah として区別されることもあります。タロットの22枚の大アルカナとヘブライ文字22字を対応させる発想は、この流れの中で発展しました。','ディオン・フォーチュン（Dion Fortune）の『The Mystical Qabalah』（1935）は、この西洋的な解釈の代表的な書籍です。{r:fortune1935} 重要なのは、これは**ユダヤ教の伝統的なカバラそのものではない**という点です。両者は歴史的背景も目的も異なります。']},
{h:'敬意をもって学ぶために',p:['ユダヤ教のカバラは、本来、聖書やタルムードの学び、宗教的実践と結びついた伝統です。本教材はこれを、単なる魔術の道具や象徴の「素材」として扱いません。生命の樹などの象徴は、この教材では「思考を整理するための象徴体系」として学びますが、その由来が宗教的伝統にあることを常に明記します。','また、現代の商業的な「カバラ」の用法や、効果についての主張は、歴史研究の成果とは別物です。出典を確かめる習慣を持ちましょう。']}],
diagram:{type:'timeline',items:[['古代末期〜中世初期（年代は学説による）','『セーフェル・イェツィラー』'],['12〜13世紀','文献の成立と展開（『バヒル』、『ゾーハル』など）'],['16世紀','ツファットでのルリア派の展開'],['15世紀末〜','キリスト教徒によるカバラへの関心（キリスト教カバラ）'],['19世紀','西洋オカルティズムによる再構成（ヘルメティック・カバラ）'],['1935年','ディオン・フォーチュン『The Mystical Qabalah』']],cap:'図1：カバラの流れの概観（年代は概数。学説により異なる）'},
examples:['同じ「生命の樹」でも、ユダヤ教の文献の中での位置づけと、近代西洋オカルティズムの図式化とは別物。','「タロットとヘブライ文字の対応」は、ユダヤ教の伝統にあるものではなく、近代西洋の発展として扱う。'],
life:['宗教や思想を学ぶときに、「伝統」と「後世の再解釈」を分ける習慣がつく。','象徴体系を、概念の整理や分類に使う発想（第5章で実践）の土台になる。','出典の成立時期や由来を確認する、文献批判の姿勢が身につく。'],
summary:['カバラ（קַבָּלָה）は「受け継がれたもの」を意味するユダヤ教の神秘思想の伝統。','『セーフェル・イェツィラー』『ゾーハル』などが重要な古典。成立年代には学説がある。','ヘルメティック・カバラは、近代西洋オカルティズムによる再構成であり、伝統的カバラとは別の系譜。','宗教的伝統への敬意を保ち、単なる魔術の道具として扱わない。'],
quiz:[
{q:'「カバラ」の語義に最も近いものはどれか。',o:['受け継がれたもの（伝承）','生命の樹','神殿','数の神秘'],a:0,e:'ヘブライ語の「受け取る」に由来し、「受け継がれたもの」を意味します。'},
{q:'『ゾーハル』の成立について、本講義の説明として適切なものはどれか。',o:['伝統的にはシモン・バル・ヨハイに帰されるが、学術的には13世紀後半のスペインで成立したとする見方が有力','紀元前に成立したことが確定している','19世紀の西洋で作られた','成立についての議論は存在しない'],a:0,e:'伝統的な帰属と学術的見解が異なる点が重要です。'},
{q:'ヘルメティック・カバラの説明として適切なものはどれか。',o:['ユダヤ教の伝統的カバラそのもの','19世紀以降の西洋オカルティズムが、カバラの用語や生命の樹を取り入れて再構成したもの','現代の心理学の理論','中世のキリスト教会の公式教義'],a:1,e:'両者は歴史的背景も目的も異なるため、混同しないことが大切です。'},
{q:'本教材のカバラの扱い方として適切なものはどれか。',o:['ユダヤ教の伝統を無視して、象徴だけを自由に使う','宗教的伝統への敬意を保ち、単なる魔術の道具として扱わない','伝統と近代の再解釈を区別せずに混ぜる','出典を確認せずに断定的に説明する'],a:1,e:'由来を明記し、伝統と再解釈を区別します。'}],
refs:['seferyetzirah','zohar','scholem1941','fortune1935']};

LECTURES['memory-1-1']={
goals:['記憶の三つの段階（記銘・保持・想起）を説明できる','感覚記憶・作業記憶・長期記憶の違いと、容量の制約を説明できる','古典記憶術と現代の記憶科学をつなぐ視点を持つ'],
intro:'「覚えたはずなのに、思い出せない」。この経験は誰にでもあります。記憶術を学ぶ前に、まず記憶がどのように働き、どこでつまずくのかを知っておくと、技法の「効く理由」と「効かない場面」が見えてきます。この講義は、その地図を描く入門です。',
sections:[
{h:'記憶の三つの段階',p:['記憶は、情報を取り入れて符号化する**記銘（符号化）**、それを蓄えておく**保持**、必要なときに取り出す**想起（検索）**の三つの段階で考えられます。「忘れた」といっても、どの段階での失敗かによって、有効な対策は変わります。そもそも注意が向いていなければ記銘できませんし、うまく符号化できていても、手がかりがなければ想起できないことがあります。']},
{h:'三つの記憶と容量の制約',p:['古典的なモデルでは、記憶を感覚記憶・短期記憶・長期記憶に分けて捉えます。{r:atkinson1968} その後、短期記憶は、情報を保ちながら操作する**作業記憶**（ワーキングメモリ）として捉え直されました。{r:baddeley1974}','作業記憶の容量は限られています。ミラーの論文で広まった「7±2」{r:miller1956} に対し、後にコーワンは、チャンク（意味のまとまり）として約4個程度という見方を提案しました。{r:cowan2001} 数字の違いはあっても、「一度に扱える量には限りがあり、まとまり（チャンク）にすることで実質的に増やせる」という点は共通しています。記憶術の多くは、この制約への工夫として理解できます。']},
{h:'忘却はどう起こるか',p:['19世紀のエビングハウスは、無意味な音節を覚えて、時間とともに保持量がどう減るかを調べました。{r:ebbinghaus1885} 忘却の説明には、時間による減衰だけでなく、他の記憶との干渉や、手がかりの不足による想起失敗なども挙げられます。「忘却曲線」の形は、材料や条件によって変わるため、単純な一本の曲線で万能に説明できるわけではありません（第4章で扱います）。']},
{h:'古典記憶術への入口',p:['古代ギリシア・ローマの弁論家たちは、長い演説を暗記するために、見慣れた場所に覚えたい内容のイメージを配置する**場所法**を用いたとされます。現存する体系的な記述の一つが『ヘレンニウスへ』に含まれ、{r:adherennium} 記憶術の歴史は、フランシス・イェイツの『記憶術』で詳しく論じられています。{r:yates1966} なお、詩人シモニデスにまつわる起源の逸話は伝承であり、史実として確認されているわけではありません。','現代の研究では、思い出す練習（想起練習）が、単に読み返すより長期の保持に有利になる場合があることが示されています。{r:roediger2006} 古典記憶術と現代の記憶科学は、「符号化を工夫する」「想起を練習する」という点でつながります。']}],
diagram:{type:'flow',items:[['感覚入力','見る・聞く'],['注意','選択'],['作業記憶','保持・操作'],['符号化','記銘'],['長期記憶','保持']],loop:'想起（検索）：手がかりによって長期記憶から取り出す',cap:'図1：記憶の流れ（単純化したモデル）'},
examples:['電話番号を「090-1234-5678」のように区切って覚えるのは、チャンク化の例。','買い物リストを、家の中の場所に結びつけたイメージで覚えるのは、場所法の簡易版。'],
life:['「覚えられない」を、記銘・保持・想起のどの段階の問題かに分けて考えられる。','学習は、「読み返す」だけでなく「思い出す」練習を入れると効果的な場合がある。','容量の制約を知ると、情報の整理や提示の仕方を工夫できる。'],
summary:['記憶は、記銘（符号化）・保持・想起の三段階で考える。','作業記憶の容量は限られ、チャンク化で実質的に扱える量を増やせる。','忘却は、減衰・干渉・手がかり不足など複数の要因で説明される。','場所法は古代から使われた技法で、現代の記憶科学とも接点がある。'],
quiz:[
{q:'記憶の三つの段階として適切なものはどれか。',o:['記銘（符号化）・保持・想起','感覚・感情・意志','暗記・理解・応用','短期・中期・長期'],a:0,e:'記銘（符号化）・保持・想起の三段階です。'},
{q:'コーワン（2001）が主張した、作業記憶の容量はどのくらいか。',o:['約4チャンク','約7チャンクで確定','約20チャンク','容量に限界はない'],a:0,e:'ミラーの「7±2」を再検討し、約4チャンクとする見方を提案しました。'},
{q:'場所法の説明として適切なものはどれか。',o:['見慣れた場所に沿って、覚えたい内容のイメージを配置する方法','同じ文を何十回も書き写す方法','睡眠中に音声を流す方法','数字を足し算で覚える方法'],a:0,e:'場所（loci）とイメージを使う古典的な記憶術です。'},
{q:'Roediger と Karpicke（2006）に基づく本講義の説明として適切なものはどれか。',o:['想起練習（テスト）は、条件によっては再読より長期の保持に有利','テストは常に再読より劣る','睡眠は記憶に無関係','忘却曲線は完全に正確'],a:0,e:'条件によって効果が異なる点に注意が必要です。'}],
refs:['atkinson1968','baddeley1974','miller1956','cowan2001','ebbinghaus1885','adherennium','yates1966','roediger2006']};

LECTURES['mental-1-1']={
goals:['意識・注意・メタ認知の基本的な概念を説明できる','心が「さまよう」ことが日常的に起こると理解する','思考と自分を同一視しない考え方の意味を説明できる','精神的な実践を安全に行う心構えを持つ'],
intro:'この領域でいう「精神制御」は、他人の心を操る技術ではありません。自分の注意・思考・感情・意識の状態を理解し、必要に応じて調整する力を指します。そのためにはまず、「今、自分の心で何が起きているか」を観察する力が要ります。この講義では、そのための基礎概念を整理します。',
sections:[
{h:'意識と注意',p:['心理学者ウィリアム・ジェームズは、『心理学原理』（1890）で、意識を途切れなく流れる「流れ」として描き、何に注意を向けるかが私たちの経験を形づくると論じました。{r:james1890} 注意とは、膨大な情報の中から何かを選んで、そこに処理資源を向ける働きです。カーネマンは、注意を限りある「努力」の資源として捉えました。{r:kahneman1973}','「意識」と「無意識」は、日常語では便利ですが、学術的には多様な意味で使われます。この教材では、「気づいている部分」と「気づいていない処理」があるという程度の素朴な区別から始め、断定的な理論には踏み込みません。']},
{h:'心はさまよう',p:['注意は、思ったほど安定しません。キリングスワースとギルバートは、スマートフォンで日常の活動中に「今何を考えているか」を尋ねる調査を行い、人は目の前の活動以外のことを考えている時間がかなり長い（報告では約47％）ことを示しました。{r:killingsworth2010} つまり、**注意が逸れること自体は、失敗ではなく、ごく普通の現象**です。大切なのは、逸れたことにいつ気づき、どう戻すかです。']},
{h:'メタ認知：自分の認知を観察する',p:['メタ認知とは、自分の認知（思考・記憶・理解の状態）を、一段高い視点から観察・評価・調整する働きです。{r:flavell1979} 「今、集中が切れているな」「この説明は理解できていないな」と気づけること自体が、調整の第一歩になります。','本教材の実践課題では、この観察を、回数・時間・主観的な評価として**記録する**ことを重視します。']},
{h:'思考と自分を同一視しない',p:['「自分はダメだ」という考えが浮かぶことと、「自分はダメな人間である」という事実とは別です。思考を、頭の中に浮かんだ出来事として眺める見方は、臨床心理学の ACT（アクセプタンス＆コミットメント・セラピー）などで、認知的脱フュージョンと呼ばれています。{r:hayes1999} ただし、これは思考を無視したり否定したりすることではありません。また、効果は目的や個人によって異なり、万能の方法ではありません。']},
{h:'安全に実践するために',p:['この領域の実践は、あくまで自己理解と自己調整のためのものであり、診断や治療の代わりにはなりません。強い不快感、不安、めまい、体調不良などが生じたら、ただちに中止してください。つらさが続く場合は、医療機関や専門家に相談してください。']}],
diagram:{type:'flow',items:[['集中','対象に注意'],['逸脱','雑念・さまよい'],['気づき','メタ認知'],['戻す','注意を再び対象へ']],loop:'このサイクルの繰り返しが、注意の訓練になる（雑念が起きること自体は失敗ではない）',cap:'図1：注意のサイクル'},
examples:['5分間、呼吸に注意を向ける。雑念に気づくたびに回数を記録し、そっと呼吸に戻る。','「また集中できなかった」ではなく、「4回気づいて戻せた」と記録する。'],
life:['勉強や仕事中に、注意が逸れたことに早く気づけるようになる。','ネガティブな考えが浮かんだとき、事実と思考を区別するきっかけになる。','「集中できない自分」を責める代わりに、観察して調整する姿勢が身につく。'],
summary:['注意は限りある資源で、何に向けるかが体験を形づくる。','心がさまようことは日常的に起こる（報告では約47％）。','メタ認知は、自分の認知状態を観察・評価・調整する働き。','思考を出来事として眺める見方があるが、万能ではなく、診断・治療の代わりでもない。'],
quiz:[
{q:'Killingsworth と Gilbert（2010）の調査で報告された、活動中に心がさまよっていた割合に最も近いものはどれか。',o:['約47％','約5％','約99％','ほぼ0％'],a:0,e:'本講義では約47％と紹介しました。数値の詳細は原典で確認してください。'},
{q:'メタ認知の説明として適切なものはどれか。',o:['自分の認知・思考の状態を観察・評価・調整する働き','超能力の一種','思考を完全に停止させる技術','他人の考えを読み取る能力'],a:0,e:'メタ認知は、自分の認知を一段高い視点から扱う働きです。'},
{q:'「思考と自分を同一視しない」という考え方の説明として適切なものはどれか。',o:['思考を、頭に浮かんだ出来事として観察する。無視や否定をすることではない','嫌な思考を完全に消す','すべての思考を事実として受け入れる','感情を持たないようにする'],a:0,e:'無視や抑え込みではなく、距離をとって眺める見方です。'},
{q:'実践中に強い不快感や体調不良が出た場合の対応として適切なものはどれか。',o:['我慢して続ける','ただちに中止し、続く場合は専門家に相談する','もっと強度を上げる','記録をやめて忘れる'],a:1,e:'実践は安全が最優先です。診断・治療の代わりにはなりません。'}],
refs:['james1890','kahneman1973','killingsworth2010','flavell1979','hayes1999']};

LECTURES['mental-2-1']={
goals:['思考抑制の代表的な研究（白クマ実験）を説明できる','皮肉過程理論の骨子を説明できる','研究結果が一貫しないことを理解し、断定を避けられる','「抑え込む」方法と「気づいて戻す」方法を比較する視点を持つ'],
intro:'「嫌な考えを頭から追い出したい」。誰もが一度は思うことでしょう。では、考えを「止める」ことは可能なのでしょうか。心理学者ダニエル・ウェグナーの有名な実験は、むしろ逆の効果が起こりうることを示しました。しかし話はそれほど単純ではありません。この講義では、研究の成果と限界の両方を見ていきます。',
sections:[
{h:'白クマ実験',p:['ウェグナーらの1987年の研究では、参加者に「白クマのことを考えないように」と指示して思ったことを声に出してもらい、その後に今度は白クマのことを考えてもよいと伝えました。先に抑制を求められた参加者は、その後、白クマについての思考が多くなる傾向を示した、と報告されています。{r:wegner1987} これは「思考抑制のリバウンド」として広く知られるようになりました。']},
{h:'皮肉過程理論',p:['ウェグナーは1994年に、この現象を説明する**皮肉過程理論**を提案しました。{r:wegner1994} 骨子は、思考を抑えるときに、二つの過程が働くというものです。一つは、目標とは別のことを考えようとする**操作過程**。もう一つは、抑えたい思考が出てきていないかをチェックする**監視過程**です。監視過程は、抑えたい対象を探すために、その思考を一時的に活性化させる面があります。疲れていたり、他のことで頭がいっぱいだったり（認知的負荷が高いとき）には、操作過程が弱まり、監視過程が相対的に優位になって、かえって対象が浮かびやすくなる、と説明されます。']},
{h:'結果は一貫しない',p:['ここで大切なのは、「思考抑制は必ず逆効果」とは言えない点です。その後の研究は多数あり、総説でも整理されています。{r:wenzlaff2000} 統制された研究を統合したメタ分析でも、効果は研究や条件によって異なることが検討されています。{r:abramowitz2001} 反動が確認される条件もあれば、確認されない条件もあります。思考の内容、抑える期間、測定の方法、個人の特性などが関わると考えられています。具体的な結果は原典で確認してください。','したがって本教材は、「思考は止められない」とも「抑制は必ず逆効果」とも断定しません。そして、**思考を完全に停止できる、という根拠のない主張もしません。**']},
{h:'もう一つの選択肢：気づいて戻す',p:['抑え込む代わりに、思考が浮かんでもそれに反応しすぎず、気づいたら注意を対象（呼吸など）に戻すという方法があります。これはマインドフルネスの実践や、ACT の認知的脱フュージョンなどで使われる考え方です。{r:hayes1999} ただし、これも万能ではなく、効果は目的や人によって異なります。','どちらが自分に合うかは、観察してみないと分かりません。実験室の課題「抑える方法と気づいて戻す方法の比較」で、回数・主観的疲労を記録して比べてみましょう。']}],

summary:['白クマ実験などで、抑制後の思考の増加（リバウンド）が報告されている。','皮肉過程理論は、操作過程と監視過程で逆効果を説明する。','後続研究の結果は一貫せず、「必ず逆効果」とも「問題ない」とも断定できない。','「気づいて戻す」方法もあるが、万能ではない。自分で記録して比較する。'],

mkL('mental-1-2',
['「気づいていない処理」があることと、内省の限界を説明できる','自分の精神状態を、事実の言葉で記録する方法を実践できる','感情に言葉を当てはめる（ラベリング）研究の内容と限界を説明できる'],
'前の講義では、注意が逸れること自体は普通の現象だと確認しました。では、自分の心の状態は、どうすれば正確に観察できるのでしょうか。実は、自分の心を覗き込む「内省」は、思ったほど当てになりません。この講義では、その限界を知ったうえで、観察を記録として残す方法を身につけます。',
[['気づいていない処理と、内省の限界',
 'ニスベットとウィルソンは、人が自分の判断や行動の原因を説明するとき、実際に働いた要因ではなく、もっともらしい理由を述べてしまう場合があることを論じました。{r:nisbett1977} つまり、「なぜそう感じたか」という自己説明は、いつも正確とは限りません。',
 '本教材でいう「無意識」は、神秘的な力を指しません。「自分では気づいていない情報処理がある」という、控えめな意味で使います。だからこそ、頭の中の説明より、回数・時間・状況といった記録のほうを手がかりにします。'],
['思考はどこから浮かぶのか',
 '思考の多くは、記憶、連想、その場の状況、体の状態に応じて、こちらが選ぶ前に浮かびます。課題をしていない安静時に活動が高まる脳領域のまとまりは、デフォルトモード・ネットワークと呼ばれ、心のさまよいとの関連が研究されています。{r:raichle2001} ただし、脳活動と体験との対応は研究の途上にあり、単純な図式で断定はできません。',
 '大切なのは、「浮かんだ思考は、自分が選んだ結論ではなく、頭に現れた出来事である」と観察できることです。浮かぶこと自体を責める必要はありません。'],
['観察を記録する：四つの軸',
 '観察は、次の四つの軸で、短く事実の言葉で書き留めます。①注意の対象（今、何に注意が向いていたか）、②思考の種類（計画・過去の振り返り・心配など）、③感情（名前と強さ0〜10）、④身体の感覚（肩のこわばり、呼吸の浅さなど）。',
 '感情に名前をつけると、扁桃体の反応が弱まったという実験があります。{r:lieberman2007} ただし、これは実験室での研究であり、日常の悩みにそのまま当てはまるとは限りません。記録は、感情を消す道具ではなく、状況を整理する道具として使います。'],
['観察の落とし穴',
 '観察が評価に変わると、記録は自己批判の材料になります。「ダメだ」と書く代わりに「焦り 6/10、胸がそわそわ」と書く。また、観察のしすぎで疲れることもあります。1日に数回、短時間で十分です。{r:kabatzinn1990}']],
{type:'table',head:['観察の軸','問い','記録の例'],rows:[['注意の対象','今、何に注意が向いていたか','画面ではなく、昼食のことを考えていた'],['思考の種類','どんな種類の考えか','計画／過去／心配／空想'],['感情','名前と強さ（0〜10）','焦り 6'],['身体','どこにどんな感覚があるか','肩がこわばる、呼吸が浅い']],cap:'図1：精神状態の観察記録フォーマット（事実の言葉で、評価を交えない）'},

['気分が悪いときに、原因を決めつける前に、事実を整理できる。','集中の乱れや疲れの傾向（時間帯・状況）を、数字で把握できる。','自分の説明を鵜呑みにしない、批判的な姿勢が身につく。'],
['内省で述べる理由は、実際の原因と一致しない場合がある。','「無意識」は、気づいていない情報処理という控えめな意味で使う。','観察は、注意・思考・感情・身体の四軸で、事実の言葉で記録する。','感情のラベリングの研究は実験室でのもので、日常への一般化は慎重に行う。'],
[mq('Nisbett と Wilson（1977）の議論として、本講義で説明されたものはどれか。',['人は自分の判断の原因を、いつも正確に内省できるとは限らない','内省は常に正確である','無意識は超自然的な力である','思考は完全に制御できる'],0,'自己説明は、もっともらしい理由になってしまう場合があります。'),

 mq('デフォルトモード・ネットワークの説明として適切なものはどれか。',['課題をしていない安静時に活動が高まり、心のさまよいとの関連が研究されている脳領域のまとまり','超能力を司る脳の部位','睡眠中にのみ働く領域','感情を完全に消す回路'],0,'関連の解釈は研究の途上にあります。')],
['nisbett1977','raichle2001','lieberman2007','kabatzinn1990']);

mkL('mental-2-2',
['反芻思考とは何かを説明できる','反復思考に、建設的な面と非建設的な面があるという考え方を説明できる','「気づく→具体化する→注意を切り替える」の手順を実践できる','専門家に相談する目安を理解する'],
'済んだことを何度も頭の中で再生してしまう。答えのない「なぜ」を回し続けてしまう。こうした状態を、心理学では反芻と呼びます。前の講義では、考えを抑え込む方法の難しさを見ました。この講義では、反芻から離れるための、もう少し具体的な道具を見ていきます。',
[['反芻とは何か',
 '反芻とは、特に否定的な内容について、同じ考えを繰り返し考え続けることです。ノーレン＝ホークセマらは、落ち込んだときの反芻的な反応が、抑うつの持続と関連することを報告しました。{r:nolen1991} その後の研究は総説で整理されています。{r:nolen2008}',
 'ただし、考え続けること自体がいつも悪いわけではありません。ワトキンスは、反復思考には建設的なものと非建設的なものがあり、抽象的で「なぜ」ばかりに偏る思考は有害になりやすく、具体的で次の行動に結びつく思考は有益になりうる、と論じています。{r:watkins2008}'],
['注意を切り替える',
 '考えの渦から離れるには、まず「今、同じ考えを回している」と気づくことが出発点になります。そのうえで、注意を別の対象に移します。ただし、人が課題を切り替えるときには、時間のコストや誤りが生じることが知られています。{r:monsell2003} 切り替えは、一瞬で完璧にはできません。うまくいかなくても失敗ではありません。',
 '移す先は、五感（足の裏の感覚、周囲の音）や、短い手作業のように、具体的で感覚に結びつくものが向いています。一時的に離れることと、問題から逃げ続けることは別です。落ち着いてから、必要な課題は具体的に扱います。'],
['三つのステップ',
 '①気づく：「同じ考えを回している」と心の中で言う。②具体化する：「何が起きたか」「次に取れる小さな一歩は何か」を書く。③切り替える：5分間、散歩や手作業など、具体的な対象に注意を向ける。',
 '「なぜ自分はいつもこうなのか」という抽象的な問いは、②で「次に何をするか」という具体的な問いに言い換えます。'],
['注意：専門家に相談する目安',

{type:'flow',items:[['引き金','出来事・気分'],['反芻','同じ考えを回す'],['気づき','ラベリング'],['具体化','次の一歩を書く'],['切り替え','具体的対象へ']],loop:'うまくいかなくても、気づいたこと自体が練習になる',cap:'図1：反芻から離れる流れ（単純化したモデル）'},

[mq('反芻の説明として適切なものはどれか。',['特に否定的な内容を、繰り返し考え続けること','前向きな空想をすること','思考を完全に停止すること','計画を一度で決めること'],0,'同じ否定的な考えの反復を指します。'),

mkL('mental-2-3',
['マインドフルネスの定義の要素を説明できる','認知的脱フュージョンの考え方と、簡単な技法を説明できる','瞑想プログラムの効果についての研究の限界を説明できる'],

['不安な考えに振り回されそうなとき、距離をとる別の選択肢になる。','「効果が報告されている範囲」と「限られる範囲」を区別して、情報を見られる。','実践を、自分の記録で確かめる姿勢が身につく。'],
['マインドフルネスは、意図的に・今この瞬間に・評価せずに注意を向けること。','脱フュージョンは、思考を消すのではなく、思考との関係を変える考え方。','瞑想の効果は、不安・抑うつ・痛みで中程度の根拠が報告されたが、万能ではない。','不快感が強いときは中止し、必要なら専門家に相談する。'],
[mq('マインドフルネスの定義の要素として、本講義で示されたものはどれか。',['意図的に、今この瞬間に、評価せずに注意を向ける','何も考えない状態を保つ','未来を予測し続ける','感情を完全に消す'],0,'三つの要素で捉えます。'),
 mq('認知的脱フュージョンの例として適切なものはどれか。',['「私はダメだ」を「『私はダメだ』という考えが浮かんでいる」と言い換える','考えが浮かんだら強く打ち消す','考えをすべて事実として受け入れる','感情を無視する'],0,'思考との距離を取る言い換えです。'),
 mq('Goyal ら（2014）のメタ分析の説明として適切なものはどれか。',['不安・抑うつ・痛みについて中程度の根拠が報告された一方、すべてに効く万能の方法とは言えない','すべての指標で大きな効果が確認された','効果はまったく見られなかった','瞑想は医療の代わりになる'],0,'効果の範囲と根拠の強さに注意が必要です。'),
 mq('脱フュージョンの目的として適切なものはどれか。',['思考を消すのではなく、思考との関係を変えること','嫌な思考を完全に停止すること','思考を他人に伝えること','記憶を消すこと'],0,'思考を消すことが目的ではありません。')],
['kabatzinn2003','hayes2006','goyal2014','hayes1999']);

mkL('mental-3-1',
['注意の種類（持続・選択・転換）を説明できる','持続的注意の低下や、不注意による見落としの研究を説明できる','集中力を単一の能力ではなく、複数の側面として捉えられる'],
'「集中力がない」という悩みは、よく聞きます。しかし、集中力とは具体的に何でしょうか。長く続くことなのか、一つに絞ることなのか、切り替えがうまいことなのか。この講義では、注意の種類を分けることで、「集中力」という大きな言葉を、扱いやすい部品に分解します。',
[['注意の種類',
 '注意は、大きく分けて次のように整理できます。持続的注意（長い時間、注意を保つ）、選択的注意（多くの刺激から一つを選ぶ）、転換的注意（注意の向け先を切り替える）。カーネマンは、注意を限られた「努力」の資源として捉えました。{r:kahneman1973}'],
['持続的注意：長く続けるほど落ちる',
 'マックワースは、時計の針の小さな動きを長時間監視させる課題で、時間とともに見落としが増えることを示しました。{r:mackworth1948} 集中が続かないのは、意志が弱いからではなく、持続的注意が長時間で低下しやすい性質があるためだと理解できます。'],
['選択的注意と、見えていないもの',
 'チェリーは、複数の音声の中から一つを選んで聞き取る能力を調べました。{r:cherry1953} 一方、サイモンズとチャブリスの「見えないゴリラ」の実験では、ある課題に注意を向けていた参加者の多くが、画面を横切る予想外のものに気づきませんでした。{r:simons1999} 注意を向けていないものは、目に入っていても気づかないことがある、という教訓です。'],
['没頭（フロー）について',
 'チクセントミハイは、課題の難しさと自分の技能が釣り合うとき、没頭した最適体験が生じやすいと論じました。{r:csik1990} 一般向けの色彩もある理論なので、「条件のひとつの見方」として扱い、自分の記録で確かめます。']],
{type:'table',head:['注意の種類','内容','日常の例'],rows:[['持続的注意','長い時間、注意を保つ','1時間の読書、運転、監視作業'],['選択的注意','多くの刺激から一つを選ぶ','騒がしい場所で相手の声を聞く'],['転換的注意','向け先を切り替える','作業を中断して、また戻る'],['分割的注意','複数に同時に向ける（限界が大きい）','話しながら歩く']],cap:'図1：注意の種類と日常の例'},
['読書中の集中が20分で切れるなら、「持続的注意が20分で落ちる」と捉え、休憩を入れる設計にする。','駅の雑踏で友人の声が聞こえるのは、選択的注意が働いているため。'],
['「集中力がない」を、どの種類の問題か分解して考えられる。','長時間作業での集中低下を、性格ではなく性質として理解できる。','「気づかないこと」があるのは普通だと知り、確認の習慣を持てる。'],
['注意は、持続・選択・転換などの種類に分けて考える。','長時間の監視では、時間とともに見落としが増える。','注意を向けていないものには、気づかないことがある。','没頭の条件についての見方は、自分の記録で確かめる。'],
[mq('Mackworth（1948）の研究で示されたこととして適切なものはどれか。',['長時間の監視作業で、見落としが増えること','注意は無限に保てること','睡眠は注意に無関係であること','マルチタスクは常に有効であること'],0,'持続的注意（警戒）は時間とともに低下しやすい。'),
 mq('Simons と Chabris（1999）の実験から言えることとして適切なものはどれか。',['注意を向けていない対象には、目に入っていても気づかないことがある','人は見たものをすべて覚えている','ゴリラは必ず見える','注意は意識と無関係である'],0,'不注意による見落としが起こりえます。'),
 mq('選択的注意の説明として適切なものはどれか。',['多くの刺激の中から、一つを選んで注意を向けること','注意を長時間保つこと','注意を完全に停止すること','複数の作業を完全に同時に行うこと'],0,'カクテルパーティー効果が例です。'),
 mq('本講義での、集中力の捉え方として適切なものはどれか。',['単一の能力ではなく、複数の側面に分けて捉える','生まれつき決まっていて変えられない','意志の強さだけで決まる','測定できない'],0,'分解することで、扱いやすくなります。')],
['kahneman1973','mackworth1948','cherry1953','simons1999','csik1990']);

mkL('mental-3-2',
['課題の切り替えやマルチタスクのコストを説明できる','研究結果の限界（相関と因果、追試）を踏まえて情報を読める','自分の作業環境を設計し、効果を測って検証できる'],
'集中を妨げるものは、意志の弱さよりも、環境にあることが多いものです。通知、机の上のスマートフォン、複数の作業の同時進行。しかし、「スマートフォンは集中を壊す」といった断定的な話には、慎重に向き合う必要があります。この講義では、根拠と限界の両方を見ながら、環境を設計します。',
[['切り替えコスト',
 '課題を切り替えると、時間のコストが生じることが、実験で示されています。{r:rubinstein2001} 通知に反応して、また戻るたびに、小さなコストが積み重なります。「同時に二つのことをしている」つもりが、実際には素早く切り替えているだけの場合が多い、という見方です。'],
['マルチタスクの習慣と注意',
 'オフィールらは、メディアを同時に多用する人は、関係のない刺激を無視することが苦手な傾向を報告しました。{r:ophir2009} ただし、これは相関を見た研究です。「マルチタスクが注意力を悪くする」のか、「注意が散りやすい人がマルチタスクをする」のかは、この研究だけでは分かりません。'],
['スマートフォンの存在',
 'ウォードらは、スマートフォンが近くにあるだけで、課題成績が下がると報告しました。{r:ward2017} ただし、追試では結果が一貫しないという報告もあり、効果の大きさや条件はまだ議論されています。「根拠が完全に固まった事実」とは言えない、という見方が妥当です。'],
['環境を設計し、自分で確かめる',
 '設計の例：通知を切る、スマートフォンを別の部屋に置く、机の上を片づける、開始のきっかけを決める（「もし椅子に座ったら、最初に3分間タイマーをかける」のような実行意図{r:gollwitzer1999}）。そのうえで、変更の前後で、集中できた時間と中断回数を記録して比べます。研究の平均より、自分のデータが大切です。']],
{type:'table',head:['妨げる要因','設計の例','確かめ方'],rows:[['通知','通知を切る／機内モード','中断回数を記録'],['スマートフォン','別の部屋に置く','集中できた時間を記録'],['机の上','作業に不要な物を片づける','作業開始までの時間を記録'],['作業の切り替え','1回の作業単位を決める','完了までにかかった時間を記録']],cap:'図1：環境設計と検証の例'},
['1週間、スマートフォンを別の部屋に置く日と手元に置く日を交互に設け、25分間の中断回数を記録して比べる。','通知を切った日と切らなかった日で、作業開始までの時間を比べる。'],
['集中できない原因を、環境の面から見直せる。','話題の研究結果に飛びつかず、限界を踏まえて判断できる。','自分に合う環境を、データで選べる。'],
['課題を切り替えると、時間のコストが生じる。','マルチタスクの研究には、相関と因果の区別が必要。','スマートフォンの影響の研究は、追試で結果が一貫しないものがあり、慎重に扱う。','環境設計は、自分の記録で確かめる。'],
[mq('Ophir ら（2009）の研究についての説明として適切なものはどれか。',['相関を見た研究であり、因果関係までは示していない','マルチタスクが注意を悪くすることを証明した','マルチタスクは常に有益だと示した','睡眠の研究である'],0,'因果の向きは、この研究だけでは分かりません。'),
 mq('Ward ら（2017）の結果の扱いとして適切なものはどれか。',['追試で結果が一貫しない報告もあり、慎重に扱う','完全に確立した事実として扱う','研究は存在しない','スマートフォンは無関係と断定する'],0,'効果の大きさや条件はまだ議論されています。'),
 mq('課題の切り替えについて、本講義の説明として適切なものはどれか。',['切り替えには時間のコストが生じる','切り替えはコストなしにできる','マルチタスクは常に効率的','通知は集中に影響しない'],0,'Rubinstein らの実験が示しています。'),
 mq('環境設計に対する本教材の方針として適切なものはどれか。',['妨げる要因を減らし、自分の記録で効果を確かめる','研究の平均値だけを信じる','環境は関係ないと考える','記録はしない'],0,'自分のデータが最も重要です。')],
['rubinstein2001','ophir2009','ward2017','gollwitzer1999']);

mkL('mental-3-3',
['集中を測る指標（時間・中断回数・課題成績・主観評価）を説明できる','訓練の効果についての研究の限界（転移）を説明できる','段階的な集中トレーニングを自分で設計できる'],
'「集中力を鍛える」と言うとき、何がどれだけ向上したら「鍛えた」と言えるのでしょうか。測らなければ、変化は分かりません。この講義では、集中を測る方法と、訓練の効果についての研究の限界を学び、記録を伴うトレーニングを設計します。',
[['集中を測る',
 '日常で使える指標は四つです。①連続して集中できた時間、②中断（気づいて戻した）回数、③課題成績（読めたページ数、正答数など）、④主観的な集中度（0〜10）。客観の指標（①②③）と主観（④）を分けて記録します。',
 '研究では、単純な反応時間を測る課題が、警戒状態の指標として用いられます（精神運動警戒課題）。{r:dinges1985} 日常でこれをそのまま行う必要はありませんが、「同じ条件で繰り返し測る」ことが大切だという点は共通です。'],
['訓練の効果：何が上がったのか',
 'マインドフルネス訓練が注意の一部の機能を変えたとする研究があります。{r:jha2007} 一方、作業記憶のトレーニングのメタ分析では、訓練した課題の成績は上がっても、他の能力への転移は限定的だったと報告されました。{r:melby2013}',
 'ここから、「訓練した課題が上手くなること」と「集中力全般が上がること」は別だと分かります。本教材の課題でも、「この練習で、この指標がどう変わったか」と、範囲を区切って記録します。'],
['段階的に延ばす',
 '10分→20分→30分と、1日ずつ、または数日ずつ延ばします。途中で無理をせず、中断回数が増えたら前の長さに戻します。実験室の課題（一点集中、音への注意、視覚的注意、10・20・30分実験）で、記録を残してください。'],
['測定の注意',
 '測ること自体が、集中の仕方を変えることがあります。また、日による体調の差も大きいので、1日の結果で判断せず、数日分の傾向を見ます。事前に「何を指標にするか」を決めておくことで、都合のよい数字だけを見てしまうのを防げます。']],
{type:'flow',items:[['測る','時間・回数・主観'],['練習','10→20→30分'],['記録','同じ形式で'],['比較','数日の傾向'],['調整','長さ・方法を見直す']],loop:'指標は事前に決めておく（後から選ばない）',cap:'図1：測定とトレーニングのサイクル'},
['朝の読書を25分、中断回数と読んだページ数を毎日記録し、1週間の平均を比べる。','10分で中断が多い日は、翌日も10分に戻して記録する。'],
['勉強や仕事の集中を、感覚ではなく数字で見られる。','「やった気がする」を避けて、成果を確認できる。','訓練の宣伝文句を、転移の観点から冷静に読める。'],
['集中は、時間・中断回数・課題成績・主観評価で測る。','訓練した課題が上手くなることと、集中力全般が上がることは別。','10→20→30分と段階的に延ばし、無理なら戻す。','指標は事前に決め、数日の傾向で判断する。'],
[mq('Melby-Lervåg と Hulme（2013）のメタ分析で知られる点として適切なものはどれか。',['訓練した課題の成績は上がるが、他の能力への転移は限定的','訓練で知能が大きく上がる','訓練は全く効果がない','訓練は逆効果である'],0,'「訓練した課題」と「全般的な能力」を区別します。'),
 mq('精神運動警戒課題（PVT）の説明として適切なものはどれか。',['単純な反応時間を測る課題で、警戒状態の指標として使われる','記憶力を測る課題','感情を測る質問紙','睡眠の長さを測る装置'],0,'同じ条件で繰り返し測ることが重要です。'),
 mq('集中の測定の記録として適切なものはどれか。',['客観的な指標と主観的な評価を分けて記録する','主観だけで記録する','後から都合のよい指標を選ぶ','記録せず記憶に頼る'],0,'事前に指標を決めておくことが大切です。'),
 mq('集中トレーニングの延ばし方として適切なものはどれか。',['10分→20分→30分と段階的に延ばし、無理なら前の長さに戻す','最初から長時間行う','中断が増えても続ける','毎日違う方法を試して記録しない'],0,'無理をしないことが前提です。')],
['dinges1985','jha2007','melby2013','kahneman1973']);

mkL('mental-4-1',
['感情についての主な理論（ジェームズ、シャクター＝シンガー、構成主義）を説明できる','それらが競合する理論であり、決定版ではないことを理解できる','感情を無理に消さず、認識して扱う姿勢を説明できる'],
'「感情はどこから来るのか」。心臓がどきどきするから不安になるのか、不安だからどきどきするのか。この問いには、複数の理論があり、研究者の間でも議論が続いています。この講義では、主な三つの見方を並べて、感情と身体反応の関係を整理します。',
[['ジェームズの見方：身体反応が先',
 'ウィリアム・ジェームズは、身体の変化の知覚こそが感情である、という説を提示しました。{r:james1884} 「泣くから悲しい」という逆説的な言い方で語られることもあります。感情を、身体の感覚から捉え直す視点です。'],
['シャクター＝シンガーの見方：覚醒と解釈',
 'シャクターとシンガーは、生理的な覚醒と、その状況に対する解釈の組み合わせで、感情が決まると論じました。{r:schachter1962} 同じ動悸でも、状況によって「不安」とも「高揚」とも解釈されうる、という考えです。ただし、この実験は後続の研究で結果が一貫せず、議論が続いています。'],
['構成主義的な見方',
 'バレットは、感情を、脳が身体の感覚と文脈をもとに構成するものとして説明する理論を提唱しています。{r:barrett2017} 感情の「種類」は、あらかじめ決まった箱ではなく、経験や言葉によって形づくられる、という考えです。'],
['どの理論も決定版ではない',
 'これらの理論は、競合しながら並存しており、どれか一つが決定版というわけではありません。本教材では、「出来事→解釈→身体反応→感情の体験→行動」という大まかな流れを手がかりに、身体の感覚と解釈の両方を観察します。感情を消すことを目的とせず、認識して、状況に応じた反応を選べることを目指します。']],
{type:'flow',items:[['出来事','状況'],['解釈','評価・意味づけ'],['身体反応','動悸・緊張'],['感情の体験','名前がつく'],['行動','反応を選ぶ']],loop:'身体反応や行動が、次の解釈に影響する',cap:'図1：感情が生じる流れ（理論により見方が異なる単純化したモデル）'},
['発表前の動悸を、「不安」と呼ぶか、「準備ができている体の反応」と見るかで、感じ方が変わる場合がある。','運動後の動悸と、不安のときの動悸は、感覚が似ていることがある。'],
['緊張したときに、「失敗の予兆」と決めつけず、観察するきっかけになる。','身体の感覚を手がかりに、感情に気づけるようになる。','感情を消そうとせず、選べる反応を考えられる。'],
['感情には、ジェームズ、シャクター＝シンガー、構成主義などの見方がある。','どの理論も決定版ではなく、議論が続いている。','身体の感覚と解釈の両方が、感情の体験に関わると考えられる。','感情は消すのではなく、認識して反応を選ぶ。'],

 mq('Schachter と Singer（1962）の考えとして適切なものはどれか。',['生理的な覚醒と、状況の解釈の組み合わせで感情が決まる','感情は覚醒と無関係','解釈は感情に影響しない','感情は睡眠中にのみ生じる'],0,'後続研究で結果が一貫せず、議論が続いています。'),

mkL('mental-4-2',
['ゆっくりした呼吸と漸進的筋弛緩法の考え方を説明できる','無理のない範囲で呼吸法を実践し、前後の変化を記録できる','中止すべき状態と、医師に相談すべき場合を理解する'],

[['ゆっくりした呼吸',

 '練習の例：鼻から4秒かけて吸い、6秒かけて吐く（数え方は目安）。吐く息を少し長くする。無理に深く吸わず、楽な範囲で行います。'],
['漸進的筋弛緩法',

['リラクゼーション反応という考え方',
 'ベンソンは、静かな環境で、同じ語や動作に注意を向けることで生じる、生理的な落ち着きを「リラクゼーション反応」と呼びました。{r:benson1975} 一般向けの書籍であり、個々の主張は研究で確かめられている範囲を区別して読みます。'],
['安全のために',

{type:'table',head:['方法','やること','記録する指標'],rows:[['ゆっくりした呼吸','吸う4秒・吐く6秒（目安）を数分','前後の緊張度（0〜10）、実施時間'],['漸進的筋弛緩法','部位ごとに5秒緊張→緩める','前後の緊張度、緩んだ部位の感覚'],['数を数える呼吸','呼吸を数えて雑念に気づく','数え間違えた回数']],cap:'図1：リラクゼーションの方法と記録'},

[mq('漸進的筋弛緩法の説明として適切なものはどれか。',['筋肉を意図的に緊張させてから緩める練習','筋肉を使わないようにする練習','息を長く止める練習','睡眠薬を使う方法'],0,'緊張と弛緩の違いに気づくことが目的です。'),

mkL('mental-4-3',
['感情調整の方略（状況選択・注意・再評価・抑制）の違いを説明できる','認知的再評価の手順を実践できる','「ポジティブに考える」と再評価の違いを説明できる'],
'同じ出来事でも、人によって感じ方は違います。出来事そのものではなく、その「見方」が感情に影響するという考えは、古くからあります。この講義では、見方を変えて感情を調整する認知的再評価を、「無理に前向きになる」こととの違いを含めて学びます。',
[['感情調整のプロセスモデル',
 'グロスは、感情が生じる過程のどこに働きかけるかで、感情調整の方略を整理しました。{r:gross1998} 状況を選ぶ、状況を変える、注意を向け直す、見方を変える（認知的再評価）、表れた反応を抑える、といった段階です。早い段階に働きかける方略と、遅い段階に働きかける方略がある、という考え方です。'],
['再評価と抑制',
 'グロスとジョンは、質問紙を用いて、認知的再評価をよく使う人と、感情の表出を抑制することをよく使う人で、感情経験・対人関係・幸福感に違いがあることを報告しました。{r:gross2003} 再評価をよく使う人のほうが好ましい傾向が見られましたが、質問紙による相関の研究であり、因果関係は断定できません。'],
['再評価の手順',
 '認知療法の考え方を参考にした、簡単な記録の形式です。{r:beck1979} ①状況（事実だけ）、②最初に浮かんだ解釈、③感情の名前と強さ（0〜10）、④別の解釈の候補（根拠があるもの）、⑤別の解釈を考えた後の感情の強さ。',
 '大切なのは、「ポジティブに考える」ことではありません。現実に根拠のある、別の見方を探すことです。根拠のない楽観は、再評価ではありません。'],
['感情との距離をとる',
 '自分の状況を三人称で書く（「彼は〜と考えている」）、時間をおいて見直す、感情に名前をつける{r:lieberman2007}、といった方法があります。いずれも、感情を消すためではなく、感情と状況を切り分けて見るための方法です。強い苦痛が続く場合は、専門家に相談してください。']],
{type:'table',head:['記録項目','内容','例'],rows:[['状況','事実だけ','会議で意見が通らなかった'],['最初の解釈','浮かんだ考え','自分は無能だと思われた'],['感情（強さ）','名前と0〜10','恥ずかしさ 7'],['別の解釈','根拠のある見方','提案の時期が合わなかっただけかもしれない'],['再評価後の感情','0〜10','恥ずかしさ 4']],cap:'図1：認知的再評価の記録フォーマット'},

['感情が強いときに、状況と解釈を分けて整理できる。','根拠のない楽観や、自己批判の決めつけの両方を避けられる。','感情を消さずに、反応を選ぶ余地を作れる。'],

[mq('認知的再評価の説明として適切なものはどれか。',['状況に対する見方を、根拠のある形で見直すこと','感情を無視すること','根拠なく楽観的に考えること','感情を完全に消すこと'],0,'根拠のある別の見方を探します。'),
 mq('Gross と John（2003）の研究についての説明として適切なものはどれか。',['質問紙による研究で、再評価をよく使う人に好ましい傾向が見られたが、因果は断定できない','因果関係を実験的に証明した','抑制が常に有益だと示した','感情と無関係だった'],0,'相関研究であることに注意します。'),

 mq('「ポジティブに考える」ことと再評価の違いとして適切なものはどれか。',['再評価は、根拠のある別の見方を探すこと','両者はまったく同じ','再評価は根拠のない楽観を勧める','再評価は感情を無視する'],0,'根拠の有無が重要です。')],
['gross1998','gross2003','beck1979','lieberman2007']);

mkL('mental-4-4',
['ストレスを「出来事と評価・対処の相互作用」として説明できる','問題焦点型と情動焦点型の対処の違いを説明できる','睡眠と感情調整の関連を、限界を踏まえて説明できる','睡眠や気分が長く乱れる場合の相談の目安を理解する'],

[['ストレスは「出来事」だけではない',

['睡眠と精神状態',

['相談の目安',

{type:'flow',items:[['出来事','要求・負荷'],['評価','脅威か／対処できるか'],['対処','問題焦点・情動焦点'],['結果','心身の状態'],['睡眠','回復の土台']],loop:'結果と睡眠の状態が、次の評価に影響する',cap:'図1：ストレスの評価と対処（単純化したモデル）'},
['期限が迫る仕事に、問題焦点型（優先順位をつけて相談する）と、情動焦点型（呼吸法で落ち着く）を組み合わせる。','1週間の睡眠時間と、翌日の集中度を記録して、傾向を見る。'],

mkL('mental-5-1',
['瞑想を「注意を焦点化する型」と「観察する型」に整理して説明できる','東洋・西洋の瞑想思想の流れを、断定を避けて概観できる','瞑想に伴う有害事象の研究を踏まえ、安全に実践できる'],

[['歴史の概観',

 '西洋では、20世紀後半に、宗教的な文脈から切り離した形でのマインドフルネスのプログラムが整えられ、医療・心理の分野に広まりました。{r:kabatzinn1990} ここで、伝統的な実践の目的と、現代のプログラムの目的とは、同じではない点に注意します。'],
['技法の整理：集中と観察',
 'ルッツらは、瞑想を、注意を一つの対象に絞る「焦点化された注意」の型と、浮かぶ体験を開かれた態度で観察する「開かれたモニタリング」の型に整理しました。{r:lutz2008} 本教材の実践課題でいえば、呼吸への一点集中は前者、浮かぶ思考や感覚をそのまま眺める練習は後者にあたります。',
 '具体的な練習：①呼吸瞑想（呼吸の感覚に注意を向ける）、②集中瞑想（炎・音・語などの対象に集中する）、③観察瞑想（浮かぶ思考や感覚に、評価せず気づく）。'],
['研究の成果と限界',
 '瞑想の心理的効果についてのメタ分析では、不安や感情面での効果が報告されていますが、研究の質や方法にはばらつきがあります。{r:sedlmeier2012} 効果が報告されている範囲と、証拠が限られる範囲を、分けて受け止めます。'],
['有害事象について',
 'ブリットンらは、マインドフルネス・プログラムに関連して報告される、不快な体験や有害事象の定義と測定を扱いました。{r:britton2021} 実践中に、不安の高まり、現実感の薄れ、つらい記憶の想起などが起きる場合があります。万人に起こるものではありませんが、「瞑想は誰にとっても安全で有益」とは言えません。',
 '対処の基本は、無理をしないことです。実践中に強い不快感が起きたら、目を開けて周囲を見る、座るのをやめるなどして中止し、続く場合は専門家に相談してください。']],
{type:'table',head:['型','内容','練習の例'],rows:[['焦点化された注意','注意を一つの対象に保つ','呼吸、音、炎、語への集中'],['開かれたモニタリング','浮かぶ体験を評価せず観察する','思考・感情・感覚の観察'],['実践の安全','無理をしない、中止してよい','不快感が強ければ目を開けて中止']],cap:'図1：瞑想技法の整理と安全の原則'},

 mq('瞑想の研究についての説明として適切なものはどれか。',['効果が報告される範囲もあるが、研究の質にばらつきがある','すべての人に万能に効く','効果はまったくない','研究は存在しない'],0,'報告された範囲と限界を分けて受け止めます。'),
 mq('瞑想中に強い不快感が生じたときの対応として適切なものはどれか。',['無理をせず中止し、続く場合は専門家に相談する','我慢して続ける','もっと長く行う','記録をやめる'],0,'有害事象も報告されています。'),
 mq('現代のマインドフルネス・プログラムと伝統的な実践について適切な説明はどれか。',['目的や文脈が異なる場合があり、同一視しない','完全に同じ','現代のものは宗教そのもの','伝統的な実践は存在しない'],0,'違いに注意して学びます。')],
['lutz2008','sedlmeier2012','britton2021','kabatzinn1990']);

mkL('mental-5-2',
['自己暗示の歴史的主張と、現代心理学による検討を区別できる','催眠の定義と、理論の対立（状態論・非状態論）を説明できる','催眠について「相手を意のままに操れる」という主張が誤りであることを説明できる','アファメーションの効果の個人差を、研究に基づいて説明できる'],
'「自己暗示で人生が変わる」「催眠で人を操れる」。魅力的な言葉ですが、根拠を見ると、言えることと言えないことが大きく分かれます。この講義では、歴史的な主張、現代の研究による検討、そして誇張された説明を、丁寧に区別します。',
[['自己暗示の歴史',
 'フランスの薬剤師エミール・クーエは、20世紀初頭に、意識的な自己暗示による自己改善法を提唱しました。{r:coue1922} 「日々、あらゆる面で、私はますますよくなっている」という定型句で知られます。これは歴史的な主張であり、その効果が現代の研究で確立されているわけではない点を、区別します。'],
['催眠とは何か',
 '米国心理学会第30部会は、催眠を、注意の集中と周辺的な気づきの低下を伴い、暗示への反応性が高まる状態、または過程として定義しています。{r:elkins2015} 一方、催眠が特別な意識状態なのか、期待・役割・注意といった通常の心理過程で説明できるのかについては、議論が続いています。{r:kirsch1995} 本教材は、どちらかに断定しません。',
 '臨床・研究では、催眠が痛みの軽減に有効な場合があることが、メタ分析で報告されています。{r:montgomery2000} ただし、暗示への反応しやすさには個人差が大きく、すべての人に同じように効くわけではありません。'],
['誇張された説明について',
 '「催眠で、相手を意のままに操れる」「望まない行動を取らせられる」といった説明は、研究では支持されていません。催眠状態でも、本人は自分の価値観や意思を保っているとされます。他人を操作する目的での活用は、本教材の対象外です。他人を対象とする催眠は、資格をもつ専門家が適切な場で行うべきものです。'],
['自己催眠・アファメーションの限界',
 'ウッドらは、肯定的な自己宣言を行った結果、自尊心の低い人では、条件によってかえって気分が悪化したと報告しました。{r:wood2009} 一方、自己肯定を行った際の脳活動を調べた研究もあります。{r:cascio2016} 効果は、人や条件によって異なる、というのが慎重な結論です。',
 '本教材では、自己暗示を「効く／効かない」と断定せず、自分の記録で確かめる対象として扱います。つらくなる場合は、やめてかまいません。']],
{type:'table',head:['主張','位置づけ','本教材での扱い'],rows:[['クーエの自己暗示','歴史的な主張','効果は確立されていない。記録で検証する'],['催眠は暗示への反応性が高まる状態・過程','現代の定義','理論の対立がある。断定しない'],['催眠で痛みが軽くなる場合がある','メタ分析で報告','個人差が大きい'],['催眠で人を意のままに操れる','誇張','研究で支持されない。扱わない'],['肯定的な自己宣言は誰にでも効く','単純化','自尊心の低い人で逆効果の報告']],cap:'図1：自己暗示・催眠に関する主張の整理'},
['アファメーションを1週間行い、前後の気分と、行動の変化（実行した日数など）を記録する。気分が悪化したら中止する。','「自分は集中できる」と唱えた日と、何もしなかった日で、中断回数を比べる。'],
['誇張された宣伝を、根拠の観点から見分けられる。','自己暗示を、期待や注意との関係から、冷静に捉えられる。','他者を操作しない、という倫理を、最初から前提にできる。'],
['自己暗示は歴史的な主張であり、効果の確立は別の問題。','催眠は、定義や理論の対立があり、断定を避ける。','痛みの軽減などの報告があるが、個人差が大きい。','「意のままに操れる」という説明は誤りで、扱わない。'],
[mq('「催眠で相手を意のままに操れる」という説明の位置づけとして適切なものはどれか。',['研究で支持されない誇張','証明された事実','本教材の目的','安全な技術'],0,'本人は価値観や意思を保っているとされます。'),
 mq('Wood ら（2009）の報告として適切なものはどれか。',['自尊心の低い人では、肯定的な自己宣言でかえって気分が悪化した条件があった','誰にでも効果があった','効果はまったくなかった','自己宣言は睡眠を改善した'],0,'効果は人や条件で異なります。'),
 mq('催眠の理論についての説明として適切なものはどれか。',['特別な状態か、通常の心理過程で説明できるかについて議論が続いている','すべて決着している','催眠は存在しない','超自然的な力による'],0,'断定しません。'),
 mq('Coué の自己暗示の位置づけとして適切なものはどれか。',['歴史的な主張であり、効果は現代の研究で確立されたとは言えない','現代科学で確立された方法','催眠の代わりになる医療','必ず効果がある'],0,'歴史的主張と検証済みの事実を区別します。')],
['coue1922','elkins2015','kirsch1995','montgomery2000','wood2009','cascio2016']);

mkL('mental-5-3',
['プラセボ効果とノセボ効果を、定義とともに説明できる','「プラセボは常に強力」という主張の根拠が限られることを説明できる','期待と暗示の作用を、自己実験に活かす際の注意を述べられる'],
'薬ではない偽薬で、症状が楽になることがある。逆に、「副作用があるかもしれない」と思うだけで、不調を感じることがある。プラセボ効果とノセボ効果は、期待と暗示が心身に与える影響を示す、興味深い現象です。同時に、誤解の多い分野でもあります。',
[['プラセボ効果',
 'ビーチャーは1955年の論文で、プラセボの効果を強調しました。{r:beecher1955} しかしその後、方法論上の批判があり、結果の解釈は見直されています。無治療の群と比較した系統的レビューでは、プラセボの効果は、主に痛みや吐き気など患者の主観的な評価で見られやすい一方、客観的な指標では明確でない場合が多いと報告されています。{r:hrobj2010} 「プラセボは強力な万能の力」という説明は、この点で誇張です。'],
['偽薬と明かして行うプラセボ',
 'カプチャックらは、偽薬であることを伝えたうえで投与しても、症状が改善したと報告しました。{r:kaptchuk2010} ただし、小規模な研究であり、追試が必要とされています。この結果も、断定せずに受け止めます。'],
['ノセボ効果',
 'ノセボ効果は、否定的な期待によって、症状が悪化したり、副作用が現れたりする現象です。{r:colloca2011} 医療の現場では、説明の仕方が期待に影響することが指摘されています。期待は、注意の向け方を変え、身体の感覚の解釈に影響すると考えられます。'],
['自己実験での注意',
 '自己暗示や儀式の効果を調べるとき、期待そのものが結果に影響します。だからこそ、主観の評価だけでなく、客観的な指標（実行できた日数、課題成績など）も記録し、可能なら比較条件を設けます。「効いた気がする」ことと、「実際に変化した」ことは、区別して記録します。']],
{type:'table',head:['','プラセボ効果','ノセボ効果'],rows:[['期待の向き','肯定的な期待','否定的な期待'],['現れ方','主観的な症状の改善が中心','症状の悪化・副作用の出現'],['研究上の注意','客観指標では明確でないことが多い','説明の仕方が影響しうる'],['自己実験への示唆','主観と客観を分けて記録する','否定的な暗示を避ける言い方にする']],cap:'図1：プラセボ効果とノセボ効果'},
['集中の自己実験で、「この音楽で集中できる」と信じて聞いた日と、何も言わずに聞いた日を比べる。','薬の説明書の副作用を読んだ後に、その症状が気になった経験を、ノセボ効果の観点で振り返る（体調の不安は専門家に相談）。'],
['健康情報の「万能」な主張を、冷静に評価できる。','期待が体験に影響することを前提に、実験を設計できる。','主観と客観を分ける習慣がつく。'],
['プラセボ効果は、主に主観的な評価で見られやすい。','ノセボ効果は、否定的な期待による悪化の現象。','偽薬と明かした投与の研究は、小規模で追試が必要。','自己実験では、主観と客観の指標を分けて記録する。'],
[mq('プラセボ効果についての本講義の説明として適切なものはどれか。',['主に痛みなど主観的な評価で見られやすく、客観指標では明確でないことが多い','常に強力で万能','存在しない','超自然的な力である'],0,'「万能」という説明は誇張です。'),
 mq('ノセボ効果の説明として適切なものはどれか。',['否定的な期待によって、症状が悪化したり副作用が現れたりする現象','肯定的な期待で改善する現象','薬の本来の効果','睡眠の効果'],0,'説明の仕方が期待に影響します。'),
 mq('Kaptchuk ら（2010）の研究の扱い方として適切なものはどれか。',['小規模な研究であり、追試が必要として受け止める','確立した事実として扱う','偽薬は必ず効くと結論する','研究は存在しないとする'],0,'断定を避けます。'),
 mq('自己実験の設計として適切なものはどれか。',['主観の評価と客観の指標を分けて記録する','主観だけで判断する','結果の良い日だけを記録する','期待は影響しないと考える'],0,'期待が結果に影響します。')],
['beecher1955','hrobj2010','kaptchuk2010','colloca2011']);

mkL('mental-6-1',
['文脈の手がかりと習慣の関係を説明できる','学習・作業・休息モードへの切り替えを、手がかりで設計できる','習慣形成の日数には個人差が大きいことを説明できる'],
'「机に向かうと勉強モードになる」「ベッドに入ると眠くなる」。場所や動作が、状態の切り替えのきっかけになることは、日常でよく経験します。この講義では、その仕組みを、習慣と文脈の研究から整理し、自分で意図的に切り替えを設計する方法を学びます。',
[['文脈の手がかり',
 'ウッドとニールは、習慣は、繰り返された行動と、それを行った文脈（場所、時刻、直前の行動など）が結びつくことで、文脈の手がかりによって引き起こされやすくなる、と論じました。{r:wood2007} 同じ場所で同じ作業を繰り返すと、その場所が作業への入りやすさのきっかけになる、という見方です。',
 '環境と想起の関係を示す古典的研究として、学習した環境と同じ環境で想起すると、成績が良かったという報告もあります。{r:godden1975} 場所の影響は、注意や記憶にも及びえます。'],
['モードの切り替えを設計する',
 '三つのモードを、それぞれ別の手がかりで切り替えます。例：学習モード（机に座る→タイマーを置く→最初の課題を声に出す）、作業モード（PCを開く→通知を切る→優先作業を一つ決める）、休息モード（立ち上がる→窓の外を見る→呼吸を数回）。{r:gollwitzer1999} のように、「もしAなら、Bをする」と決めておくと、開始しやすくなります。'],
['習慣になるまでの日数',
 'ラリーらは、日常の行動が習慣になるまでの日数を調べ、個人や行動によって大きく異なると報告しました。{r:lally2010} 「21日で習慣になる」といった決まった数字は、一般化できません。続かなくても、意志の弱さではなく、設計の見直しの材料として扱います。'],
['記録して比較する',
 '手がかりを設けた日と設けなかった日で、作業への入りやすさ（0〜10）、開始までの時間を記録し、比べます。実験室の課題（作業開始前ルーティンの記録）と連動しています。']],
{type:'flow',items:[['手がかり','場所・動作・時刻'],['ルーティン','短い手順'],['状態の切り替え','注意が向く'],['作業開始','最初の一歩'],['記録','入りやすさ（0〜10）']],loop:'記録を見て、手がかりと手順を調整する',cap:'図1：切り替えの設計と検証'},
['勉強専用の机を決め、座ったら必ず「今日の最初の課題」を声に出す。','休憩のたびに立ち上がって窓の外を見て、数回呼吸する。'],
['作業に入るまでの「重さ」を、手がかりで軽くできる。','モードを分けることで、切り替えの疲れを減らせる。','習慣の日数を、他人と比べず、自分のペースで見られる。'],
['習慣は、文脈の手がかりによって引き起こされやすくなる。','モードの切り替えは、手がかりと短い手順で設計できる。','習慣形成に要する日数は個人差が大きい。','記録して比較し、手順を調整する。'],
[mq('Wood と Neal（2007）の考え方として適切なものはどれか。',['習慣は文脈の手がかりによって引き起こされやすくなる','習慣は意志だけで決まる','文脈は習慣と無関係','習慣は21日で必ず形成される'],0,'場所・時刻・直前の行動が手がかりになります。'),
 mq('Lally ら（2010）の報告として適切なものはどれか。',['習慣になるまでの日数は、個人や行動により大きく異なる','21日で必ず習慣になる','習慣は形成されない','日数は全員同じ'],0,'決まった日数への一般化はできません。'),
 mq('切り替えの設計として適切なものはどれか。',['手がかりと短い手順をモードごとに決め、効果を記録する','毎日気分で決める','記録せず感覚で判断する','手がかりを避ける'],0,'実行意図の形（もしAならB）も有効です。'),
 mq('習慣が続かなかったときの捉え方として適切なものはどれか。',['設計を見直す材料として扱う','意志が弱いと責める','記録をやめる','習慣は不可能と結論する'],0,'責めるのではなく、設計の問題として見直します。')],
['wood2007','godden1975','lally2010','gollwitzer1999']);

mkL('mental-6-2',
['儀式の心理学研究の内容と限界を説明できる','「儀式が効く」という主張に潜むバイアスを説明できる','安全で、再現可能な小さな儀式を設計できる'],
'儀式は、宗教、スポーツ、学校、職場など、あらゆる場所にあります。魔術の世界でも、儀式は中心的な要素でした。この講義では、儀式が心理に与える影響を、研究に基づいて検討します。魔術的な説明と、心理学的な説明を、ここでも区別します。',
[['儀式の心理学',
 'ホブソンらは、儀式に関する心理学研究を整理し、儀式が感情の調整、パフォーマンス、集団の結びつきなどに関わるとする枠組みを提案しました。{r:hobson2018} 儀式は、決まった、象徴的な動作の連なりとして、注意を整える働きをもつ可能性があります。'],
['不安とパフォーマンス',
 'ブルックスらは、儀式を行った参加者が、不安が低く、課題の成績が高かったと報告しました。{r:brooks2016} また、縁起を担ぐと課題成績が上がったと報告した研究もありますが、{r:damisch2010} 追試の結果は一貫しません。「儀式をすれば必ず成績が上がる」とは言えません。'],
['儀式の効果を考えるときのバイアス',
 '儀式を行った日の良い結果だけが記憶に残る（確証バイアス）、期待そのものが成績や感じ方を変える（期待効果）、といった影響が入り込みます。{r:colloca2011} 儀式の効果を調べるには、行わなかった日と比べる必要があります。'],
['魔術的な説明と心理学的な説明',
 '魔術の伝統では、儀式は超自然的な力に働きかける行為として説明されることがあります。本教材は、その主張を歴史的・思想的な主張として紹介しますが、事実としては扱いません。一方、心理学的な説明（注意の方向づけ、期待、不安の軽減、習慣の手がかり）は、検証できる形で扱います。'],
['小さな儀式の設計の原則',
 '①短い（1〜3分）、②毎回同じ手順、③象徴や動作に自分なりの意味を与える、④安全で、他人に迷惑をかけない、⑤効果を記録で確かめる、⑥合わなければやめる。']],
{type:'table',head:['観点','魔術的な説明','心理学的な説明'],rows:[['儀式の働き','超自然的な力への働きかけ（歴史的主張）','注意の方向づけ、期待、不安の軽減、習慣の手がかり'],['検証','本教材では事実として扱わない','記録・比較で検証できる'],['扱い方','歴史・思想として紹介','自己実験の対象にする']],cap:'図1：儀式の二つの説明の区別'},
['試験の前に、同じ3つの動作（深呼吸、筆記具を並べる、目標を1文で唱える）を行う日と、行わない日の緊張度を比較する。','作業開始前の儀式を1週間続け、入りやすさ（0〜10）を記録する。'],
['緊張する場面の前の、自分の準備の手順を持てる。','「儀式が効いた」という話を、バイアスを踏まえて受け止められる。','魔術の儀式と心理学を、混同せずに学べる。'],

mkL('psychmagic-1-1',
['魔術を「心の働き」として読む見方の由来を説明できる','魔術的思考と主観的妥当化（バーナム効果）の研究の要点を説明できる','「心理学で説明できる」ことと「効果が証明された」ことの違いを説明できる'],
'魔術の儀式や象徴は、外の世界を動かすための技術なのか。それとも、心の中で起きていることを映した、象徴の言葉なのか。20世紀以降、魔術を心理の言葉で読み替える試みが現れました。この講義では、その系譜と、現代の心理学が明らかにしてきた「人の心の癖」を並べて、魔術を冷静に学ぶための足場を作ります。',
[['心理学的な読み方の系譜',
 'アレイスター・クロウリー（Aleister Crowley）は、魔術を、意志に従って変化を起こす科学であり技術である、と位置づけました。{r:crowley1929} 一方、イスラエル・リガルディー（Israel Regardie）は、ゴールデン・ドーン系の魔術や生命の樹を、心の過程と結びつけて読み解く著作を残しています。{r:regardie1932} 魔術的な象徴を、心の構造や変容の言語として読む視点は、このように20世紀の魔術論の中に育ちました。',
 'さらにカール・グスタフ・ユング（Carl Gustav Jung）は、錬金術の象徴を、人格の変容の過程を映したものとして解釈しました。{r:jung1944} ユングの解釈は文化的な影響が大きい一方、経験的に検証しにくいという批判もあります。本教材では、「魅力的な読み方」と「検証された知見」を区別します。'],
['魔術的思考の心理学',
 '人類学者フレイザーは、共感呪術には「似たものは似たものを生む（類似の法則）」と「一度接触したものは離れても影響し合う（感染の法則）」という二つの考え方がある、と整理しました。ロジンとネメロフは、この二つの法則が、現代の人々の判断や嫌悪の感情にも見られると論じています。{r:rozin1990} たとえば、嫌いな人が着ていた服に抵抗を感じる、といった反応です。つまり「魔術的な考え方」は、古代人だけでなく、私たち自身の日常に残っています。'],
['「当たっている」という感覚を疑う',
 'フォアラーは、全員に同じ曖昧な性格記述を渡しながら、「あなたのために作られた」と伝える実験で、参加者の多くが自分によく当てはまると評価したことを報告しました。{r:forer1949} これは後にバーナム効果（フォアラー効果）と呼ばれます。「自分に当たっている」という感覚は、必ずしも正確さの証拠ではありません。占い、性格診断、魔術の「効いた」という体験を考えるとき、この点を常に意識します。'],
['本教材の立場',
 '心理学的な読み方は、魔術の「効果を証明する」ものではありません。「心の中で何かが起きているかもしれない」という仮説を、検証できる形に直すための道具です。この領域では、歴史的な主張、心理学的な解釈、検証された知見を区別します。',
 'また、象徴や内省を扱う実践は、診断や治療の代わりではありません。つらさが続くときは、医療機関や専門家に相談してください。']],
{type:'table',head:['読み方','内容','検証のしやすさ'],rows:[['伝統的・超自然的','儀式が外界に直接働きかけるとする','本教材では事実として扱わない'],['心理学的な解釈','象徴や儀式を心の過程として読む（クロウリー、リガルディー、ユングなど）','解釈による。検証しにくいものも多い'],['認知科学・心理学の研究','魔術的思考、バーナム効果などを実験で調べる','仮説を立てて検証できる']],cap:'図1：魔術の三つの読み方'},
['性格診断の結果を読んで「当たっている」と感じたとき、同じ文章を別の人にも読んでもらい、当てはまり方を比べてみる。','夢の象徴や儀式の意味を、「心の中で何を表しているか」という仮説として書き出し、後から見直す。'],
['占いや診断の結果を、冷静に受け止められる。','「なんとなく気持ち悪い」という感覚が、魔術的思考の一種かもしれないと気づける。','象徴を使った内省を、検証と区別して扱える。'],
['魔術を心の働きとして読む見方は、20世紀の魔術論の中で育った。','魔術的思考は、現代人の日常にも残っている。','「当たっている」という感覚は、必ずしも正確さの証拠ではない（バーナム効果）。','心理学的な読み方は、効果の証明ではなく、仮説を作る道具として使う。'],
[mq('Rozin と Nemeroff の議論として、本講義で説明されたものはどれか。',['共感呪術の二つの法則が、現代人の判断や感情にも見られると論じた','魔術的思考は古代人にだけ存在する','魔術は科学的に証明されたと論じた','魔術的思考は存在しないと論じた'],0,'類似の法則と感染の法則が、日常の反応にも見られると論じています。'),
 mq('バーナム効果（フォアラー効果）の説明として適切なものはどれか。',['誰にでも当てはまる曖昧な記述を、自分に特有のものとして高く評価してしまう傾向','占いは必ず当たるという効果','記憶が正確になる効果','他人の気持ちが読める効果'],0,'「当たっている」と感じることは、正確さの証拠とは限りません。'),
 mq('魔術の心理学的な読み方の位置づけとして適切なものはどれか。',['効果の証明ではなく、仮説を検証可能な形に直すための道具','魔術が超自然的に作用する証拠','魔術を完全に否定する理論','治療の代わりになる方法'],0,'解釈と検証された知見を区別します。'),
 mq('ユングの錬金術解釈についての本講義の扱いとして適切なものはどれか。',['影響力は大きいが、経験的に検証しにくいという批判もあると紹介する','科学的に完全に証明されたとして紹介する','完全に無価値として退ける','紹介しない'],0,'魅力的な読み方と検証された知見を区別します。')],
['crowley1929','regardie1932','jung1944','rozin1990','forer1949']);

mkL('verbal-1-1',
['言葉に力を認めてきた歴史（古代ギリシアの修辞学、日本の言霊・祝詞）を概観できる','言語行為論、フレーミング、記憶の研究から、言葉が人に与える影響を説明できる','説得と操作の違いと、この領域の倫理的な方針を説明できる'],
'「言葉には力がある」。呪文、祝詞、誓い、命名。人類は、言葉そのものに働きがあると考えてきました。そして現代の言語学や心理学は、言葉が人の認識・記憶・判断に実際に影響することを、実験で示しています。この領域は、「言葉の魔術」を神秘のまま眺めるのではなく、何がどこまで言えるのかを確かめながら学びます。',
[['言葉と魔術の古い結びつき',
 '古代ギリシアの弁論家ゴルギアスに帰される『ヘレネ頌』は、言葉（ロゴス）の力を、薬が身体に及ぼす力になぞらえて論じた文章として知られます。{r:gorgias} アリストテレスの『弁論術』は、説得を、話し手の人柄（エートス）、聞き手の感情（パトス）、論理（ロゴス）の三つで整理しました。{r:aristotle_rhet}',
 '日本には、言葉に霊力が宿るとする「言霊」の観念があります。『万葉集』には「言霊の幸はふ国」といった表現が見えるとされます。{r:manyoshu} また、神事の言葉である祝詞は、平安時代の『延喜式』にも収められています。これらは、言葉に力を認める伝統の例です。'],
['言葉は「行為」でもある',
 '言語哲学者オースティンは、「約束する」「命名する」「宣言する」のように、言うこと自体が行為になる発話があることを論じました。{r:austin1962} 結婚の誓い、開会の宣言、船の命名などです。魔術の儀式における宣言や命名は、この観点から見ると、社会的・心理的な行為として理解できます。超自然的な作用の有無とは別に、言葉が現実の約束や関係を作ることは確かです。'],
['言葉の選びが認識を変える',
 'ロフタスとパーマーは、事故の映像を見た人に、衝突の速度を尋ねるとき、動詞を変えると推定が変わったことを報告しました。{r:loftus1974} また、トヴェルスキーとカーネマンは、同じ内容を「救われる命」として述べるか「失われる命」として述べるかで、人々の選択が変わることを示しました（フレーミング効果）。{r:tversky1981} 言葉の選びは、認識や判断に影響を与えうる、ということです。'],
['自分への言葉',
 'クロスらは、ストレスのかかる場面で、自分の名前や「あなた」で自分に語りかけたほうが、反応が穏やかだったと報告しました。{r:kross2014} 自分への言葉の形を工夫することは、自己調整の一つの方法になりえます。ただし、報告された効果は条件に依存するため、自分の記録で確かめます。'],
['説得と操作の境界',
 '説得についての知識（チャルディーニの影響力の原理など{r:cialdini1984}）は、悪質な勧誘や詐欺から身を守るためにも役立ちます。ただし、効果の大きさは状況によって異なり、「この言い方なら必ず人を動かせる」という技術は存在しません。本教材は、他人の意思を支配する方法は扱いません。誠実に伝える方法と、不当な誘導を見抜く方法を学びます。']],
{type:'table',head:['観点','内容','代表的な参照'],rows:[['歴史','言葉に力を認める伝統（呪文、祝詞、言霊）と修辞学','ゴルギアス、アリストテレス、万葉集'],['言語行為','言うことが行為になる発話','オースティン'],['認識と記憶','言葉の選びが判断・記憶の報告に影響','トヴェルスキー＆カーネマン、ロフタス＆パーマー'],['自己への言葉','語りかけ方の工夫','クロスら'],['倫理','操作しない。悪質な手口を見抜く','（本教材の方針）']],cap:'図1：言語魔術・説得術の領域の見取り図'},
['同じ事実を「成功率90%」と「失敗率10%」と言い換えて、相手の受け止め方がどう変わるか、自分の感じ方で確かめてみる。','緊張する場面の前に、「私はできる」ではなく、自分の名前を呼んで「〇〇、まず最初の一文から始めよう」と語りかけ、前後の緊張度を記録する。'],
['言い回しが判断に影響することを知り、自分の言葉を選べる。','勧誘や広告の言葉の使われ方を、冷静に見られる。','自分への声かけを、記録で確かめながら調整できる。'],
['言葉に力を認める伝統は、世界の各地にある。','言語行為論は、言うことが行為になる発話を論じた。','言葉の選びは、認識・判断・記憶の報告に影響を与えうる。','本教材は他人を操作する方法を扱わず、誠実な説得と、悪質な手口を見抜く力を学ぶ。'],
[mq('Austin の言語行為論で扱われた発話の例として適切なものはどれか。',['約束する、命名する、宣言する','天気を観察する','数を数える','独り言を言う'],0,'言うこと自体が行為になる発話を、遂行的発話といいます。'),
 mq('Tversky と Kahneman（1981）が示したことはどれか。',['同じ内容でも、得として述べるか損として述べるかで選択が変わる','言葉は判断に影響しない','説得は必ず成功する','記憶は常に正確'],0,'フレーミング効果と呼ばれます。'),
 mq('本教材の倫理的な方針として適切なものはどれか。',['他人を操作する方法は扱わず、誠実な説得と悪質な手口の見抜き方を学ぶ','相手を意のままに動かす技術を教える','効果が証明されたとして断定する','倫理には触れない'],0,'「必ず人を動かせる言い方」は存在しません。'),
 mq('Kross ら（2014）の報告として適切なものはどれか。',['自分の名前や「あなた」で語りかけたほうが、ストレス下の反応が穏やかだった','自分への言葉は効果がない','一人称のほうが常に良い','言葉は記憶に無関係'],0,'条件に依存するため、自分の記録で確かめます。')],
['gorgias','aristotle_rhet','manyoshu','austin1962','loftus1974','tversky1981','kross2014','cialdini1984']);

mkL('natural-1-1',
['「自然魔術」が歴史的に何を指したかを説明できる','歴史上の主張・伝統的な利用・現代の薬理学で確認された事実を区別できる','自然を観察して記録する態度の基本と、安全上の注意を理解できる'],
'ルネサンスの人々は、自然の中に「隠れた性質」があり、それを探ることが魔術だと考えました。そこには、後の自然科学につながる観察の姿勢と、今では支持されない信念が混ざっています。この講義では、その両方を丁寧に分けながら、自然を見る目を養う入口とします。',
[['自然魔術とは何か',
 'ルネサンス期の魔術は、自然魔術・天体魔術・儀式魔術のように整理されることがあります。アグリッパの『オカルト哲学について』は、その三区分を取る代表的な著作とされます。{r:agrippa1531} 自然魔術は、悪魔や霊に頼らず、自然の中に隠された性質（オカルト・クオリティ）を探って利用する技術と考えられました。',
 'ジャンバッティスタ・デッラ・ポルタの『自然魔術』は、植物、動物、鉱物、光学、化学的な操作など、さまざまな「自然の不思議」を集めた書として知られます。{r:porta1558} マルシリオ・フィチーノの『生命について』は、医学と星の影響、護符の理論を結びつけて論じました。{r:ficino1489} これらには、観察や実験につながる記述と、現代の知識では支持されない信念が、混ざり合っています。'],
['薬草の知識：古典から現代へ',
 '古代の医師ディオスコリデスの『薬物誌』は、薬用の動植物・鉱物を記述した書として、後世の本草学に長く影響しました。{r:dioscorides} 東アジアでは、李時珍の『本草綱目』が本草学の集大成とされ、{r:bencao1596} 日本でも貝原益軒の『大和本草』などが書かれました。{r:yamatohonzo1709}',
 '民間で使われていた薬草が、観察と記録を通じて検証された例もあります。ウィザリングは、ジギタリス（キツネノテブクロ）の医学的な利用を18世紀に報告しました。{r:withering1785} 近年では、屠呦呦が、伝統医学の文献に着想を得た探索から、抗マラリア薬アルテミシニンを見出した経緯を回顧しています。{r:tu2011} ただし、これらは「伝統的な利用がすべて有効だった」ことを意味しません。有効だったものと、効果が確認されなかったもの、有害だったものがあり、検証によって区別されてきました。'],
['伝承・経験・検証を分ける',
 '自然に関する主張は、次の三つに分けて受け止めます。①伝承（昔からそう言われてきた）、②経験（実際に使った人の報告）、③検証（条件を整えた比較で確かめられた知見）。①と②は仮説の出発点としては価値がありますが、③と同じ確かさではありません。'],
['安全について',
 '植物には、毒性をもつもの、アレルギーを起こすもの、法律で採取や所持が規制されているものがあります。この領域は、観察と記録を基本とし、野生の植物を摂取したり、薬として調製したりする方法は扱いません。体調に関することは、医師・薬剤師に相談してください。採取する場合は、土地の所有者や自治体の規則を確認します。']],
{type:'table',head:['区分','内容','受け止め方'],rows:[['伝承','昔から言われてきた効能・性質','仮説の出発点。事実とは限らない'],['経験','実際に使った人の報告','個人差・思い込みの影響がある'],['検証','比較・実験で確かめられた知見','現代の薬理学・植物学の知見'],['歴史的な主張','ルネサンスの自然魔術など','歴史資料として読む。現在の事実とは区別する']],cap:'図1：自然に関する主張の区分'},
['身近な植物を1種選び、同じ場所で週に一度、スケッチと日付・天気・気づきを記録する（摂取・採取はしない）。','「〇〇に効く」という言い伝えを見つけたら、「伝承／経験／検証」のどれにあたるか、出典とともに整理する。'],
['健康情報の「自然由来だから安全」「昔から使われているから効く」といった言い回しを、冷静に受け止められる。','身近な自然を、観察と記録の対象として見られる。','伝統的な知識を、敬意をもって扱いつつ、検証の視点も持てる。'],
['自然魔術は、自然の隠れた性質を探る試みで、観察につながる面と、今は支持されない信念が混ざっていた。','薬草の知識には、検証されて有効性が確認されたものもあれば、そうでないものもある。','主張は、伝承・経験・検証に分けて受け止める。','本教材は観察と記録を基本とし、摂取や調製の方法は扱わない。'],
[mq('「自然魔術」の説明として適切なものはどれか。',['悪魔や霊に頼らず、自然の隠れた性質を探って利用する技術と考えられた','霊を呼び出す儀式のこと','現代の薬理学そのもの','占星術のこと'],0,'ルネサンス期の自然魔術の考え方です。'),
 mq('ウィザリングとジギタリスの例が示すこととして適切なものはどれか。',['民間の薬草が、観察と記録を通じて医学的に検討された例','民間の薬草はすべて有効だということ','薬草は危険なので研究できないこと','魔術で薬が作られたこと'],0,'有効性は検証によって確かめられます。'),
 mq('自然に関する主張を受け止める区分として、本講義で示されたものはどれか。',['伝承・経験・検証','信仰・予言・奇跡','古代・中世・近代','東洋・西洋・中東'],0,'確かさの異なる情報を区別します。'),
 mq('この領域での安全上の方針として適切なものはどれか。',['観察と記録を基本とし、摂取や調製の方法は扱わない','野生の植物を試食して確かめる','薬として自分で調製する','規則は気にしなくてよい'],0,'毒性・アレルギー・法規制があります。')],
['agrippa1531','porta1558','ficino1489','dioscorides','bencao1596','yamatohonzo1709','withering1785','tu2011']);

mkL('onmyodo-1-1',
['陰陽道が、陰陽五行思想を基礎にした日本の暦・天文・占術・禁忌の体系であることを説明できる','陰陽寮の位置づけと、陰陽道の歴史の概略を説明できる','史実・伝承・フィクションを区別して学ぶ姿勢を説明できる'],
'安倍晴明、式神、五芒星。映画や小説で、陰陽道は「不思議な力を操る術」として描かれます。しかし、史料から見える陰陽道は、もっと現実的な顔をしています。それは、暦を作り、天文を観測し、物事の吉凶を占い、貴族の生活の細かな禁忌を支える、技術と知識の体系でした。この講義では、神秘のイメージを一度脇に置いて、歴史の中の陰陽道を見ていきます。',
[['陰陽道の基礎：陰陽五行',
 '陰陽道の土台は、古代中国で発達した陰陽五行思想です。万物を、陰と陽の二つの気の働きと、木・火・土・金・水の五つの要素の循環で説明しようとする考え方です。日本には、たとえば『日本書紀』の推古天皇10年（602年）の記事に、百済の僧・観勒が暦本や天文地理の書、遁甲方術の書をもたらしたとされるように、早くから関連する知識が伝わりました。{r:nihonshoki} ただし、これは陰陽道の成立そのものを意味するわけではなく、受容の一例として読みます。'],
['陰陽寮と陰陽師',
 '律令制のもとで、陰陽に関する職務は、役所である陰陽寮が担いました。陰陽寮は、暦を作る、天文を観測する、時刻を測る、占いを行うといった仕事を分担していたとされます。当初の陰陽師は、神秘的な呪術者というより、占いなどを担当する技術系の官人でした。{r:murayama1981} その後、平安時代の中頃以降、貴族社会の中で、物忌や方違えなどの禁忌が重んじられるようになり、陰陽道は宮廷や貴族の日常に深く関わるようになります。{r:yamashita1996}'],
['安倍晴明と、伝承の層',
 '安倍晴明（921年–1005年とされる）は、平安時代の著名な陰陽師です。説話集などには、数多くの不思議な逸話が語られますが、それらの多くは後世の伝承や物語であり、同時代の史料から確認できる事実とは区別して読む必要があります。晴明の実像は、官人としての活動や占いの記録などから、慎重に再構成されます。'],
['近世から近代へ',
 '江戸時代には、土御門家が全国の民間の陰陽師を支配下に置く仕組みが整えられたとされます。明治時代の初め（1870年ごろ）には、陰陽寮が廃止され、民間の陰陽道も禁じられました。その後も、暦注や方位の考え方、行事の中に、陰陽道に由来するとされる習慣が残っています。ただし、個々の習慣の由来は、それぞれ別に確認する必要があります。'],
['この教材での扱い方',
 '陰陽道は、史実、伝承、現代のフィクションが入り混じりやすい分野です。本教材は、歴史資料に基づく説明を軸にし、占いの結果を人生の重要な判断に使うことは勧めません。民間信仰や宗教的な行事として今も続いているものは、敬意をもって扱います。']],
{type:'timeline',items:[['古代中国','陰陽五行思想の形成'],['6〜7世紀','暦・天文・方術の知識が日本に伝わる（例：602年の観勒の記事）'],['8世紀初め','律令制のもとで陰陽寮が置かれる（大宝令に始まるとされる）'],['平安時代中期','貴族社会で物忌・方違えなどの禁忌が重んじられる。安倍晴明（921〜1005年とされる）'],['中世〜近世','土御門家を中心とする体制。民間にも広がる'],['明治初期（1870年ごろ）','陰陽寮が廃止され、民間の陰陽道も禁じられる']],cap:'図1：陰陽道の歴史の概観（年代は概数・通説。詳細は研究書で確認）'},
['現代のカレンダーに載る暦注（大安・仏滅など）は、暦の文化の名残だが、個々の由来は別々に調べる必要がある。','小説や映画の陰陽師の描写と、史料から分かる陰陽寮の仕事を、並べて比べてみる。'],
['暦・方位・禁忌といった、日本の生活文化の背景が分かる。','歴史・伝承・フィクションの区別をする練習になる。','占いを、歴史資料としてと、個人の信条としてとで分けて考えられる。'],
['陰陽道は、陰陽五行思想を基礎にした日本の暦・天文・占術・禁忌の体系。','陰陽師は、もとは陰陽寮に属する技術系の官人だった。','安倍晴明の逸話の多くは後世の伝承で、史実とは区別して読む。','占いの結果を人生の重要な判断に使うことは勧めない。'],
[mq('陰陽道の基礎となった思想として適切なものはどれか。',['陰陽五行思想','ギリシア哲学','近代科学','錬金術'],0,'古代中国で発達した、陰と陽、五行の考え方です。'),
 mq('当初の陰陽師の位置づけとして、本講義で説明されたものはどれか。',['陰陽寮に属し、占いなどを担当する技術系の官人','山中で修行する僧侶','民間の祈祷師だけ','外国から来た使節'],0,'神秘的な呪術者というイメージとは異なります。'),
 mq('安倍晴明についての本講義の説明として適切なものはどれか。',['逸話の多くは後世の伝承であり、史実とは区別して読む','すべての逸話が史実である','実在しなかった','中国人だった'],0,'実像は史料から慎重に再構成されます。'),
 mq('明治初期（1870年ごろ）に起きたこととして、本講義で説明されたものはどれか。',['陰陽寮が廃止され、民間の陰陽道も禁じられた','陰陽寮が新設された','陰陽道が国教になった','陰陽五行が日本に伝わった'],0,'近代化の中で制度としての陰陽道は終わりました。')],
['nihonshoki','murayama1981','yamashita1996']);

mkL('mikkyo-1-1',
['密教（Esoteric Buddhism）の基本的な特徴と、日本への伝来の概略を説明できる','三密・曼荼羅・即身成仏といった基本概念を説明できる','現在も続く宗教的伝統への敬意と、学び方の注意を説明できる'],
'「密教」と聞くと、秘密の儀式や不思議な力を思い浮かべる人もいるかもしれません。しかし密教は、現在も寺院で受け継がれている仏教の一つの形であり、独自の思想・修行・美術の体系をもっています。この講義では、その全体像を、歴史と思想の面から概観します。実際の修行の方法は扱いません。それは、教団の伝統の中で、師から弟子へと伝えられるものだからです。',
[['密教とは何か',
 '密教は、仏教の中で、真言（マントラ）、印（ムドラー）、観想、曼荼羅などを用いる実践を重んじる流れです。大日如来を中心に据え、『大日経』や『金剛頂経』などを重要な経典とします。{r:dainichikyo} 「密」という言葉は、一般に、悟りの内容が、言葉だけでは伝えにくく、実践と師からの伝授によって受け継がれる、という意味合いで説明されます。インドで発展し、中国・チベット・日本などに伝わり、それぞれの地域で異なる展開をとげました。'],
['日本への伝来：空海と最澄',
 '日本には、奈良時代にも断片的な密教的な要素が伝わっていたとされますが、体系的な密教は、平安時代の初めに、空海（774年–835年）と最澄（767年–822年）によってもたらされました。空海は、唐に渡って長安で恵果から密教を学び、帰国後に真言宗を開きました。紀伊の高野山を修行の道場とし、のちに京都の東寺も与えられたと伝えられます。最澄は、天台宗を開く中で密教も取り入れ、その後、円仁・円珍らによって天台の密教（台密）が発展しました。{r:matsunaga1991}',
 '空海の著作には、『即身成仏義』などがあります。{r:kukai_sokushin} 即身成仏とは、この身のままで仏の境地に至りうる、という思想です。空海の思想と言説の形成については、学術的な研究もあります。{r:abe1999}'],
['三密と曼荼羅',
 '密教では、身（手で結ぶ印）、口（真言）、意（心の観想）の三つの働きを「三密」とし、これを仏の働きと一致させることを説きます。曼荼羅は、仏の世界を図示したもので、胎蔵界と金剛界の二つが特に知られています。これらは、宗派の教義の中で、それぞれ詳しい意味づけがなされています。'],
['敬意と学び方',
 '密教の修行や儀礼は、阿闍梨（師）から弟子へ、灌頂などの儀礼を通じて伝えられるものとされます。この教材は、歴史と思想の理解を目的とし、実修の手順は扱いません。実際の修行や瞑想（たとえば阿字観など）に関心がある場合は、寺院での体験や指導を受けられる場合があります。それぞれの教団の考え方を尊重してください。',
 'また、研究者による学術的な説明と、宗派の伝統的な教義（信仰の立場からの説明）は、立場が異なることがあります。どちらが優れているかを競うのではなく、「誰の立場からの説明か」を意識して学びます。']],
{type:'table',head:['概念','内容','注意'],rows:[['三密','身（印）・口（真言）・意（観想）','実修は教団の伝統の中で行われる'],['曼荼羅','仏の世界を図示したもの。胎蔵界・金剛界が知られる','教義上の意味づけは宗派により詳しい'],['即身成仏','この身のままで仏の境地に至りうるという思想','学術的説明と宗派の伝統的説明は立場が異なる'],['真言宗（東密）・天台宗（台密）','空海・最澄の系譜','詳細は研究書・各教団の資料で確認']],cap:'図1：密教の基本概念（概要）'},
['寺院の拝観で曼荼羅や仏像を見るとき、中心に描かれた仏と、周囲の配置に注目してみる。','学術書と、教団が出している入門書とを並べて読み、説明の立場の違いに気づく。'],
['日本の仏教美術・寺院文化の背景が分かる。','宗教を、尊重しつつ、歴史と思想として学ぶ姿勢が身につく。','精神制御・意識調整の領域で学ぶ注意や瞑想の研究と、宗教としての実践とを、混同せずに見られる。'],
['密教は、真言・印・観想・曼荼羅などの実践を重んじる仏教の一形態。','体系的な密教は、平安初期に空海と最澄らによって日本にもたらされた。','三密は、身・口・意の三つの働き。','実修は教団の伝統の中で行われるものであり、この教材は歴史と思想の理解を目的とする。'],
[mq('三密の「三」にあたるものとして適切なものはどれか。',['身・口・意','天・地・人','過去・現在・未来','仏・法・僧'],0,'印を結ぶ身、真言を唱える口、観想する意です。'),
 mq('空海についての説明として適切なものはどれか。',['唐で恵果から密教を学び、帰国後に真言宗を開いた','天台宗を開いた','密教に反対した','日本に仏教を初めて伝えた'],0,'天台宗を開いたのは最澄です。'),
 mq('本教材の、密教の実修についての方針として適切なものはどれか。',['手順は扱わず、歴史と思想の理解を目的とする','実修の手順を詳しく解説する','自己流の実修を勧める','宗教的伝統を軽視する'],0,'実修は教団の伝統の中で伝えられるものです。'),
 mq('学術的な説明と宗派の伝統的な説明についての姿勢として適切なものはどれか。',['立場が異なることがあるので、誰の立場の説明かを意識する','どちらかが間違いと決める','区別する必要はない','学術的な説明だけが正しい'],0,'立場の違いを意識して学びます。')],
['dainichikyo','matsunaga1991','kukai_sokushin','abe1999']);

/* ---------- [1-c5] カオスマジック：シジルのカリキュラム（優先実装） ---------- */
mkL('chaos-1-2',
['スペアの経歴と、シジルの着想を歴史的主張として説明できる','スペアの方法の「骨格」と「形而上学的な主張」を区別できる','危険を伴いうる方法を、教材として実践しない理由を説明できる'],
'シジルという言葉は、いまやカオスマジックの代名詞のように使われます。しかし、その出発点には、一人の画家の、少し風変わりで孤独な探究がありました。この講義では、オースティン・オスマン・スペアの着想を、歴史資料に基づいて整理し、そこから何を受け取り、何を保留するかを考えます。',
[['画家スペア',
 'オースティン・オスマン・スペア（Austin Osman Spare, 1886年–1956年）は、ロンドンで活動した画家・著述家です。若くして画家として注目されたとされますが、伝記的な記述（展覧会への出品の経緯など）は文献によって詳しさが異なるため、本教材では細部を断定しません。生前は、広い読者を得たとは言えず、後の世代による再評価を通じて影響が広がりました。'],
['『The Book of Pleasure』のシジル',
 'スペアは1913年の『The Book of Pleasure（Self-Love）: The Psychology of Ecstasy』で、独自の思想と方法を述べました。{r:spare1913} その中心にあるのが、欲求を短い文にして、その文字を組み合わせた図形（シジル）に変え、意識的な思考から手放す、という発想です。',
 'スペアの考えでは、意識的な思考は、疑いや分析によって欲求の働きを妨げます。図形に変換すれば、欲求は言葉の意味から切り離され、日常の思考に邪魔されずに、心の奥で働き続ける、と説明されます。これは、スペア自身の用語や世界観（「キア（Kia）」などの概念）と結びついた主張で、検証された事実ではありません。',
 '同書では、シジルを「活性化」するための、極度の没入や疲労に近い状態を使う方法にも触れられています。こうした方法には、身体的・精神的な危険を伴う可能性があるため、本教材では実践の方法として紹介しません。'],
['後世への展開',
 '1970年代の終わりから、ピーター・J・キャロルらが、スペアの発想を整理して、現代のカオスマジックの方法論に組み込みました。『Liber Null』では、思考の雑音が少ない状態や、強い興奮の状態（グノーシス）を、意図を「刻み込む」ための条件として論じています。{r:carroll1987} また、フィル・ハインの『Condensed Chaos』は、これらの技法を実践者向けに整理した書として、広く読まれました。{r:hine1995}'],
['何を受け取り、何を保留するか',
 '本教材は、スペアの方法を、次の二つに分けて扱います。①方法の骨格：意図を短い文にする→図形にする→注意を向ける→手放す→その後の行動と結果を記録する。②形而上学的な主張：意図が心の奥や外の世界に直接働きかける、という説明。①は、心理学の知見と照らし合わせながら、自分で検証できます。②は、現時点で検証されていない主張として保留します。']],
{type:'timeline',items:[['1886年','スペア、ロンドンに生まれる'],['1913年','『The Book of Pleasure』刊行（シジルの方法が述べられる）'],['1956年','スペア没'],['1970年代後半','キャロルらがカオスマジックを方法論として整理（『Liber Null』は1978年）'],['1995年','ハイン『Condensed Chaos』刊行']],cap:'図1：シジルをめぐる歴史の概観'},
['「毎日、机に10分向かう」という意図を、スペア流に短い文にして、図形にする工程を、実験室の「シジル工房」で試してみる（効果の検証は第5章で行う）。','スペアの主張と、現代の心理学で検証できる部分とを、二列の表に整理してみる。'],
['歴史的な主張を、そのまま鵜呑みにせず、検証できる部分と分けて受け止められる。','危険を伴いうる方法を、安全のために実践しないという判断ができる。','「シジル」という言葉を、歴史的な背景とともに使える。'],
['スペアは画家・著述家で、1913年の著作でシジルの発想を述べた。','シジルは、意図を短い文にし、図形にして、手放す、という方法の骨格をもつ。','キャロルらがカオスマジックの方法論として整理した。','形而上学的な主張は保留し、方法の骨格を検証の対象にする。'],
[mq('シジルの発想が述べられた、スペアの著作として本講義で挙げられたものはどれか。',['The Book of Pleasure（1913年）','Liber Null（1978年）','Condensed Chaos（1995年）','The Art of Memory（1966年）'],0,'Liber Null はキャロル、Condensed Chaos はハインの著作です。'),
 mq('スペアの方法の「骨格」として、本講義で整理されたものはどれか。',['意図を短い文にする→図形にする→注意を向ける→手放す→行動と結果を記録する','神殿を建てる→供物を捧げる→祈る','睡眠を断つ→断食する→祈る','占星術で日を選ぶ'],0,'骨格の部分は、自分で検証できます。'),
 mq('スペアの方法のうち、本教材が実践方法として紹介しないものはどれか。',['極度の没入や疲労に近い状態を使う方法','意図を短い文にする方法','結果を記録する方法','文献を読む方法'],0,'身体的・精神的な危険を伴う可能性があるためです。'),
 mq('「意図が外の世界に直接働きかける」という説明の扱いとして適切なものはどれか。',['現時点で検証されていない主張として保留する','事実として扱う','完全に否定する','説明を避ける'],0,'本教材は、歴史的な主張と検証された知見を区別します。')],
['spare1913','carroll1987','hine1995']);

mkL('chaos-3-1',
['「シジル」の語源と、伝統的な印章・護符・魔方陣との関係を説明できる','シジルの構造（意図文→圧縮→図形→活性化→手放し→記録）を説明できる','図形化の方法がいくつもあり、どれが優れているという証拠はないことを説明できる'],
'図形に意味をもたせて身につける。この発想は、シジルに限らず、世界中の宗教や魔術に見られます。この講義では、シジルという言葉の由来、歴史上の印章や護符、そしてスペア以後の「個人用シジル」の構造を整理します。作り方は一つではない、という点も、あわせて確認します。',
[['シジルの語源と、伝統的な印章',
 'シジル（sigil）は、ラテン語の sigillum（小さな印、印章）に由来する語とされます。中世からルネサンスにかけての魔術書には、天使や霊、惑星に結びつけられた印章が数多く現れます。たとえば『レメゲトン』の第1部『アルス・ゴエティア』には、72の霊の名と印章が挙げられています。{r:lemegeton} また、アグリッパの『オカルト哲学について』には、七つの惑星に対応する魔方陣（カメア）が示されており、{r:agrippa1531} 後の伝統では、名前の文字を数に置き換えて魔方陣上でたどることで、印章を作る方法が説明されています。詳細は、参照した版で確認してください（カバラの数秘とのつながりは、カバラの領域で学びます）。'],
['東アジアの類例：護符',
 '日本にも、神社や寺院のお札、陰陽道や修験道の符、密教の種字（梵字）など、図形や文字に意味を込めた伝統があります。これらは、それぞれの宗教的な文脈の中で意味をもつものであり、個人が自分で作る心理的な道具としてのシジルとは、成り立ちも位置づけも異なります。本教材では、構造の比較にとどめ、同一視はしません。'],
['個人用シジルの構造',
 'スペア以後の個人用シジルは、次の流れで説明されることが多いです。①意図文を書く、②文字を整理して圧縮する（重複を除くなど）、③それを一つの図形にまとめる、④図形に注意を向ける（活性化）、⑤図形を意識から手放す、⑥その後の行動と結果を記録する。本教材では、このうち⑥を特に重視します。記録がなければ、何も検証できないからです。'],
['図形化の方法はいくつもある',
 '図形のまとめ方には、文字の形を重ねる、削減した文字を再配置する、魔方陣上でたどる、円周上の文字盤をたどる、など複数の方法があります。どれが「効く」という証拠はありません。大切なのは、①自分が意図の内容を理解して作ること、②毎回同じ手順で作れること、③過度に複雑にしないこと、の三点です。本教材の「シジル工房」では、文字盤をたどる方法を一例として体験できます。']],
{type:'flow',items:[['意図文','短く書く'],['圧縮','文字を整理'],['図形化','一つにまとめる'],['注意','図形を見る'],['手放し','意識から離す'],['記録','行動と結果']],loop:'記録を見て、意図文と手順を見直す（検証の中心は「記録」）',cap:'図1：個人用シジルの構造'},
['「毎日、机に10分向かう」を意図文にし、重複する文字を除いて、図形にまとめる（実験室のシジル工房）。','神社や寺院で授与される護符を見て、どんな文字や図形が使われ、どのような宗教的な意味づけがされているか、公式の説明を調べる（購入や模倣は目的としない）。'],
['図形や象徴が、意図の記憶の手がかりになりうることを、自分の体験として確かめられる。','歴史的な印章・護符と個人用シジルを、混同せずに比べられる。','手順を決めて繰り返すという、実験の基本が身につく。'],
['シジルは、ラテン語の sigillum（印章）に由来する語とされる。','歴史的な印章・魔方陣・護符は、それぞれの宗教的・歴史的文脈の中で意味をもつ。','個人用シジルの構造は、意図文→圧縮→図形化→活性化→手放し→記録、と整理できる。','図形化の方法はいくつもあり、どれが優れているという証拠はない。'],
[mq('「シジル」の語源として、本講義で説明されたものはどれか。',['ラテン語の sigillum（小さな印、印章）','ギリシア語の sophia（知恵）','ヘブライ語の sefer（書物）','日本語の「しじる」'],0,'印章を意味する語に由来するとされます。'),
 mq('アグリッパの著作に示されたものとして、本講義で挙げられたものはどれか。',['七つの惑星に対応する魔方陣（カメア）','72の霊の名と印章','生命の樹の図','記憶の宮殿の設計図'],0,'72の霊の印章は『アルス・ゴエティア』に挙げられています。'),
 mq('個人用シジルの検証で、本教材が特に重視する工程はどれか。',['行動と結果の記録','図形を飾ること','図形を他人に見せること','図形を複雑にすること'],0,'記録がなければ検証できません。'),
 mq('図形化の方法についての説明として適切なものはどれか。',['方法はいくつもあり、どれが効くという証拠はない','一つの方法だけが正しい','複雑なほど効く','他人の図形を借りたほうが効く'],0,'自分が意図を理解し、毎回同じ手順で作ることが大切です。')],
['lemegeton','agrippa1531','spare1913','carroll1987']);

mkL('chaos-3-2',
['検証しやすい意図文の条件を説明し、書くことができる','意図文を圧縮して図形にする工程を、自分で行える','心的対比と実行意図を組み合わせた計画を作れる'],
'シジルの出来を左右するのは、図形の美しさよりも、その元になる意図文です。「何を、いつ、どれくらい」やるのかが曖昧なままでは、図形に変えても、記録しても、何も検証できません。この講義では、よい意図文の条件と、図形にするまでの具体的な手順を学びます。',
[['よい意図文の五つの条件',
 '本教材では、次の五つを満たす意図文を「検証しやすい」と考えます。①自分の行動である（他人や天気ではない）。②測れる（回数・時間・有無で確認できる）。③肯定形・現在形で書ける（「〜しない」ではなく「〜する」）。④小さく、今日からできる。⑤安全で、他人や自分の健康を害さない。',
  '例：よい例「私は今日、机に10分向かう」。避けたい例「私は宝くじに当たる」「あの人が私を好きになる」（自分の行動ではなく、測定や安全の点でも問題がある）。お金・賭け事・他人の気持ちや行動に関わる目標、健康に関わる目標は、この教材の実験の対象にしません。'],
['圧縮：文字を整理する',
 '意図文を、文字の列として整理します。一つの典型的な方法は、同じ文字の重複を除くことです。たとえば英語の意図文 I WILL FINISH ONE PAGE から、重複を除いた文字を、最初に現れた順に並べると、I W L F N S H O E P A G となります。日本語の場合は、かな（ひらがな）に直して、同様に重複を除きます。この「圧縮」の目的は、文を見ただけでは意味が頭に浮かばない程度に簡略化することだ、と説明されます。'],
['図形化：一つの形にまとめる',
 '圧縮した文字を、一つの図形にまとめます。実験室の「シジル工房」では、文字を円周上に並べ、圧縮した文字の順に線でたどる方法を体験できます（一例にすぎません）。手で描く場合は、文字の形を重ねたり、線を省いたりして、自分なりにまとめます。重要なのは、毎回同じ手順で作ることと、複雑にしすぎないことです。'],
['心理学の知見と組み合わせる',
 '意図を行動に結びつけるには、「もしAなら、Bをする」という実行意図が有効だとする研究があります。{r:gollwitzer1999} また、願望（Wish）、望ましい結果（Outcome）、障害（Obstacle）、計画（Plan）を順に考える心的対比（WOOP）の研究もあります。{r:oettingen2012} 本教材では、シジルだけでなく、これらの計画も併せて作り、後の実験で「シジルがあるとき」と「ないとき」を比べます（第5章）。']],
{type:'table',head:['段階','やること','例'],rows:[['意図文','五つの条件を満たす一文','私は今日、机に10分向かう'],['実行意図','もしAなら、Bをする','もし夕食を食べ終えたら、すぐに机に座る'],['障害の想定','妨げになりそうなことと、その対処','スマートフォンを見てしまう→別の部屋に置く'],['圧縮・図形化','重複を除き、一つの図形にする','シジル工房で作図する'],['記録','実行できたか（はい／いいえ）','毎晩、記録する']],cap:'図1：意図文から計画・図形までの流れ'},
['「私は今日、机に10分向かう」「もし夕食を食べ終えたら、すぐに机に座る」「障害：スマートフォン→別の部屋」の三点をセットで書く。','シジル工房に意図文を入力し、圧縮された文字と図形を確認して、記録しておく。'],
['曖昧な目標を、測れる行動に落とし込む練習になる。','自分の行動目標に、実行意図や障害の想定を組み合わせられる。','お金や他人に関する願いと、自分の行動に関する目標とを、切り分けられる。'],
['よい意図文は、自分の行動で、測れて、肯定形・現在形で、小さく、安全である。','圧縮は、重複する文字を除くなどして、意図文を簡略化する工程。','図形化の方法は一例で、毎回同じ手順で作ることが大切。','実行意図や心的対比の知見と組み合わせて、計画を立てる。'],
[mq('検証しやすい意図文の例として適切なものはどれか。',['私は今日、机に10分向かう','私は宝くじに当たる','あの人が私を好きになる','明日は晴れる'],0,'自分の行動で、測れて、小さく、安全です。'),
 mq('実行意図の形として適切なものはどれか。',['もしAなら、Bをする','Aを願う','Bが起きてほしい','Aは存在する'],0,'状況（A）と行動（B）を結びつけます。'),
 mq('圧縮の説明として適切なものはどれか。',['同じ文字の重複を除くなどして、意図文を簡略化すること','意図文を長くすること','意図文を暗唱すること','意図文を他人に見せること'],0,'一つの典型的な方法の紹介です。'),
 mq('本教材が実験の対象にしない目標として適切なものはどれか。',['お金・賭け事・他人の気持ちや行動に関わる目標','机に向かう時間','散歩の時間','片づけの時間'],0,'自分の行動で、測れて、安全な目標を対象にします。')],
['gollwitzer1999','oettingen2012','spare1913']);

mkL('chaos-3-3',
['シジルに関する主張を、三つのレベルに分けて検討できる','シジルの効果を心理学的に説明しうる仮説を、検証可能な形で述べられる','偶然や思い込みで「効いた」と感じる仕組みを説明できる'],
'「シジルを使ったら願いが叶った」。この種の体験談は多くあります。しかし、本当に知りたいのは、「シジルが原因だったのか」です。この講義では、シジルに関する主張を整理し、検証できる部分と、現時点で検証できない部分を分けます。そして、私たちが偶然を意味づけてしまう仕組みを学びます。',
[['主張の三つのレベル',
 'シジルについての主張は、次の三つのレベルに分けられます。レベル1：歴史的な主張（スペアや後世の人々が、こう説明した）。レベル2：心理的な作用についての主張（意図が明確になり、行動が変わる、など）。レベル3：外の世界の出来事に直接働きかけるという主張。レベル1は、歴史資料で確認できます。レベル2は、行動や気分を測定して検証できます。レベル3は、少なくとも本教材の方法では、検証できません。本教材は、レベル2を検証の対象にし、レベル3は「検証されていない主張」として保留します。'],
['心理的な作用の仮説',
 'シジルを使うと行動が変わるとすれば、次のような経路が考えられます。仮説1：意図を短い文にまとめることで、目標が明確になる。仮説2：図形が、意図を思い出す手がかりになる。仮説3：儀式的な手順が、不安を下げ、取りかかりやすくする（儀式の研究{r:brooks2016}）。仮説4：効く、という期待が行動に影響する（プラセボ効果{r:hrobj2010}）。仮説5：実行意図や障害の想定を一緒に作ることが、行動に結びつく。{r:gollwitzer1999} このうち、シジルの「図形」そのものが必要かどうかは、図形なしの条件と比べなければ分かりません。'],
['偶然を意味づけてしまう心',
 'スキナーは、報酬が行動と無関係に与えられる条件でも、動物が直前の行動を繰り返す「迷信的な行動」を報告しました。{r:skinner1948} ランガーは、偶然に左右される場面でも、自分に制御できていると感じてしまう「制御の錯覚」を示しました。{r:langer1975} また、うまくいった例だけを覚える確証バイアスも、「効いた」という実感を強めます。',
 'なお、意識しない目標の活性化が行動に影響するという研究{r:bargh2001}は、シジルの説明にしばしば引き合いに出されますが、この種の行動プライミングの研究には、追試で結果が再現されなかった報告があります。{r:doyen2012} したがって、「科学で証明されている」と言うことはできません。'],
['何をもって証拠とするか',
 '本教材では、次のものを「証拠」としては扱いません：うまくいった体験談、偶然の一致、後から意味づけた「予兆」。扱うのは、事前に決めた指標、比較条件（シジルあり・なし）、複数回の繰り返し、失敗した日も含めた記録です。それでも、一人の自己実験では、期待効果を完全には排除できません。この限界を、結果と一緒に書きます。']],
{type:'table',head:['レベル','主張','検証できるか'],rows:[['1：歴史的','スペアらがどう説明したか','歴史資料で確認できる'],['2：心理的','意図の明確化・手がかり・期待・計画が行動を変える','行動や気分の測定・比較で検証できる'],['3：外界への直接作用','意図が外の出来事に直接働きかける','本教材の方法では検証できない。保留する']],cap:'図1：シジルの主張の三つのレベル'},
['「効いた」と感じた出来事を、結果が出る前に決めた指標（例：10分机に向かえた日数）に照らして、数え直す。','「うまくいった日」だけでなく、「うまくいかなかった日」も同じ形式で記録して、数を比べる。'],
['体験談や宣伝を、証拠のレベルに分けて受け止められる。','自分の「効いた」という実感を、冷静に見直せる。','心理学の研究の限界（再現性）を踏まえて、情報を扱える。'],
['シジルの主張は、歴史的・心理的・外界への作用の三つのレベルに分けられる。','心理的な作用は、測定と比較で検証できる。','偶然を意味づける心（迷信的行動、制御の錯覚、確証バイアス）に注意する。','体験談は証拠ではなく、事前に決めた指標・比較・繰り返しを証拠とする。'],
[mq('本教材がシジルの検証の対象にする主張のレベルはどれか。',['心理的な作用（行動や気分の変化）','外の出来事に直接働きかけるという主張','超自然的な存在の働き','歴史的な伝説だけ'],0,'外界への直接作用は、本教材の方法では検証できないため保留します。'),
 mq('Langer（1975）が示したこととして適切なものはどれか。',['偶然に左右される場面でも、自分に制御できていると感じてしまう傾向','人は常に正確に制御できること','偶然は存在しないこと','記憶は常に正確なこと'],0,'制御の錯覚と呼ばれます。'),
 mq('「図形そのものが必要か」を調べるために必要な条件はどれか。',['図形なしの条件との比較','体験談の収集','後から意味づけること','成功した日だけの記録'],0,'図形あり・なしの比較が必要です。'),
 mq('行動プライミングの研究についての説明として適切なものはどれか。',['追試で再現されなかった報告があり、「証明された」とは言えない','完全に確立している','研究は存在しない','すべて偽りである'],0,'慎重に受け止めます。')],
['brooks2016','hrobj2010','gollwitzer1999','skinner1948','langer1975','bargh2001','doyen2012']);

mkL('chaos-5-1',
['シジル実験に適した行動目標を選び、基準を説明できる','ベースライン（何もしない期間）の意味と取り方を説明できる','事前の実験計画（仮説・指標・条件・期間・中止基準）を書ける'],
'いよいよ実験の段階です。しかし、実験の成否の大半は、始める前に決まります。何を測るのか、どれくらいの期間行うのか、どんな結果が出たら何を結論するのか。ここを曖昧にしたまま始めると、あとで都合のよい解釈をしてしまうからです。この講義では、実験計画の作り方を学びます。',
[['実験に向いている行動目標',
 '向いているのは、①自分の行動、②毎日、はい／いいえ、または回数・時間で記録できる、③小さく、無理なく続けられる、④安全で他人に迷惑をかけない、という目標です。例：机に10分向かう、10分歩く、1通だけ返信する、5分だけ片づける。反対に、結果が自分の力でコントロールできないもの（試験の合格、宝くじ、恋愛、他人の行動）、お金や賭け事、健康・治療に関わるものは、対象にしません。'],
['ベースライン',
 'シジルを使う前の、通常の状態を記録する期間がベースラインです。少なくとも1週間、何も変えずに、同じ指標を記録します。ベースラインがなければ、「増えた」のか「いつもこうだった」のか判断できません。ベースラインの時点で、すでに毎日できているなら、その目標は実験に向いていません（変化が見えない）。'],
['事前の実験計画',
 '次の項目を、実験を始める前に、研究ノートに書いておきます。①仮説（例：シジル＋実行意図の日は、実行意図だけの日より、机に向かえる日が多い）。②指標（机に10分向かえたか：はい／いいえ）。③条件（A：何もしない、B：意図文と実行意図、C：Bにシジルの作成・活性化を加える）。④期間（各条件7日以上）。⑤順序の決め方（コイン投げなどで決める）。⑥中止基準（不調・負担が出たら中止）。事前に書いておくことで、都合のよい指標や解釈を後から選ぶことを防げます。'],
['安全と倫理',
 '極度の疲労や睡眠不足を伴う方法は使いません。実験で不安や気分の落ち込みが強まった場合は、中止します。強い苦痛が続く場合は、医療機関や専門家に相談してください。他人を巻き込む目標（他人の行動を変える、など）は扱いません。']],
{type:'table',head:['項目','決めること','例'],rows:[['仮説','比較できる形で書く','B＋シジルの日は、Bだけの日より、実行できる日が多い'],['指標','毎日同じ形式で記録','机に10分向かえたか（はい／いいえ）'],['条件','A／B／C','A：何もしない、B：意図文＋実行意図、C：B＋シジル'],['期間','各条件7日以上','合計21日以上'],['順序','ランダムに決める','コイン投げ・くじ'],['中止基準','先に決めておく','不調・負担が出たら中止']],cap:'図1：実験計画のひな形'},
['実験室の課題「シジルを使った行動実験」を開き、仮説・指標・条件・期間・中止基準を、研究ノートに書く。','ベースライン1週間の記録を取り、すでに毎日できていないか確認する。'],
['学習・運動・片づけなど、日常の習慣づくりの実験設計にそのまま使える。','「やってみたらうまくいった」ではなく、事前に計画して確かめる習慣が身につく。','都合のよい解釈を避ける仕組みを作れる。'],

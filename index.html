/* ---------- [1-h] 内容の拡充：用語と原語・よくある誤解・深掘り・考えてみよう ----------
   本文に重ねて書かず、本文にない観点だけを足す。断定を避け、年代や細部は「未確認」を含めて慎重に書く。 */
var EXTRA={
'chaos-1-1':{terms:[['確証バイアス','confirmation bias','自分の予想に合う情報ばかり集め、合わない情報を軽く扱う傾向。'],['自己成就予言','self-fulfilling prophecy','ある予想が、それに沿った行動を引き出し、結果として現実になる現象（社会学者マートンの用語）。'],['実行意図','implementation intention','「もしXならばYをする」という形の計画。ゲルヴィッツァーらの研究で知られる。'],['混沌（カオス）','chaos','この潮流では、世界観を固定せず、道具として入れ替える立場を示す語として使われる。']],myth:['「強く信じれば何でも叶う」という教えではない。信念は道具として試し、効果は結果で確かめるという立場である。','「古代から途切れず伝わる魔術」ではない。20世紀後半のイギリスで整理された、比較的新しい潮流である。'],deep:'カオスマジックは「結果で判断する」ことを重んじるため、科学的な態度と似て見える。ただし、魔術の実践者が自分で結果を評価すると、当たった例が記憶に残りやすい。そのため、この教材では実践の前に予測を書き、結果を数えて比べる手順を組み込んでいる。方法が似ていても、評価の厳密さが違えば、得られる確からしさも違う。',think:['過去に「信じたら上手くいった」と感じた経験を思い出し、外れた例も同じだけ思い出せるか確認してみよう。','「信念を道具として使う」ことと、「信じ込む」ことの違いは何だろう。']},
'chaos-1-2':{terms:[['シジル','sigil','もとは「小さな印」を意味するラテン語系の語。護符や印章を指す。'],['オースティン・オスマン・スペア','Austin Osman Spare','画家・魔術実践者。個人的な印を作る方法を著作で紹介した。']],myth:['シジルは「スペアが発明した」ものではない。印や護符は古くからあり、スペアは個人用の作り方を提示した人物として語られる。','「スペアの方法がそのまま現代のカオスマジックの標準」ではない。後世の整理（1970年代後半以降）で形が整えられた部分が大きい。'],deep:'スペアの著作は象徴的で難解な文章を含み、後世の解説者が整理し直したものが広く流通している。そのため、「スペア本人の主張」と「後世の解釈」を分けて読むことが大切になる。この教材では、どちらの記述かを区別し、年代や書誌は暫定として扱っている。',think:['「元の著者の主張」と「後の解説者の解釈」が混ざると、何が失われるだろう。','自分が知っているシジルの説明は、どの層の情報だろう。']},
'chaos-3-1':{terms:[['意図文','statement of intent','叶えたい目的を一文にしたもの。'],['圧縮','reduction','文字を整理し、重複を除くなどして短くする工程。'],['手放し','forgetting / release','図を作った後、意識的に考え続けない段階。効果の有無は検証の対象。'],['護符','amulet / talisman','身を守る・願いを込める物。東アジアにも多様な例がある。']],myth:['「複雑な図形ほど強い」という根拠はない。図形化の方法はいくつもあり、どれが良いかは確かめられていない。','「手放さないと効かない」と断定できる証拠はない。この教材では一つの手順として紹介するにとどめる。'],deep:'図形にする意味を心理学の言葉で考えると、(1)意図を言葉から絵に変えて繰り返し思い浮かべやすくする、(2)作る過程で意図を具体化する、(3)手がかりとして行動を思い出させる、といった働きが仮説として考えられる。いずれも、シジルならではの効果か、単なる意図の明確化の効果かは区別が必要である。',think:['同じ意図文を、図形にせず紙に書いて貼る場合との違いは何だろう。','図形を作る作業で、いちばん考えが整理されたのはどの段階か。']},
'chaos-3-2':{terms:[['実行意図','implementation intention','「もしXならばYする」の形で行動を決める計画。'],['心的対比','mental contrasting','望む未来と障害の両方を思い浮かべる方法（エッティンゲンらの研究）。'],['WOOP','WOOP','願い・結果・障害・計画の頭文字。心的対比と実行意図を組み合わせた方法。']],myth:['「肯定的な未来だけを強く思い描けばよい」とは限らない。障害も想定するほうが行動につながりやすいという研究がある。','「意図文は長く詳しいほどよい」わけではない。測れて小さい文のほうが、後で検証しやすい。'],deep:'意図文の五つの条件（自分の行動・測れる・肯定形・小さい・安全）は、行動科学の目標設定の考え方と重なる部分が多い。たとえば「毎朝10分歩く」は、自分の行動で、測れて、小さく、肯定形である。「もっと健康になる」は測れず、他の要因も絡む。実験で扱うには、前者のような形に落とし込む必要がある。',think:['自分の今の目標を、五つの条件に当てはめて書き直してみよう。','障害は何か。「もし障害が起きたら、こうする」を一つ書けるか。']},
'chaos-3-3':{terms:[['プラセボ効果','placebo effect','薬理作用がなくても、期待によって体験が変わること。'],['ポストホック（事後の意味づけ）','post hoc','結果が出てから理由を後付けすること。'],['反証可能性','falsifiability','間違っていたら間違いと分かる形で主張が述べられていること（ポパーの考え）。']],myth:['「心理的な作用がある」＝「超自然的な力が働いた」ではない。心理的な作用は、心理学の言葉で説明・測定できる。','「効いた気がする」は効果の証拠にならない。気がすること自体は、期待効果でも起こる。'],deep:'主張を三つのレベルに分ける利点は、議論を混ぜないことにある。レベル2（心理的な作用）なら、条件を決めて比べれば検証できる。レベル3（外界への直接作用）は、本教材の方法では検証できないため、否定も肯定もせず保留する。保留は、結論を出さないという誠実な態度でもある。',think:['自分が「効いた」と感じた出来事を、レベル1〜3のどれとして説明しているか。','「検証できない」ことと「間違っている」ことの違いを説明してみよう。']},
'chaos-5-1':{terms:[['ベースライン','baseline','介入前の通常の状態を記録した期間。'],['ランダム化','randomization','条件の割り当てを、くじなどで偶然に任せること。'],['中止基準','stopping criteria','体調不良など、実験をやめる条件。事前に決める。']],myth:['「少し試して効いたら成功」ではない。ベースラインと比較しないと、元から出来ていた可能性を除けない。','「実験は必ず続けるもの」でもない。不調が出たら中止して構わない。'],deep:'行動目標は「毎日できたか（はい／いいえ）」で記録できるものが向く。二値記録は誤差が少なく、集計も簡単である。一方、気分のような主観的な指標は、期待の影響を受けやすい。この教材の実験では、最初は二値で測れる行動を選ぶことを勧めている。',think:['自分が測れそうな行動目標を3つ挙げ、二値で記録できるか確かめよう。','中止基準を書くとしたら、何が起きたらやめるか。']},
'chaos-5-2':{terms:[['交絡','confounding','調べたい要因以外の要因が結果に混ざること。'],['効果量','effect size','差の大きさ。有意かどうかとは別の観点。'],['事前登録','preregistration','実験の前に計画を公に記録すること。後付けの変更を防ぐ。']],myth:['「差が出た＝効果がある」とは言えない。日数が少ないと偶然の差が大きい。','「C−Aが大きければ、シジルが効いた」とは言えない。全体の効果にはB（計画）が含まれる。'],deep:'三条件の比較では、B−AとC−Bを分けて見ることが肝心である。B−Aが大きく、C−Bが小さければ、効いたのは意図文と実行意図であり、シジルの上乗せは小さい可能性がある。自己実験では日数が限られるため、結論ではなく「次に確かめる問い」として扱うのが誠実である。',think:['自分の結果で、BとCの差が偶然の範囲かどうか、どう判断できるだろう。','日数を倍にしたら、結論はどう変わりうるか。']},
'chaos-5-3':{terms:[['限界（limitation）','limitation','結果の解釈を弱める要素。日数の少なさ、期待効果など。'],['再現','replication','同じ手順で別の機会にも同じ結果が出るか確かめること。']],myth:['「結果が出なかった＝失敗」ではない。何が分かり、何が分からなかったかが記録の価値である。','「報告書は成功した結果を書くもの」ではない。未達成も含めて事実を書く。'],deep:'事実・解釈・限界・次の問いに分けて書くと、「結果を見て気分で解釈する」ことを避けられる。事実は数字、解釈は複数並べ、限界は自分の弱点を書く。次の問いは「変える点を一つだけ」に絞ると、次の実験が小さく回せる。',think:['自分の結果を、解釈を入れずに一文で書いてみよう。','限界を三つ書き出してみよう。']},
'kabbalah-1-1':{terms:[['カバラ','Kabbalah / קַבָּלָה','「受け取ること、伝承」を意味するヘブライ語に由来するとされる。'],['セフィロト','Sefirot','神の流出・属性を示す十の段階を表す語（単数形：セフィラ）。'],['ツファット','Safed','16世紀にルリア派が展開したとされる、イスラエルの町。'],['ヘルメティック・カバラ','Hermetic Qabalah','19世紀以降の西洋オカルティズムによる再構成。ユダヤ教のカバラとは区別される。']],myth:['「カバラ＝魔術」ではない。ユダヤ教神秘思想としての伝統があり、魔術的利用はその外側で再構成された面が大きい。','「生命の樹の図は一つに決まっている」わけではない。配置や名称の表記は資料や流派により異なる。'],deep:'同じ「生命の樹」でも、ユダヤ教のカバラでは神の属性と世界の関係を学ぶ宗教的な文脈で、ヘルメティック・カバラでは象徴体系・対応表として用いられる。この教材では、どちらの文脈の説明かを区別して書く。生きた宗教的伝統への敬意として、伝統内部の実践と外部での再構成を混同しない。',think:['ある説明が、伝統の内側のものか、外側の再構成かを、どうやって見分けるだろう。','図の配置の違いに気づいたとき、どの資料を確認すべきか。']},
'memory-1-1':{terms:[['符号化','encoding','情報を記憶に入れる処理。'],['リハーサル','rehearsal','繰り返して保持すること。'],['チャンク','chunk','まとまりとして扱う単位。'],['想起','retrieval','記憶から取り出すこと。']],myth:['「忘れた＝消えた」とは限らない。手がかりがあれば思い出せることがあり、取り出せない場合もある。','「記憶力は生まれつきで鍛えられない」わけでもない。方法（符号化の工夫）で成績が変わる例がある。'],deep:'記憶の失敗は、入れる段階（符号化）、保つ段階、取り出す段階のどこでも起こる。「覚えられない」と感じるとき、実は取り出しの手がかりが足りないだけの場合がある。場所法などの古典記憶術は、符号化と手がかり作りを同時に行う工夫として読むことができる。',think:['最近忘れたことを一つ思い出し、どの段階で失敗したか考えてみよう。','手がかりを一つ足したら思い出せたか、試してみよう。']},
'mental-1-1':{terms:[['メタ認知','metacognition','自分の認知（考え・注意）を一段上から観察すること。'],['マインドワンダリング','mind wandering','課題と関係のない考えに注意がそれること。'],['脱同一化','（教材内用語）','考えを「事実」ではなく「浮かんだ思考」として扱うこと。']],myth:['「雑念がないのがよい状態」ではない。雑念は自然に起こり、気づいて戻すこと自体が練習になる。','「集中できない人は意志が弱い」わけではない。注意はさまようように働くことが多い。'],deep:'さまよう注意に気づく瞬間は、失敗ではなく、メタ認知がはたらいた瞬間である。練習では、さまよった回数を数えるより、「気づいた回数」を記録すると、評価の向きが変わる。回数が増えることは、観察が進んでいるサインとも解釈できる（ただし個人差がある）。',think:['今日一番集中が途切れたのはいつで、それに「いつ」気づいたか。','気づいた直後、自分に何と声をかけたか。']},
'mental-1-2':{terms:[['内省','introspection','自分の心の中を観察すること。限界も指摘されている。'],['自動思考','automatic thoughts','意図せず浮かぶ考え。'],['身体感覚','interoception（内受容感覚）','体内の状態の感覚。']],myth:['「自分の心は自分が一番よく分かる」とは限らない。気づいていない処理が多く、理由づけは後付けになりやすい。','「感情を観察すると感情が強まる」とは限らない。ただし不快が強いときは無理に続けない。'],deep:'観察を記録に落とすと、感じ方が「その時の判断」から「後で見直せるデータ」に変わる。四つの軸（注意・思考・感情・身体）に分けると、混ざっているものを切り分けやすくなる。たとえば「不安」は、思考（先を考える）と身体（動悸）と注意（そこにばかり向く）の組み合わせかもしれない。',think:['今の自分を四つの軸で一行ずつ書いてみよう。','「不安」を、軸ごとに分解するとどうなるか。']},
'mental-2-1':{terms:[['白クマ実験','white bear experiment','「白クマを考えないで」と指示した場合の思考の出現を調べた実験（ウェグナーら）。'],['皮肉過程理論','ironic process theory','抑えようとする監視過程が、かえって思考を引き出すという説明。'],['再発（リバウンド）','rebound','抑えた後に思考が増える現象。']],myth:['「考えを抑えると必ず増える」わけではない。結果は研究により一貫しない。','「思考を完全に止められる」という主張は、支持されていない。'],deep:'抑制の研究は、「考えない」ことより「考えとの関係」に目を向けるきっかけになった。気づいて戻す方法は、考えを消すのではなく、浮かんでも注意の向け先を選び直す、という違いがある。ただし、こちらが常に優れているとは限らず、効果は個人や状況で異なる。',think:['最近「考えないようにした」ことは、結果としてどうなったか。','「気づいて戻す」を同じ場面で試すなら、どんな手順になるか。']},
'mental-2-2':{terms:[['反芻','rumination','同じ否定的な内容を、受け身に繰り返し考え続けること。'],['問題解決','problem solving','具体的な行動を考えること。反芻とは区別される。'],['注意の切り替え','attention shifting','注意の対象を意図的に変えること。']],myth:['「よく考える＝反芻」ではない。具体的な解決につながる思考は反芻とは異なる。','「気をそらせば解決する」わけではない。切り替えは、後で対処する余地を作るためのもの。'],deep:'反芻は「なぜ自分はこうなのか」という抽象的な問いが続く傾向がある。「次に何をするか」という具体的な問いに言い換えると、問題解決のモードに移りやすい。ただし、つらさが長く続く場合は、専門家に相談する目安にもなる。',think:['最近の反芻を、「具体的な問い」に言い換えてみよう。','相談を考える目安として、どんな状態が当てはまるか。']},
'mental-2-3':{terms:[['脱フュージョン','cognitive defusion','思考と自分を切り離して眺める技法（ACTの概念）。'],['ACT','Acceptance and Commitment Therapy','アクセプタンス＆コミットメント・セラピー。'],['マインドフルネス','mindfulness','今この瞬間の経験に評価せず気づくこと。']],myth:['「思考を消す技法」ではない。思考との距離を変える。','「どちらも万能」ではない。効果の研究には限界があり、個人差がある。'],deep:'脱フュージョンの典型的な言い換えは、「自分はダメだ」を「自分は『ダメだ』という考えを持っている」に変えるものだ。内容は同じでも、考えとの距離が変わる。ただし、強い苦痛があるときは専門家の支援のもとで行うのが望ましい。',think:['繰り返し浮かぶ考えを「〜という考えが浮かんだ」と言い換えると、感じ方は変わるか。','変わらない場合は、何が足りないのだろう。']},
'mental-3-1':{terms:[['持続的注意','sustained attention','長く注意を保つ力。'],['選択的注意','selective attention','必要な情報を選び、他を無視する力。'],['不注意盲','inattentional blindness','注意が向いていないと、目の前のものも見落とす現象。'],['フロー','flow','没頭状態（チクセントミハイの概念）。']],myth:['「集中力」は一つの能力ではない。注意には種類があり、得意不得意が違う。','「長く続くほど良い」とは限らない。持続的注意は時間とともに低下する。'],deep:'不注意盲は、「見ているのに見えていない」ことが日常で起こりうることを示す。だから、集中を高めることは、見落としを減らす保証にはならない。自分の注意の特徴を知るには、どの種類が必要な場面か（読む・聞く・切り替える）を意識して振り返るとよい。',think:['最近の作業は、どの種類の注意が一番必要だったか。','見落としをした経験から、注意のどの働きが足りなかったか。']},
'mental-3-2':{terms:[['切り替えコスト','switch cost','課題を切り替える際に生じる遅れや誤り。'],['マルチタスク','multitasking','複数を同時に進めること。実際は高速な切り替えのことが多い。'],['環境設計','environment design','行動しやすい環境を先に整えること。']],myth:['「マルチタスクが得意な人もいる」が、多くの場合、切り替えコストが生じているとされる。','「スマホは見なければ影響しない」とは限らない。近くにあるだけで影響するという報告もある（結果は一貫しないという指摘もある）。'],deep:'環境設計は意志力に頼らないため、続けやすい。通知を止める、スマホを別の部屋に置くなど、小さな変更でも、記録して比べると効果が確かめられる。重要なのは、「効きそう」ではなく、自分で測って確かめることだ。',think:['作業中に最も頻繁に起こる中断は何か。','一つだけ環境を変えるなら、何を変えるか。']},
'mental-3-3':{terms:[['測定','measurement','集中を数字にする工程（時間、誤りの数、中断の回数など）。'],['転移','transfer','訓練した課題の成績が、別の課題にも広がること。'],['段階的負荷','progressive load','少しずつ負荷を増やすこと。']],myth:['「集中訓練をすれば全般的に集中力が上がる」とは限らない。訓練した課題が上がっても、他に広がるとは限らない（転移の問題）。','「長時間集中するほど良い」わけではない。疲労の影響が出る。'],deep:'集中を「測る」と、気分に頼らず変化を比べられる。ただし、測り方（何を数えるか）で意味が変わる。たとえば「作業時間」は努力の指標で、成果の指標ではない。自分が上げたいのは何かを先に決めると、指標を選びやすい。',think:['自分の集中を数字にするなら、何を数えるか。','その数字が上がっても、実は何も良くならない状況はあるか。']},
'mental-4-1':{terms:[['ジェームズ＝ランゲ説','James–Lange theory','身体反応が先にあり、その知覚が感情だとする説。'],['二要因理論','two-factor theory','覚醒と解釈の二つで感情が決まるとする説（シャクター＝シンガー）。'],['構成主義的情動理論','theory of constructed emotion','感情は予測や概念で構成されるとする見方。']],myth:['「感情は生まれつき決まった反応」と単純には言えない。どの理論も決定版ではない。','「身体反応を変えれば感情も必ず変わる」わけではない。'],deep:'三つの理論の違いは、観察の仕方に影響する。身体反応を重視するなら呼吸や緊張を、解釈を重視するなら状況の捉え方を記録する。どれが正しいかを決めず、自分の記録で何が結びついているかを見るのが実践的である。',think:['最近の強い感情を、身体・解釈・状況に分けて書いてみよう。','三つの見方のどれが自分の経験に近いか。']},
'mental-4-2':{terms:[['漸進的筋弛緩法','progressive muscle relaxation','筋肉を順に緊張させ、緩める方法（ジェイコブソンに由来）。'],['リラクゼーション反応','relaxation response','ベンソンが提唱した、ストレス反応と逆の状態の考え方。'],['過換気','hyperventilation','息を速く深くしすぎ、めまいなどが出る状態。']],myth:['「深く大きく息をするほど良い」わけではない。過換気になる場合があり、無理は禁物。','「呼吸法で病気が治る」わけではない。リラクゼーションは補助的な手段である。'],deep:'呼吸の効果は、速さだけでなく、注意を呼吸に向けることの効果とも重なる。そのため、どの要素が効いたかを分けにくい。記録では、前後の緊張度（0〜10）を同じ尺度で取り、複数日で比べるのが現実的である。',think:['練習前後の緊張度に、どのくらい差があったか。','苦しさを感じたとき、どうやめるか決めてあるか。']},
'mental-4-3':{terms:[['認知的再評価','cognitive reappraisal','出来事の意味づけを変えて感情を調整する方法。'],['抑制','suppression','感情の表出を抑えること。再評価とは区別される。'],['感情ラベリング','affect labeling','感情に名前をつけること。']],myth:['「前向きに考え直す＝無理に明るくする」ではない。事実に合う別の解釈を探すこと。','「感情を抑えるのが大人」とは限らない。抑制は長期的に負担になる報告もある。'],deep:'再評価がうまくいくのは、元の解釈が不正確なときが多い。事実を変えず、解釈の幅を広げるのがポイントである。現実に起きた喪失や被害に「別の見方」を当てはめるのは負担が大きく、無理をしない。',think:['最近の嫌な出来事に、別の解釈を二つ挙げてみよう。','その解釈は、事実とどのくらい合っているか。']},
'mental-4-4':{terms:[['ストレス評価','appraisal','出来事を脅威か挑戦かと見積もること（ラザルスとフォルクマン）。'],['問題焦点型対処','problem-focused coping','問題そのものを変えようとする対処。'],['情動焦点型対処','emotion-focused coping','感情を和らげようとする対処。'],['睡眠衛生','sleep hygiene','睡眠のための生活習慣の整え方。']],myth:['「ストレスは悪者」と決まっているわけではない。評価や資源により、成長につながる場合もある。','「睡眠を削って頑張る」は効率的でないことが多い。睡眠不足は注意力に影響する。'],deep:'ストレスは、出来事の大きさと自分の資源の見積もりのバランスで変わる。だから、出来事を変えにくいときは、資源（休息・支え・見通し）を増やす方法がある。睡眠は最も基本的な資源の一つで、他の課題の効果の土台になる。',think:['今のストレスは、要求と資源のどちらを変えやすいか。','睡眠の記録から、翌日の集中との関係は見えるか。']},
'mental-5-1':{terms:[['焦点化された注意','focused attention','一つの対象に注意を保つ瞑想。'],['開かれたモニタリング','open monitoring','浮かぶ体験を評価せず観察する瞑想。'],['有害事象','adverse effects','瞑想で不快な体験が生じること。']],myth:['「瞑想は誰にでも安全で効果がある」とは限らない。不快な体験が出ることがあり、無理をせず中止してよい。','「瞑想は宗教だから避けるべき」でも「宗教と無関係」でもない。起源は宗教的伝統にあり、現代では世俗的な形も使われる。'],deep:'研究は増えているが、方法・期間・対象がさまざまで、一概に効果を述べるのは難しい。この教材では、5〜10分から始め、記録して自分で確かめる立場をとる。強い不快感があるときは目を開けて中止し、必要なら専門家に相談する。',think:['自分は集中型と観察型のどちらが向いていそうか。','不快感が出たときの中止手順を、先に決めておこう。']},
'mental-5-2':{terms:[['自己暗示','autosuggestion','自分に暗示を与える方法（クーエの名で知られる）。'],['催眠','hypnosis','暗示への反応性が高まる状態・過程と定義されることが多い。'],['暗示感受性','suggestibility','暗示への反応のしやすさ。個人差が大きい。']],myth:['「催眠で人を意のままに操れる」は誇張で、支持されていない。','「肯定的な宣言は誰にでも効く」とは限らない。自尊心が低い人で逆効果の報告もある。'],deep:'催眠の研究では、痛みの軽減などで効果が報告されているが、個人差が大きい。定義にも理論的な対立があり、断定は避ける。自己暗示を試すなら、効果を主観だけでなく、記録で確かめる姿勢が大切である。',think:['「効いた気がする」と「記録で変化があった」はどう違うか。','過度に誇張された主張を見分ける手がかりは何か。']},
'mental-5-3':{terms:[['プラセボ','placebo','有効成分を含まない偽薬、または偽の処置。'],['ノセボ効果','nocebo effect','悪い期待によって不調が現れる現象。'],['オープンラベル・プラセボ','open-label placebo','偽薬と明かして行うプラセボ。']],myth:['「プラセボ＝気のせい」ではない。体験や症状の報告に実際の変化が起こる場合がある。','「プラセボは何にでも効く」わけではない。効果の大きさは症状や評価方法で異なる。'],deep:'期待の効果は、自己実験の結果に混ざる。これを避けるには、可能なら評価を他人に任せる、条件の順序をランダムにする、といった工夫をする。完全に取り除くのは難しいので、結果は「期待効果を含む」と書くのが誠実である。',think:['自分の過去の「効いた」体験に、期待効果はどのくらい混ざっていそうか。','結果を書くとき、どんな一文を添えるか。']},
'mental-6-1':{terms:[['文脈依存','context dependence','学習した環境と同じ文脈で想起しやすい傾向。'],['実行意図','implementation intention','if-then計画。'],['習慣形成','habit formation','繰り返しにより自動化される過程。']],myth:['「習慣は21日でできる」という通説に、確かな根拠があるわけではない。個人や行動で大きく異なるとされる。','「ルーティンは長く丁寧なほどよい」とは限らない。短いほど続きやすい。'],deep:'作業開始の手がかり（場所・時刻・音楽など）は、毎回同じ状況を作ることで、気持ちが乗らなくても動き出しやすくする。重要なのは、手順を短くして、必ず実行できるサイズにすることだ。',think:['作業を始める手がかりを一つ決めるなら何にするか。','1分でできるルーティンを書いてみよう。']},
'mental-6-2':{terms:[['儀式','ritual','決まった手順の行為。象徴的な意味を持つことが多い。'],['不安とパフォーマンス','anxiety and performance','不安が高すぎると成績が下がる場合がある。'],['迷信的行動','superstitious behavior','結果と関係のない行動を、効果があると思い込むこと。']],myth:['「儀式の効果は思い込みだから無意味」とは限らない。不安を下げる等の心理的な働きが報告されている。','「儀式は必ず効く」わけでもない。バイアスが混ざりやすい。'],deep:'魔術的な説明と心理学的な説明は、同じ行為に二つの読み方を与える。片方を否定せずに、効果を測って比べる態度が、この教材の立場である。小さな儀式を作るときは、短く、安全で、やめても困らない設計にする。',think:['自分に習慣化している儀式（験担ぎなど）はあるか。','それは、不安を下げているのか、集中に役立っているのか。']},
'mental-6-3':{terms:[['単一事例デザイン','single-case design','一人を対象に、条件を切り替えて比べる実験。'],['ABAB デザイン','ABAB design','A期とB期を交互に繰り返す方法。'],['介入','intervention','効果を調べたい手順・変更。']],myth:['「一人の実験は科学ではない」わけではない。単一事例デザインは正式な研究方法である（ただし一般化には限界）。','「Bが良ければ常にBが良い」とは言えない。他の要因が混ざる。'],deep:'ABABでは、Bで改善しAに戻すと元に戻れば、介入の影響を示す手がかりになる。ただし、戻らないもの（学習など）は使えない。自分が測れる指標と、元に戻せる介入かどうかを考えて設計する。',think:['自分の手順は、止めても元の状態に戻せるものか。','A期とB期で、変えない条件は何か。']},
'mental-7-1':{terms:[['問い','research question','何を明らかにしたいかを一文にしたもの。'],['指標','outcome measure','結果を測る尺度。'],['脱落','attrition','継続できなくなること。'],['測定の落とし穴','measurement pitfalls','測り方が変わる、期待で記録が偏るなど。']],myth:['「長いほど良い実験」とは限らない。続けられる期間と指標を決めることが先。','「途中で変更しても構わない」わけではない。変更するなら記録して扱いを明記する。'],deep:'長期実験の失敗は、設計よりも継続の失敗が多い。続けられる最小の記録から始め、欠測も記録することで、データの解釈の幅が広がる。中止基準は、続ける責任よりも健康を優先するために先に決めておく。',think:['自分が1か月続けられる記録の量はどのくらいか。','途中でやめたくなったとき、何を基準に判断するか。']},
'mental-7-2':{terms:[['期待効果','expectancy effect','期待が結果に影響すること。'],['盲検','blinding','条件を知らされずに評価すること。'],['事前計画','pre-planned analysis','結果を見る前に分析方法を決めること。']],myth:['「自己実験でも盲検にできる」とは限らない。難しいので、他の工夫（客観の指標）で補う。','「結果が良ければ効果あり」ではない。比較と計画が必要。'],deep:'自己実験の信頼性は、感想→客観の指標→介入なしの期間→事前計画→ランダム化と、段階的に高められる。すべてを備えるのは難しいが、どの段階まで満たしているかを明示すれば、結果の読み方も誠実になる。',think:['自分の実験は、五段階のどこまで満たしているか。','次に一段階上げるなら何をするか。']},
'mental-7-3':{terms:[['プログラム','program','複数の技法を組み合わせた手順の全体。'],['生活習慣','lifestyle','睡眠・食事・運動などの基盤。'],['見直し','review','記録を見て手順を改善すること。']],myth:['「技法を多く集めるほどよい」わけではない。続けられる小さな構成のほうが効果的。','「一度作ったら完成」ではない。記録から改善していく。'],deep:'プログラムは、日常の土台（睡眠・食事・運動）、定期的な練習、状況別の技法の順に重ねる。土台が崩れていると、技法の効果は測りにくい。安全の基準は、すべての層に共通する。',think:['自分の土台で一番整えやすいのは何か。','続けられる最小のプログラムを書いてみよう。']},
'psychmagic-1-1':{terms:[['魔術的思考','magical thinking','因果関係を、科学的根拠なしに結びつける思考。'],['主観的妥当化','subjective validation','自分に当てはまると感じると、内容が正しいと思い込む傾向。'],['元型','archetype','ユング心理学で、普遍的な象徴の型を指す概念。']],myth:['「心理学的に読む＝魔術を否定する」とは限らない。読み方の一つである。','「ユングの理論は実証された科学」ではない。解釈の枠組みとして評価され、実証的な位置づけは議論がある。'],deep:'魔術を心理で読む系譜（20世紀）は、象徴の力を人間の心の働きとして理解しようとした。この教材は、その歴史と現代心理学の知見（魔術的思考や主観的妥当化）を並べ、自分の認知の癖を見抜くことを目的とする。',think:['当たったと感じた占いや予言は、どの程度誰にでも当てはまる内容だったか。','心理学的な読みで説明できる点と、できない点を分けてみよう。']},
'verbal-1-1':{terms:[['言語行為','speech act','言うことが行為になる現象（オースティン）。'],['フレーミング','framing','同じ内容でも言い方で判断が変わること。'],['セルフトーク','self-talk','自分に向けた言葉。'],['祝詞','norito','神道で神に奏上する言葉。']],myth:['「言葉には超自然的な力がある」という説明と、「言葉は認識や行動に影響する」という説明は別である。','「説得術＝人を操る技術」ではない。誠実な説得と、悪質な手口を区別する。'],deep:'言語行為論は、「約束する」「命名する」のように、言うこと自体が行為になる場合を示した。魔術的な言葉（呪文・祝詞）も、この観点から、社会的・儀礼的な枠組みの中で働くものとして読める。この領域は、自分の言葉と他人の言葉の影響を意識することを目的とする。',think:['最近の自分の言葉で、聞き手の行動を変えたものは何か。','誠実な説得と操作の境界を、自分ならどう引くか。']},
'natural-1-1':{terms:[['自然魔術','natural magic','自然の隠れた性質を探る営みとして、ルネサンスで語られた。'],['本草学','honzogaku','薬用の動植物・鉱物を扱う東アジアの学問。'],['共感と反感','sympathy and antipathy','自然物の間に引き合う・反発する関係があるとする考え。']],myth:['「伝承がある＝効く」ではない。伝承・経験・検証を区別する。','「天然だから安全」ではない。毒性のある植物も多い。'],deep:'歴史上の自然魔術には、後の科学につながる観察と、根拠の乏しい説明が混在する。現代の薬理学で確認されたものと、確認されていないものを分けて学ぶことが、この領域の基本である。安全のため、野草や薬草の自己判断での利用や採取は避ける。',think:['身近な「自然だから体に良い」という話を、伝承・経験・検証に分けてみよう。','観察記録は、何を残すと後で検証できるか。']},
'onmyodo-1-1':{terms:[['陰陽寮','Onmyoryo','律令制下で暦・天文・占いを扱った役所。'],['五行','Wuxing / Gogyo','木・火・土・金・水の五要素の関係で世界を捉える考え。'],['方違え','katatagae','凶方を避けて別方向に一度向かってから目的地へ向かう習慣。'],['安倍晴明','Abe no Seimei','平安時代の陰陽師。伝承と史実の層を区別して読む。']],myth:['「陰陽師＝式神を使う超能力者」はフィクションの影響が大きい。史実は暦・天文・占術を扱う官僚的な専門職の側面が強い。','「陰陽道は中国の道教そのもの」ではない。陰陽五行説を基礎に、日本で独自に展開した。'],deep:'陰陽道は、史実、伝承（説話）、近世以降の民間信仰、現代のフィクションが重なって語られる。安倍晴明も、史料に基づく部分と、後世の伝説的な部分がある。この領域では、どの層の話かを区別して読む。',think:['自分が知る「陰陽師」のイメージは、どの層から来たか。','方違えのような習慣は、当時の生活の中でどんな意味を持ったか。']},
'mikkyo-1-1':{terms:[['三密','sanmitsu','身・口・意の三つの行い。'],['曼荼羅','mandala','仏の世界を図示したもの。胎蔵界・金剛界が知られる。'],['即身成仏','sokushin jobutsu','この身のままで仏の境地に至りうるという思想。'],['東密・台密','Tomitsu / Taimitsu','真言宗系・天台宗系の密教。']],myth:['「密教＝呪術・神秘体験の技法」ではない。仏教の教理に位置づけられた思想・実践体系である。','「本で読めば実修できる」わけではない。実修は教団の伝統の中で、師から授かるものとされる。'],deep:'この教材は、密教の歴史と思想の理解を目的とし、実修は扱わない。学術的な説明と宗派の伝統的説明は立場が異なることがあり、どちらかを優劣で扱わない。現在も続く宗教的伝統への敬意を前提に学ぶ。',think:['学術的な説明と、信仰の内側からの説明の違いは何だろう。','敬意を保つために、学ぶ側が気をつけることは何か。']}

var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtDur(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return pad(h)+':'+pad(m)+':'+pad(s)}
function fmtHM(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h>0?h+'時間'+m+'分':m+'分'+(sec%60)+'秒'}
function fmtDT(t){var d=new Date(t);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}

function defaultState(){return {schemaVersion:SCHEMA,createdAt:Date.now(),awards:{},completed:{},quiz:{},tasks:{},notes:[],sigils:[],timeLog:[],timer:null,readings:{},activity:[],settings:{auto:true,idleMinutes:5,autoPauseHidden:true,lastExport:0},lastLecture:null}}

function num(v,d,min,max){v=Number(v);if(!isFinite(v))return d;if(min!=null&&v<min)return min;if(max!=null&&v>max)return max;return v}
function str(v,max){return typeof v==='string'?v.slice(0,max||20000):''}
function isObj(o){return o&&typeof o==='object'&&!Array.isArray(o)}

/* 検証・正規化（localStorage読込とインポートで共用）。warnings を返す */
function sanitizeState(raw,warnings){
  var s=defaultState(),w=warnings||[];
  if(!isObj(raw))return s;
  s.createdAt=num(raw.createdAt,Date.now(),0);
  if(isObj(raw.awards))Object.keys(raw.awards).slice(0,5000).forEach(function(k){var a=raw.awards[k];if(isObj(a)&&isFinite(Number(a.xp)))s.awards[str(k,120)]={xp:num(a.xp,0,0,10000),domain:str(a.domain,40),ts:num(a.ts,0,0)}});
  if(isObj(raw.completed))Object.keys(raw.completed).forEach(function(k){s.completed[str(k,80)]=num(raw.completed[k],0,0)});
  if(isObj(raw.quiz))Object.keys(raw.quiz).forEach(function(k){var q=raw.quiz[k];if(isObj(q)){var tot=num(q.total,0,0,1000);s.quiz[str(k,80)]={best:num(q.best,0,0,tot),total:tot,last:num(q.last,0,0,tot),ts:num(q.ts,0,0),attempts:num(q.attempts,1,0,100000)}}});
  if(isObj(raw.tasks))Object.keys(raw.tasks).forEach(function(k){var t=raw.tasks[k];if(!isObj(t))return;var m={};if(isObj(t.metrics))Object.keys(t.metrics).forEach(function(mk){m[str(mk,40)]=str(String(t.metrics[mk]),2000)});s.tasks[str(k,80)]={status:['todo','doing','done'].indexOf(t.status)>=0?t.status:'todo',metrics:m,result:str(t.result),reflection:str(t.reflection),date:str(t.date,20),ts:num(t.ts,0,0)}});
  if(Array.isArray(raw.notes))raw.notes.slice(0,5000).forEach(function(n){if(isObj(n)&&n.id)s.notes.push({id:str(n.id,60),date:str(n.date,20),domain:str(n.domain,40),title:str(n.title,200),hypothesis:str(n.hypothesis),done:str(n.done),result:str(n.result),consider:str(n.consider),refs:str(n.refs,2000),updated:num(n.updated,0,0)})});
  if(Array.isArray(raw.sigils))raw.sigils.slice(0,500).forEach(function(g){if(isObj(g)&&g.id)s.sigils.push({id:str(g.id,60),ts:num(g.ts,0,0),intent:str(g.intent,500),reduced:str(g.reduced,200),wheel:g.wheel==='kana'?'kana':'latin',note:str(g.note,1000)})});
  if(Array.isArray(raw.timeLog))raw.timeLog.slice(0,20000).forEach(function(l){if(!isObj(l)||!l.id)return;var bd={},tot=0;if(isObj(l.byDate))Object.keys(l.byDate).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){var v=Math.round(num(l.byDate[k],0,0,86400));bd[k]=v;tot+=v}});
    var sec=Math.round(num(l.sec,tot,0,10000000));if(sec!==tot){w.push('学習履歴 '+str(l.id,20)+' の合計秒数が日別内訳と一致しなかったため、内訳の合計に補正しました。');sec=tot}
    s.timeLog.push({id:str(l.id,60),start:num(l.start,0,0),end:num(l.end,0,0),sec:sec,domainId:str(l.domainId,40),lectureId:str(l.lectureId,80),byDate:bd})});
  if(isObj(raw.readings))Object.keys(raw.readings).forEach(function(k){var r=raw.readings[k];if(isObj(r))s.readings[str(k,80)]={status:['none','reading','finished'].indexOf(r.status)>=0?r.status:'none',memo:str(r.memo),updated:num(r.updated,0,0)}});
  if(Array.isArray(raw.activity))raw.activity.slice(-300).forEach(function(a){if(isObj(a))s.activity.push({ts:num(a.ts,0,0),type:str(a.type,30),text:str(a.text,300)})});
  if(isObj(raw.settings)){s.settings.idleMinutes=num(raw.settings.idleMinutes,5,1,120);s.settings.autoPauseHidden=raw.settings.autoPauseHidden!==false;s.settings.auto=raw.settings.auto!==false;s.settings.lastExport=num(raw.settings.lastExport,0,0)}
  s.lastLecture=raw.lastLecture?str(raw.lastLecture,80):null;
  /* 未知のID（現カリキュラムにない）の警告 */
  Object.keys(s.completed).forEach(function(k){if(!IDX[k])w.push('完了済み講義 "'+k+'" は現在のカリキュラムにありません（データは保持されます）。')});
  Object.keys(s.tasks).forEach(function(k){if(!TASKS.some(function(t){return t.id===k}))w.push('課題 "'+k+'" は現在のカリキュラムにありません（データは保持されます）。')});
  /* 進行中タイマー（読込時のみ） */
  if(raw.timer&&isObj(raw.timer)&&Array.isArray(raw.timer.segments)&&warnings===undefined){
    var t=raw.timer,segs=[];t.segments.forEach(function(g){if(isObj(g)&&isFinite(g.s)&&isFinite(g.e)&&g.e>=g.s)segs.push({s:+g.s,e:+g.e})});
    if(t.runningSince&&isFinite(t.runningSince)){var e=Math.max(+t.runningSince,num(t.lastBeat,+t.runningSince));segs.push({s:+t.runningSince,e:e});s._recovered=true}
    s.timer={id:str(t.id,60)||uid(),domainId:str(t.domainId,40),lectureId:str(t.lectureId,80),startedAt:num(t.startedAt,Date.now(),0),segments:segs,runningSince:null,lastBeat:Date.now(),pausedAt:segs.length?segs[segs.length-1].e:Date.now(),manualHold:!!t.manualHold};
  }
  return s;
}

var state;
function loadState(){try{var raw=localStorage.getItem(LS_KEY);if(!raw)return defaultState();return sanitizeState(JSON.parse(raw))}catch(e){return defaultState()}}
var saveFailed=false;
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));saveFailed=false}catch(e){if(!saveFailed){toast('ブラウザへの自動保存に失敗しました。「データ」画面からJSONバックアップを書き出してください。');}saveFailed=true}}

/* ---------- 経験値・レベル・称号 ---------- */
function xpTotal(s){s=s||state;var t=0;Object.keys(s.awards).forEach(function(k){t+=s.awards[k].xp});return t}
function domainXp(did,s){s=s||state;var t=0;Object.keys(s.awards).forEach(function(k){if(s.awards[k].domain===did)t+=s.awards[k].xp});return t}
function levelOf(xp){return Math.floor(Math.sqrt(xp/60))+1}
function levelFloor(l){return 60*(l-1)*(l-1)}
function award(key,xp,domain,text){if(state.awards[key]&&state.awards[key].xp>=xp)return 0;var prev=state.awards[key]?state.awards[key].xp:0;state.awards[key]={xp:xp,domain:domain||'',ts:Date.now()};if(text)logAct('xp',text+'（+'+(xp-prev)+' XP）');return xp-prev}
function logAct(type,text){state.activity.push({ts:Date.now(),type:type,text:text});if(state.activity.length>300)state.activity=state.activity.slice(-300)}
function tasksDone(did){return TASKS.filter(function(t){return(!did||t.domain===did)&&state.tasks[t.id]&&state.tasks[t.id].status==='done'}).length}
function readingsFinished(){return Object.keys(state.readings).filter(function(k){return state.readings[k].status==='finished'}).length}
function titleOf(s){
  s=s||state;var xp=xpTotal(s),lv=levelOf(xp),t=[['見習い研究者',true]];
  t.push(['象徴の探究者',domainXp('chaos',s)+domainXp('kabbalah',s)>=100]);
  t.push(['記憶の修練者',domainXp('memory',s)>=100]);
  t.push(['精神統御の探究者',domainXp('mental',s)>=100]);
  t.push(['集中の修練者',TASKS.filter(function(k){return k.domain==='mental'&&s.tasks[k.id]&&s.tasks[k.id].status==='done'}).length>=3]);
  t.push(['古文書研究者',Object.keys(s.readings).filter(function(k){return s.readings[k].status==='finished'}).length>=3]);
  t.push(['魔術研究者',lv>=5]);t.push(['上級研究者',lv>=8]);
  var earned=t.filter(function(x){return x[1]}).map(function(x){return x[0]});
  return {current:earned[earned.length-1],earned:earned,all:t.map(function(x){return x[0]})};
}

var lastActivity=Date.now();
function splitByDay(segs,openStart,now){
  var all=segs.slice();if(openStart)all.push({s:openStart,e:now});
  var by={};all.forEach(function(g){var c=g.s;while(c<g.e){var m=new Date(c);m.setHours(24,0,0,0);var end=Math.min(g.e,m.getTime());var k=dkey(c);by[k]=(by[k]||0)+(end-c)/1000;c=end}});
  return by;
}
function timerMs(t,now){t=t||state.timer;if(!t)return 0;now=now||Date.now();var ms=0;t.segments.forEach(function(g){ms+=g.e-g.s});if(t.runningSince)ms+=now-t.runningSince;return ms}
function activeByDate(){return state.timer?splitByDay(state.timer.segments,state.timer.runningSince,Date.now()):{}}
function totalSec(filter){var t=0;state.timeLog.forEach(function(l){if(!filter||filter(l))t+=l.sec});if(state.timer&&(!filter||filter({domainId:state.timer.domainId,lectureId:state.timer.lectureId}))){Object.keys(activeByDate()).forEach(function(k){t+=activeByDate()[k]})}return t}
function todaySec(){var k=dkey(Date.now()),t=0;state.timeLog.forEach(function(l){t+=l.byDate[k]||0});t+=activeByDate()[k]||0;return t}
function studyDays(){var s={};state.timeLog.forEach(function(l){Object.keys(l.byDate).forEach(function(k){if(l.byDate[k]>0)s[k]=1})});Object.keys(activeByDate()).forEach(function(k){s[k]=1});Object.keys(state.completed).forEach(function(k){s[dkey(state.completed[k])]=1});return Object.keys(s).length}

var autoHold=false,lastIdleToast=0,lastSync=0;
function startTimer(domainId,lectureId,auto){
  if(state.timer){if(!auto)toast('すでに学習時間を計測中です。');return}
  var n=Date.now();state.timer={id:uid(),domainId:domainId||'',lectureId:lectureId||'',startedAt:n,segments:[],runningSince:n,lastBeat:n,pausedAt:null,manualHold:false};
  if(!auto){lastActivity=n;toast('学習を開始しました。')}
  save();renderBar();
}
function pauseTimer(at,msg,manual){var t=state.timer;if(!t||!t.runningSince)return;var e=Math.max(t.runningSince,at||Date.now());t.segments.push({s:t.runningSince,e:e});t.runningSince=null;t.pausedAt=e;t.manualHold=!!manual;save();renderBar();if(msg)toast(msg)}
function resumeTimer(){var t=state.timer;if(!t||t.runningSince)return;t.runningSince=Date.now();t.lastBeat=t.runningSince;t.pausedAt=null;t.manualHold=false;save();renderBar()}
function endTimer(opts){
  opts=opts||{};var t=state.timer;if(!t)return;pauseTimer(Date.now());
  var by=splitByDay(t.segments),sec=0,rounded={};Object.keys(by).forEach(function(k){var v=Math.round(by[k]);if(v>0){rounded[k]=v;sec+=v}});
  var start=t.segments.length?t.segments[0].s:t.startedAt,end=t.segments.length?t.segments[t.segments.length-1].e:t.startedAt;
  if(sec>=3){state.timeLog.push({id:t.id,start:start,end:end,sec:sec,domainId:t.domainId,lectureId:t.lectureId,byDate:rounded});var d=domById(t.domainId);logAct('time','学習 '+fmtHM(sec)+'（'+(IDX[t.lectureId]?IDX[t.lectureId].title:d?d.name:'自由研究')+'）')}
  state.timer=null;if(opts.hold)autoHold=true;save();renderBar();
  if(!opts.silent)toast(sec>=3?'学習を保存しました（'+fmtHM(sec)+'）。':'3秒未満のため記録しませんでした。');
  if(opts.render)render();
}
/* 自動計測：いま開いている画面から「学習中かどうか」を判定する */
function studyContext(){
  var r=route();
  if(r.page==='lecture')return (IDX[r.a]&&LECTURES[r.a])?{d:IDX[r.a].domain,l:r.a}:null;
  if(r.page==='domain')return domById(r.a)?{d:r.a,l:''}:null;
  if(r.page==='lab'){var t=r.a?TASKS.filter(function(x){return x.id===r.a})[0]:null;return {d:t?t.domain:'',l:''}}
  if(r.page==='sigil')return {d:'chaos',l:''};
  if(r.page==='library'||r.page==='notes')return {d:'',l:''};
  return null;
}
function autoSync(){
  if(!state||!state.settings.auto)return;
  var now=Date.now(),t=state.timer,c=studyContext();
  var hidden=(typeof document!=='undefined'&&!!document.hidden)&&state.settings.autoPauseHidden;
  var idle=now-lastActivity>state.settings.idleMinutes*60000;
  var okRun=!!c&&!hidden&&!idle&&!autoHold;
  if(t&&t.runningSince){
    if(!c||hidden||idle){
      pauseTimer(idle?lastActivity:now,null,false);
      if(idle&&now-lastIdleToast>60000){lastIdleToast=now;toast('無操作が続いたため、計測を一時停止しました（操作のなかった時間は加算されません）。')}
    }else if(c.d!==t.domainId||c.l!==t.lectureId){endTimer({silent:true});}
  }else if(t){
    if(t.pausedAt&&now-t.pausedAt>15*60000){endTimer({silent:true});}
    else if(okRun&&!t.manualHold){
      if(c.d!==t.domainId||c.l!==t.lectureId)endTimer({silent:true});else resumeTimer();
    }
  }
  if(!state.timer&&okRun)startTimer(c.d,c.l,true);
}

  if(state.settings.auto)autoSync();
  else{var t0=state.timer;if(t0&&t0.runningSince&&Date.now()-lastActivity>state.settings.idleMinutes*60000)pauseTimer(lastActivity,'無操作が続いたため、計測を一時停止しました（操作のなかった時間は加算されません）。')}
  var t=state.timer;

/* インポート検証：{ok, errors[], warnings[], state, summary} */
function validateImport(text){
  var errors=[],warnings=[],obj;
  if(typeof text!=='string'||!text.trim())return {ok:false,errors:['ファイルが空です。']};
  if(text.length>30000000)return {ok:false,errors:['ファイルが大きすぎます。']};
  try{obj=JSON.parse(text)}catch(e){return {ok:false,errors:['JSONとして読み込めません：'+e.message]}}
  if(!isObj(obj))return {ok:false,errors:['JSONの最上位がオブジェクトではありません。']};
  if(obj.app!=='GRIMOIRE')errors.push('GRIMOIRE のバックアップファイルではありません（app が "GRIMOIRE" ではありません）。');
  if(typeof obj.schemaVersion!=='number'||!isFinite(obj.schemaVersion))errors.push('schemaVersion がありません。');
  else if(obj.schemaVersion>SCHEMA)errors.push('このファイルは新しい形式（schemaVersion '+obj.schemaVersion+'）です。この版（'+SCHEMA+'）では読み込めません。');
  else if(obj.schemaVersion<1)errors.push('schemaVersion が不正です。');
  if(!isObj(obj.data))errors.push('data オブジェクトがありません。');
  else{['awards','completed','quiz','tasks','readings','settings'].forEach(function(k){if(obj.data[k]!==undefined&&!isObj(obj.data[k]))errors.push('data.'+k+' の形式が不正です。')});['notes','timeLog','activity','sigils'].forEach(function(k){if(obj.data[k]!==undefined&&!Array.isArray(obj.data[k]))errors.push('data.'+k+' の形式が不正です。')})}
  if(errors.length)return {ok:false,errors:errors};
  var s=sanitizeState(obj.data,warnings);
  var rawCounts={notes:(obj.data.notes||[]).length,timeLog:(obj.data.timeLog||[]).length};
  if(s.notes.length<rawCounts.notes)warnings.push('形式が不正なノート '+(rawCounts.notes-s.notes.length)+' 件を読み飛ばしました。');
  if(s.timeLog.length<rawCounts.timeLog)warnings.push('形式が不正な学習履歴 '+(rawCounts.timeLog-s.timeLog.length)+' 件を読み飛ばしました。');
  return {ok:true,errors:[],warnings:warnings,state:s,exportedAt:obj.exportedAt||'',summary:summarize(s)};
}
function summarize(s){var sec=0;s.timeLog.forEach(function(l){sec+=l.sec});return {xp:xpTotal(s),level:levelOf(xpTotal(s)),title:titleOf(s).current,lectures:Object.keys(s.completed).length,tasks:Object.keys(s.tasks).filter(function(k){return s.tasks[k].status==='done'}).length,notes:s.notes.length,sessions:s.timeLog.length,seconds:sec,readings:Object.keys(s.readings).length}}
/* 統合：和集合。同一キーは新しい方（または大きい方）を採用 */
function mergeStates(a,b){
  var m=JSON.parse(JSON.stringify(a));
  Object.keys(b.awards).forEach(function(k){if(!m.awards[k]||b.awards[k].xp>m.awards[k].xp)m.awards[k]=b.awards[k]});
  Object.keys(b.completed).forEach(function(k){if(!m.completed[k]||b.completed[k]<m.completed[k])m.completed[k]=b.completed[k]});
  Object.keys(b.quiz).forEach(function(k){var x=m.quiz[k],y=b.quiz[k];if(!x||y.best>x.best||(y.best===x.best&&y.ts>x.ts))m.quiz[k]=Object.assign({},y,{best:Math.max(y.best,x?x.best:0),attempts:Math.max(y.attempts,x?x.attempts:0)})});
  Object.keys(b.tasks).forEach(function(k){var x=m.tasks[k],y=b.tasks[k];if(!x||(y.ts||0)>(x.ts||0))m.tasks[k]=y});
  var ids={};m.notes.forEach(function(n){ids[n.id]=n});b.notes.forEach(function(n){if(!ids[n.id])m.notes.push(n);else if(n.updated>ids[n.id].updated)Object.assign(ids[n.id],n)});
  var sg={};m.sigils.forEach(function(g){sg[g.id]=1});b.sigils.forEach(function(g){if(!sg[g.id])m.sigils.push(g)});
  var tl={};m.timeLog.forEach(function(l){tl[l.id]=1});b.timeLog.forEach(function(l){if(!tl[l.id])m.timeLog.push(l)});
  Object.keys(b.readings).forEach(function(k){var x=m.readings[k],y=b.readings[k];if(!x||y.updated>x.updated)m.readings[k]=y});
  var seen={};m.activity.forEach(function(a){seen[a.ts+a.text]=1});b.activity.forEach(function(a){if(!seen[a.ts+a.text])m.activity.push(a)});m.activity.sort(function(x,y){return x.ts-y.ts});m.activity=m.activity.slice(-300);
  if(!m.lastLecture)m.lastLecture=b.lastLecture;
  return m;
}
function applyImport(mode){
  var p=pendingImport;if(!p||!p.ok)return;var keep=state.timer;
  var ns=(mode==='merge')?mergeStates(state,p.state):p.state;
  ns.timer=keep;ns.schemaVersion=SCHEMA;state=sanitizeStateKeep(ns);save();pendingImport=null;
  logAct('data','JSONバックアップを'+(mode==='merge'?'統合':'復元')+'しました');save();
  var sm=summarize(state);render();renderBar();
  toast('復元しました：'+sm.xp+' XP / 講義 '+sm.lectures+' / ノート '+sm.notes+' / 学習 '+fmtHM(sm.seconds));
}

/* ---- シジル工房 ---- */
var WHEELS={latin:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),kana:'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split('')};
var SMALLK={'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ','ゎ':'わ'};
function sigilReduce(text){
  var s=String(text||'').normalize('NFKD'),lat=[],kana=[];
  for(var i=0;i<s.length;i++){var c=s.charAt(i),code=c.charCodeAt(0);
    if(code>=0x30A1&&code<=0x30F6)c=String.fromCharCode(code-0x60);
    if(SMALLK[c])c=SMALLK[c];
    if(/[A-Za-z]/.test(c))lat.push(c.toUpperCase());
    else if(WHEELS.kana.indexOf(c)>=0)kana.push(c);}
  var wheel=(kana.length>0&&kana.length>=lat.length)?'kana':'latin',seq=wheel==='kana'?kana:lat,uniq=[];
  seq.forEach(function(c){if(uniq.indexOf(c)<0)uniq.push(c)});
  return {wheel:wheel,seq:seq,chars:uniq};
}
function sigilSVG(r,o){
  o=o||{};var W=WHEELS[r.wheel]||WHEELS.latin,N=W.length,cx=160,cy=160,R=128,size=o.size||320,ink=o.ink||'#d6b97a',bg=o.bg||'none',faint=o.faint||'rgba(214,185,122,.3)';
  function pt(ch){var i=W.indexOf(ch),a=-Math.PI/2+2*Math.PI*i/N;return [cx+R*Math.cos(a),cy+R*Math.sin(a)]}
  var h='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="'+size+'" height="'+size+'" role="img" aria-label="シジル">';
  if(bg!=='none')h+='<rect width="320" height="320" fill="'+bg+'"/>';
  if(o.guide){h+='<circle cx="160" cy="160" r="'+R+'" fill="none" stroke="'+faint+'" stroke-width="1"/>';
    W.forEach(function(ch){var p=pt(ch),a=Math.atan2(p[1]-cy,p[0]-cx),lx=cx+(R+16)*Math.cos(a),ly=cy+(R+16)*Math.sin(a),on=r.chars.indexOf(ch)>=0;
      h+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="'+(on?ink:faint)+'"/><text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" font-size="11" text-anchor="middle" fill="'+(on?ink:faint)+'" font-family="sans-serif">'+ch+'</text>'})}
  var pts=r.chars.map(pt);
  if(pts.length>=2){h+='<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="'+ink+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    var a=pts[pts.length-2],b=pts[pts.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy)||1,nx=-dy/L,ny=dx/L;
    h+='<line x1="'+(b[0]+nx*10).toFixed(1)+'" y1="'+(b[1]+ny*10).toFixed(1)+'" x2="'+(b[0]-nx*10).toFixed(1)+'" y2="'+(b[1]-ny*10).toFixed(1)+'" stroke="'+ink+'" stroke-width="3" stroke-linecap="round"/>';}
  if(pts.length>=1)h+='<circle cx="'+pts[0][0].toFixed(1)+'" cy="'+pts[0][1].toFixed(1)+'" r="7" fill="none" stroke="'+ink+'" stroke-width="3"/>';
  return h+'</svg>';
}

  var h='<div class="crumb"><a href="#/lab">実験室</a> › シジル工房</div><h1>シジル工房</h1>';
  h+='<div class="box sans">スペア以後の個人用シジルの「圧縮→図形化」の工程を体験するツールです。ここで使う「文字盤をたどる方法」は、数ある図形化の方法の<b>一例</b>にすぎません。図形そのものに効果があるという証拠はありません（講義「心理的な作用の検証」を参照）。<br>意図文は、<b>自分の行動で、測れて、肯定形・現在形で、小さく、安全</b>なものにしてください。お金・賭け事・他人の気持ちや行動・健康に関わる内容は、対象にしません。</div>';

  return h;

      if(nid){var i=state.notes.findIndex(function(x){return x.id===nid});if(i>=0)state.notes[i]=rec;noteState.edit=null}
      else{state.notes.push(rec);var day=dkey(Date.now()),cnt=Object.keys(state.awards).filter(function(k){return k.indexOf('note:'+day)===0}).length;if(cnt<3){award('note:'+day+':'+rec.id,15,rec.domain,'研究ノート：'+(rec.title||'無題'));msg2+='（+15 XP）'}else logAct('note','研究ノート：'+(rec.title||'無題'))}
      save();toast(msg2);render();break}
    case 'editnote':noteState.edit=D('n');render();break;
    case 'cancelnote':noteState.edit=null;render();break;
    case 'delnote':if(confirm('このノートを削除しますか？（取り消せません）')){state.notes=state.notes.filter(function(x){return x.id!==D('n')});save();render()}break;
    case 'export':doExport();break;
    case 'doimport':{var mode=(document.querySelector('input[name="impMode"]:checked')||{}).value||'merge';if(mode==='overwrite'&&!confirm('現在のデータがファイルの内容で置き換わります。よろしいですか？'))break;applyImport(mode);break}
    case 'cancelimport':pendingImport=null;$('#impBox').innerHTML='';break;
    case 'savesettings':state.settings.idleMinutes=num(val('s_idle'),5,1,120);state.settings.autoPauseHidden=!!document.getElementById('s_hidden').checked;state.settings.auto=!!document.getElementById('s_auto').checked;autoHold=false;autoSync();save();renderBar();toast('設定を保存しました。');break;
    case 'reset':if(confirm('すべての学習データを削除します。よろしいですか？')&&confirm('本当に削除しますか？この操作は取り消せません。')){state=defaultState();save();render();toast('初期化しました。')}break;
  }
}

function init(){
  state=loadState();var recovered=state._recovered;delete state._recovered;
  document.addEventListener('click',onClick);
  ['mousemove','keydown','touchstart','scroll','click','wheel'].forEach(function(e){window.addEventListener(e,markActive,{passive:true})});
  window.addEventListener('hashchange',function(){hideOverlay();autoHold=false;autoSync();render()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hideOverlay()});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      if(state.settings.auto)autoSync();
      else if(state.timer&&state.timer.runningSince&&state.settings.autoPauseHidden)pauseTimer(Date.now(),null);
      if(state.timer&&state.timer.runningSince)state.timer.lastBeat=Date.now();save();
    }else{
      markActive();
      if(!state.settings.auto&&state.timer&&!state.timer.runningSince&&state.settings.autoPauseHidden)toast('タブが非表示の間、計測を一時停止しました。再開するには「再開」を押してください。');
    }
    renderBar();
  });
  window.addEventListener('pagehide',function(){if(state.timer&&state.timer.runningSince)state.timer.lastBeat=Date.now();save()});
  window.addEventListener('storage',function(e){if(e.key===LS_KEY){state=loadState();render()}});
  setInterval(tick,1000);
  autoSync();render();
  if(recovered)toast('前回の計測セッションを復元しました（最後に確認できた時点までを記録しています）。');
  else if(state.timer&&!state.settings.auto)toast('計測セッションが残っています。「再開」または「学習終了」を選んでください。');
}

  if(document&&document.getElementById&&!window.__GR_NOINIT)init();}

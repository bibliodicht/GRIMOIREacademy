<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIMOIRE｜グリモアール</title>
<style>
:root{
  --navy:#0d1526;--navy2:#142038;--navy3:#1b2a47;--brown:#2a1d14;--brown2:#3a281b;
  --gold:#b8964e;--gold2:#d6b97a;--ivory:#e9e0c9;--ivory2:#c9bfa6;--green:#2c3e2f;--green2:#4b6b50;
  --danger:#a8553f;--ok:#6f9a6a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Times New Roman",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top,#16233f 0%,var(--navy) 55%,#080d18 100%) fixed;color:var(--ivory);font-family:var(--serif);font-size:16px;line-height:1.8;padding-bottom:84px}
a{color:var(--gold2);text-decoration:none;border-bottom:1px dotted rgba(214,185,122,.5)}
a:hover{color:#f0dba0}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--brown),#1d140e);border-bottom:1px solid var(--gold);box-shadow:0 2px 12px rgba(0,0,0,.5)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--serif);letter-spacing:.28em;font-size:22px;color:var(--gold2);border:none;white-space:nowrap}
.logo small{display:block;letter-spacing:.1em;font-size:10px;color:var(--ivory2)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch}
nav a{border:none;padding:8px 12px;color:var(--ivory2);font-family:var(--sans);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
nav a.on{color:var(--gold2);border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:20px 14px}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--gold2);line-height:1.4}
h1{font-size:28px;margin:.2em 0 .6em;letter-spacing:.06em}
h2{font-size:21px;margin:1.6em 0 .6em;padding-bottom:.25em;border-bottom:1px solid rgba(184,150,78,.4)}
h3{font-size:17px;margin:1.2em 0 .4em}
.card{background:linear-gradient(160deg,rgba(42,29,20,.85),rgba(20,32,56,.85));border:1px solid rgba(184,150,78,.45);border-radius:6px;padding:16px 18px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat b{display:block;font-size:26px;color:var(--gold2);font-family:var(--serif)}
.stat span{font-family:var(--sans);font-size:12px;color:var(--ivory2)}
.muted{color:var(--ivory2);font-size:14px}
.sans{font-family:var(--sans)}
.bar{height:8px;background:#0a1020;border:1px solid rgba(184,150,78,.4);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold))}
.btn,button{font-family:var(--sans);font-size:14px;color:var(--ivory);background:var(--brown2);border:1px solid var(--gold);border-radius:4px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover,button:hover{background:#4d3623}
button.pri{background:var(--green);border-color:var(--gold2)}
button.pri:hover{background:var(--green2)}
button.danger{border-color:var(--danger);color:#e8b7a8}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;padding:1px 8px;border:1px solid rgba(184,150,78,.6);border-radius:10px;color:var(--gold2);margin-right:4px}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.warn{border-color:var(--danger);color:#e8b7a8}
.tag.plan{border-color:#6c7a93;color:#9aa8c2}
input,select,textarea{font-family:var(--sans);font-size:15px;background:#0a1222;color:var(--ivory);border:1px solid rgba(184,150,78,.5);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.6}
label{display:block;font-family:var(--sans);font-size:13px;color:var(--ivory2);margin:10px 0 3px}
.form2{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lec{background:rgba(233,224,201,.05);border-left:3px solid var(--gold);padding:6px 18px;font-size:17px;line-height:2}
.lec p{margin:.9em 0}
.box{border:1px solid rgba(184,150,78,.4);background:rgba(0,0,0,.2);padding:10px 16px;border-radius:4px;margin:12px 0}
.box.warn{border-color:var(--danger)}
ul.clean{padding-left:1.3em;margin:.4em 0}
ul.clean li{margin:.25em 0}
.crumb{font-family:var(--sans);font-size:13px;color:var(--ivory2)}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14px}
th,td{border:1px solid rgba(184,150,78,.35);padding:6px 9px;text-align:left;vertical-align:top}
th{background:rgba(184,150,78,.15);color:var(--gold2)}
.tl{border-left:2px solid var(--gold);margin:10px 0 10px 8px;padding-left:16px}
.tl div{margin:.7em 0;position:relative}
.tl div:before{content:"";position:absolute;left:-23px;top:.6em;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl b{color:var(--gold2);font-family:var(--sans);font-size:13px;display:block}
svg.dia{width:100%;height:auto;max-width:720px;display:block;margin:10px auto}
.sv-box{fill:#1b2a47;stroke:#b8964e;stroke-width:1.4}
.sv-t{fill:#e9e0c9;font-size:14px;text-anchor:middle;font-family:var(--sans)}
.sv-s{fill:#c9bfa6;font-size:11px;text-anchor:middle;font-family:var(--sans)}
.sv-l{stroke:#b8964e;fill:none;stroke-width:1.5}
.opt{display:block;padding:7px 10px;border:1px solid rgba(184,150,78,.3);border-radius:4px;margin:5px 0;cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--ivory)}
.opt input{width:auto;margin-right:8px}
.opt.right{border-color:var(--ok);background:rgba(111,154,106,.15)}
.opt.wrong{border-color:var(--danger);background:rgba(168,85,63,.15)}
.glyph{font-size:34px;color:var(--gold);line-height:1}
#timerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(#1d140e,var(--brown));border-top:1px solid var(--gold);box-shadow:0 -2px 12px rgba(0,0,0,.6)}
.tb-in{max-width:1080px;margin:0 auto;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--sans);font-size:14px}
.tb-time{font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums;font-family:var(--serif)}
.tb-in select{width:auto;max-width:220px;padding:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:#0a1222;border:1px solid var(--gold);padding:10px 18px;border-radius:6px;font-family:var(--sans);font-size:14px;max-width:92vw;display:none;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.hide{display:none}
@media (max-width:600px){body{padding-bottom:110px}.tb-in{gap:6px;padding:6px 10px;font-size:13px}.tb-in button{padding:5px 9px;font-size:13px;min-height:32px}.tb-time{font-size:18px}.tb-in .muted{font-size:12px}h1{font-size:23px}.lec{font-size:16px;padding:4px 12px}.logo{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card:hover{border-color:var(--gold)}}
</style>
</head>

LECTURES['chaos-1-1']={
goals:['カオスマジックが成立した経緯と主要人物を説明できる','従来の西洋儀式魔術との方法論の違いを説明できる','「信念を道具として扱う」という考え方と、その検証上の注意点を説明できる'],
intro:'魔術と聞けば、多くの人は古代から受け継がれた秘伝の体系を思い浮かべるでしょう。ところが20世紀後半のイギリスに現れたカオスマジックは、まるで逆の方向を向いていました。体系の権威に従うのではなく、「それは実際に自分に何をもたらすのか」を試して確かめる。魔術を、信念と象徴を扱う実験的な技術として捉え直したのです。この講義では、その成立の道筋と考え方を、批判的な目で見ていきます。',
sections:[
{h:'系譜：スペアから1970年代のイギリスへ',p:['出発点としてよく挙げられるのが、画家・著述家のオースティン・オスマン・スペア（Austin Osman Spare, 1886–1956）です。1913年の『The Book of Pleasure』などで、自らの欲求を短い文にし、文字を整理して一つの図形（シジル）に変え、意識的な思考から手放すという方法を提示しました。{r:spare1913} スペア自身は生前、広い読者を得なかったとされ、後の世代による再評価を経て影響が広がりました。','1970年代後半、ピーター・J・キャロル（Peter J. Carroll, 1953–）らが、こうした流れを方法論として整理します。1978年に『Liber Null』が刊行され、同じ頃に魔術結社 Illuminates of Thanateros（IOT）が結成されました。後に『Liber Null & Psychonaut』の合本としても流通しています。{r:carroll1987} 実践の手引きとしては、フィル・ハイン（Phil Hine）の『Condensed Chaos』なども広く読まれました。{r:hine1995}']},
{h:'従来の西洋魔術との違い',p:['ゴールデン・ドーン（黄金の夜明け団）に連なる儀式魔術では、象徴の対応関係や位階、手順がかなり厳密に体系化されています。これに対してカオスマジックは、**特定の象徴体系そのものより、どう使うかという方法**を重視します。ある時は一つの世界観（パラダイム）を採用し、別の時には別のものに切り替える。この「パラダイムの切り替え」が、カオスマジックの特徴的な発想です。','もっとも、実際の実践者は従来の象徴体系も借用しますし、「何でもあり」を意味するわけではありません。「違い」は程度の問題であり、対立として単純化しないことが大切です。']},
{h:'信念は道具になるのか',p:['カオスマジックの中心にある主張は、信念は固定した真理ではなく、状態を変えるための道具として扱いうる、というものです。しかし、ここに本教材が最も慎重になる点があります。「信念を自由に切り替えられるのか」「それが行動や感情を実際に変えるのか」は、**経験的に検証すべき問い**であって、前提にしてよいことではありません。','心理学には、手がかりになりそうな知見があります。たとえば「もしXならYする」と具体的に決めておく実行意図（if-then 計画）は、目標の達成を助けることが報告されています。{r:gollwitzer1999} シジルなどの技法に何らかの効果があるとすれば、まずはこうした心理的な経路（注意の向け方、意図の明確化、行動の引き金）を通じて起こる可能性を検討するのが、本教材の立場です。超常的な作用が検証されているわけではありません。']},
{h:'この教材での扱い方',p:['本教材では、カオスマジックに関わる主張を次の三つに分けて扱います。①歴史的・思想的な主張（誰が何を述べたか）、②現代の心理学で説明・検証できる主張、③未検証の主張。③を「事実」として扱うことはしません。そのうえで、自分で仮説を立て、記録し、比較する。それがこの領域の学び方です。']}],
diagram:{type:'flow',items:[['信念','考え方・解釈'],['期待','予測する'],['注意','何に目が向くか'],['行動','実際の動き'],['結果','出来事']],loop:'結果の受け取り方が信念を強化する（確証バイアスが入り込みやすい箇所）',cap:'図1：信念から行動へのフィードバック・ループ（単純化したモデル）'},
examples:['仮説の例：「机の上を整えて深呼吸してから始めると、最初の10分の集中度が高い」。これを信じ込むのではなく、実施した日としなかった日を記録して比較する。','悪い例：「儀式をした日に良いことが起きた」とだけ記録し、起きなかった日を数えない。これでは確証バイアスで「効いた」ように見える。'],
life:['習慣づくり：行動の「きっかけ」を事前に決めておくと始めやすくなる、という考え方につながる。','期待が体験に与える影響（プラセボ効果など）を、自分の学習や仕事で意識できるようになる。','「信じるかどうか」ではなく「どう測るか」で物事を考える習慣がつく。'],
summary:['カオスマジックはスペアの系譜を受けて、1970年代後半に整理された、方法と信念を道具として扱う潮流。','従来の儀式魔術より、体系への忠実さより方法の実験性を重視する。','「信念を道具にできるか」は検証すべき問いであり、前提ではない。','本教材は、歴史的主張・心理学で説明できる主張・未検証の主張を区別する。'],
quiz:[
{q:'スペアが『The Book of Pleasure』を刊行した年として、本講義で示されたのはどれか。',o:['1913年','1978年','1888年','1966年'],a:0,e:'スペアの『The Book of Pleasure』は1913年の刊行です。1978年はキャロルの『Liber Null』と IOT の時期です。'},
{q:'カオスマジックの特徴として最も適切なものはどれか。',o:['固定された象徴体系と位階への忠実さを最も重んじる','方法や信念を道具として扱い、効果を試して確かめる姿勢を重んじる','超自然的な効果が科学的に証明された技術体系である','ユダヤ教の神秘思想の正統な継承である'],a:1,e:'体系への忠実さより、方法の実験性やパラダイムの切り替えが特徴です。超自然的効果は検証されていません。'},
{q:'本教材でシジルなどの効果を検討するときの基本的な立場はどれか。',o:['超常的な効果が起きると前提にする','行動や心理の変化として測定できる仮説を立て、記録して比較する','うまくいった例だけを記録する','信念は検証できないので検討しない'],a:1,e:'測定可能な仮説にして、記録・比較することが基本です。'},
{q:'実験の記録で、特に注意すべき認知バイアスはどれか。',o:['確証バイアス（当たった例だけを覚え、外れを軽視する）','後知恵バイアスは存在しない','記録は主観的であるほど正確になる','バイアスは訓練しても関係ない'],a:0,e:'外れた日も数えること、事前に仮説と指標を決めておくことが対策になります。'}],

LECTURES['kabbalah-1-1']={
goals:['カバラの語義と、主要な文献・時代の流れを説明できる','ユダヤ教の伝統的カバラと、ヘルメティック・カバラの違いを説明できる','宗教的伝統への敬意を保った学び方を理解する'],
intro:'「カバラ」は、日本語の本や映画でもよく目にする言葉です。しかし、その中身は、ユダヤ教の長い神秘思想の伝統から、19世紀以降の西洋のオカルティズム、さらには現代の自己啓発的な用法まで、かなり幅があります。この講義では、まず混同されやすい二つの流れを分けて、地図を作ります。',
sections:[
{h:'「カバラ」とは何か',p:['カバラ（קַבָּלָה, Kabbalah）は、ヘブライ語で「受け取ること」「受け継がれたもの」を意味する語に由来し、ユダヤ教の神秘思想・伝統を指します。神がどのように世界を創り、人間はそれとどう関わるのかという問いを、聖書の解釈や象徴を通して探究する営みです。','代表的な古典として、10のセフィロト（ספירות, Sefirot）と22のヘブライ文字による創造を語る『セーフェル・イェツィラー』（成立年代は学説により異なる）{r:seferyetzirah}、13世紀後半に現れた『ゾーハル』{r:zohar} があります。『ゾーハル』は伝統的にはシモン・バル・ヨハイに帰されますが、学術的には13世紀後半のスペインで成立したとする見方が有力です。{r:scholem1941}']},
{h:'歴史の流れ',p:['12〜13世紀の南フランスやスペインで、カバラは文献として姿を現し、16世紀にはツファット（サフェド）でイサク・ルリアらが新しい展開を見せます。一方、15世紀末にはピコ・デッラ・ミランドラらのようなキリスト教徒の知識人もカバラに関心を寄せ、これは「キリスト教カバラ」と呼ばれます。','年代や学説については、研究者によって見解が分かれる点があります。ここでは大まかな流れを把握し、詳細は文献で確認してください。']},
{h:'二つの系譜：ユダヤ教のカバラとヘルメティック・カバラ',p:['19世紀以降、西洋のオカルティズムの中で、カバラの用語や「生命の樹」が再構成されました。これはしばしば**ヘルメティック・カバラ**（Hermetic Qabalah）と呼ばれ、綴りを Qabalah として区別されることもあります。タロットの22枚の大アルカナとヘブライ文字22字を対応させる発想は、この流れの中で発展しました。','ディオン・フォーチュン（Dion Fortune）の『The Mystical Qabalah』（1935）は、この西洋的な解釈の代表的な書籍です。{r:fortune1935} 重要なのは、これは**ユダヤ教の伝統的なカバラそのものではない**という点です。両者は歴史的背景も目的も異なります。']},
{h:'敬意をもって学ぶために',p:['ユダヤ教のカバラは、本来、聖書やタルムードの学び、宗教的実践と結びついた伝統です。本教材はこれを、単なる魔術の道具や象徴の「素材」として扱いません。生命の樹などの象徴は、この教材では「思考を整理するための象徴体系」として学びますが、その由来が宗教的伝統にあることを常に明記します。','また、現代の商業的な「カバラ」の用法や、効果についての主張は、歴史研究の成果とは別物です。出典を確かめる習慣を持ちましょう。']}],
diagram:{type:'timeline',items:[['古代末期〜中世初期（年代は学説による）','『セーフェル・イェツィラー』'],['12〜13世紀','文献の成立と展開（『バヒル』、『ゾーハル』など）'],['16世紀','ツファットでのルリア派の展開'],['15世紀末〜','キリスト教徒によるカバラへの関心（キリスト教カバラ）'],['19世紀','西洋オカルティズムによる再構成（ヘルメティック・カバラ）'],['1935年','ディオン・フォーチュン『The Mystical Qabalah』']],cap:'図1：カバラの流れの概観（年代は概数。学説により異なる）'},
examples:['同じ「生命の樹」でも、ユダヤ教の文献の中での位置づけと、近代西洋オカルティズムの図式化とは別物。','「タロットとヘブライ文字の対応」は、ユダヤ教の伝統にあるものではなく、近代西洋の発展として扱う。'],
life:['宗教や思想を学ぶときに、「伝統」と「後世の再解釈」を分ける習慣がつく。','象徴体系を、概念の整理や分類に使う発想（第5章で実践）の土台になる。','出典の成立時期や由来を確認する、文献批判の姿勢が身につく。'],
summary:['カバラ（קַבָּלָה）は「受け継がれたもの」を意味するユダヤ教の神秘思想の伝統。','『セーフェル・イェツィラー』『ゾーハル』などが重要な古典。成立年代には学説がある。','ヘルメティック・カバラは、近代西洋オカルティズムによる再構成であり、伝統的カバラとは別の系譜。','宗教的伝統への敬意を保ち、単なる魔術の道具として扱わない。'],

LECTURES['memory-1-1']={
goals:['記憶の三つの段階（記銘・保持・想起）を説明できる','感覚記憶・作業記憶・長期記憶の違いと、容量の制約を説明できる','古典記憶術と現代の記憶科学をつなぐ視点を持つ'],
intro:'「覚えたはずなのに、思い出せない」。この経験は誰にでもあります。記憶術を学ぶ前に、まず記憶がどのように働き、どこでつまずくのかを知っておくと、技法の「効く理由」と「効かない場面」が見えてきます。この講義は、その地図を描く入門です。',
sections:[
{h:'記憶の三つの段階',p:['記憶は、情報を取り入れて符号化する**記銘（符号化）**、それを蓄えておく**保持**、必要なときに取り出す**想起（検索）**の三つの段階で考えられます。「忘れた」といっても、どの段階での失敗かによって、有効な対策は変わります。そもそも注意が向いていなければ記銘できませんし、うまく符号化できていても、手がかりがなければ想起できないことがあります。']},
{h:'三つの記憶と容量の制約',p:['古典的なモデルでは、記憶を感覚記憶・短期記憶・長期記憶に分けて捉えます。{r:atkinson1968} その後、短期記憶は、情報を保ちながら操作する**作業記憶**（ワーキングメモリ）として捉え直されました。{r:baddeley1974}','作業記憶の容量は限られています。ミラーの論文で広まった「7±2」{r:miller1956} に対し、後にコーワンは、チャンク（意味のまとまり）として約4個程度という見方を提案しました。{r:cowan2001} 数字の違いはあっても、「一度に扱える量には限りがあり、まとまり（チャンク）にすることで実質的に増やせる」という点は共通しています。記憶術の多くは、この制約への工夫として理解できます。']},
{h:'忘却はどう起こるか',p:['19世紀のエビングハウスは、無意味な音節を覚えて、時間とともに保持量がどう減るかを調べました。{r:ebbinghaus1885} 忘却の説明には、時間による減衰だけでなく、他の記憶との干渉や、手がかりの不足による想起失敗なども挙げられます。「忘却曲線」の形は、材料や条件によって変わるため、単純な一本の曲線で万能に説明できるわけではありません（第4章で扱います）。']},
{h:'古典記憶術への入口',p:['古代ギリシア・ローマの弁論家たちは、長い演説を暗記するために、見慣れた場所に覚えたい内容のイメージを配置する**場所法**を用いたとされます。現存する体系的な記述の一つが『ヘレンニウスへ』に含まれ、{r:adherennium} 記憶術の歴史は、フランシス・イェイツの『記憶術』で詳しく論じられています。{r:yates1966} なお、詩人シモニデスにまつわる起源の逸話は伝承であり、史実として確認されているわけではありません。','現代の研究では、思い出す練習（想起練習）が、単に読み返すより長期の保持に有利になる場合があることが示されています。{r:roediger2006} 古典記憶術と現代の記憶科学は、「符号化を工夫する」「想起を練習する」という点でつながります。']}],
diagram:{type:'flow',items:[['感覚入力','見る・聞く'],['注意','選択'],['作業記憶','保持・操作'],['符号化','記銘'],['長期記憶','保持']],loop:'想起（検索）：手がかりによって長期記憶から取り出す',cap:'図1：記憶の流れ（単純化したモデル）'},
examples:['電話番号を「090-1234-5678」のように区切って覚えるのは、チャンク化の例。','買い物リストを、家の中の場所に結びつけたイメージで覚えるのは、場所法の簡易版。'],
life:['「覚えられない」を、記銘・保持・想起のどの段階の問題かに分けて考えられる。','学習は、「読み返す」だけでなく「思い出す」練習を入れると効果的な場合がある。','容量の制約を知ると、情報の整理や提示の仕方を工夫できる。'],
summary:['記憶は、記銘（符号化）・保持・想起の三段階で考える。','作業記憶の容量は限られ、チャンク化で実質的に扱える量を増やせる。','忘却は、減衰・干渉・手がかり不足など複数の要因で説明される。','場所法は古代から使われた技法で、現代の記憶科学とも接点がある。'],
quiz:[
{q:'記憶の三つの段階として適切なものはどれか。',o:['記銘（符号化）・保持・想起','感覚・感情・意志','暗記・理解・応用','短期・中期・長期'],a:0,e:'記銘（符号化）・保持・想起の三段階です。'},
{q:'コーワン（2001）が主張した、作業記憶の容量はどのくらいか。',o:['約4チャンク','約7チャンクで確定','約20チャンク','容量に限界はない'],a:0,e:'ミラーの「7±2」を再検討し、約4チャンクとする見方を提案しました。'},
{q:'場所法の説明として適切なものはどれか。',o:['見慣れた場所に沿って、覚えたい内容のイメージを配置する方法','同じ文を何十回も書き写す方法','睡眠中に音声を流す方法','数字を足し算で覚える方法'],a:0,e:'場所（loci）とイメージを使う古典的な記憶術です。'},
{q:'Roediger と Karpicke（2006）に基づく本講義の説明として適切なものはどれか。',o:['想起練習（テスト）は、条件によっては再読より長期の保持に有利','テストは常に再読より劣る','睡眠は記憶に無関係','忘却曲線は完全に正確'],a:0,e:'条件によって効果が異なる点に注意が必要です。'}],
refs:['atkinson1968','baddeley1974','miller1956','cowan2001','ebbinghaus1885','adherennium','yates1966','roediger2006']};

LECTURES['mental-1-1']={
goals:['意識・注意・メタ認知の基本的な概念を説明できる','心が「さまよう」ことが日常的に起こると理解する','思考と自分を同一視しない考え方の意味を説明できる','精神的な実践を安全に行う心構えを持つ'],
intro:'この領域でいう「精神制御」は、他人の心を操る技術ではありません。自分の注意・思考・感情・意識の状態を理解し、必要に応じて調整する力を指します。そのためにはまず、「今、自分の心で何が起きているか」を観察する力が要ります。この講義では、そのための基礎概念を整理します。',
sections:[
{h:'意識と注意',p:['心理学者ウィリアム・ジェームズは、『心理学原理』（1890）で、意識を途切れなく流れる「流れ」として描き、何に注意を向けるかが私たちの経験を形づくると論じました。{r:james1890} 注意とは、膨大な情報の中から何かを選んで、そこに処理資源を向ける働きです。カーネマンは、注意を限りある「努力」の資源として捉えました。{r:kahneman1973}','「意識」と「無意識」は、日常語では便利ですが、学術的には多様な意味で使われます。この教材では、「気づいている部分」と「気づいていない処理」があるという程度の素朴な区別から始め、断定的な理論には踏み込みません。']},
{h:'心はさまよう',p:['注意は、思ったほど安定しません。キリングスワースとギルバートは、スマートフォンで日常の活動中に「今何を考えているか」を尋ねる調査を行い、人は目の前の活動以外のことを考えている時間がかなり長い（報告では約47％）ことを示しました。{r:killingsworth2010} つまり、**注意が逸れること自体は、失敗ではなく、ごく普通の現象**です。大切なのは、逸れたことにいつ気づき、どう戻すかです。']},
{h:'メタ認知：自分の認知を観察する',p:['メタ認知とは、自分の認知（思考・記憶・理解の状態）を、一段高い視点から観察・評価・調整する働きです。{r:flavell1979} 「今、集中が切れているな」「この説明は理解できていないな」と気づけること自体が、調整の第一歩になります。','本教材の実践課題では、この観察を、回数・時間・主観的な評価として**記録する**ことを重視します。']},
{h:'思考と自分を同一視しない',p:['「自分はダメだ」という考えが浮かぶことと、「自分はダメな人間である」という事実とは別です。思考を、頭の中に浮かんだ出来事として眺める見方は、臨床心理学の ACT（アクセプタンス＆コミットメント・セラピー）などで、認知的脱フュージョンと呼ばれています。{r:hayes1999} ただし、これは思考を無視したり否定したりすることではありません。また、効果は目的や個人によって異なり、万能の方法ではありません。']},
{h:'安全に実践するために',p:['この領域の実践は、あくまで自己理解と自己調整のためのものであり、診断や治療の代わりにはなりません。強い不快感、不安、めまい、体調不良などが生じたら、ただちに中止してください。つらさが続く場合は、医療機関や専門家に相談してください。']}],
diagram:{type:'flow',items:[['集中','対象に注意'],['逸脱','雑念・さまよい'],['気づき','メタ認知'],['戻す','注意を再び対象へ']],loop:'このサイクルの繰り返しが、注意の訓練になる（雑念が起きること自体は失敗ではない）',cap:'図1：注意のサイクル'},
examples:['5分間、呼吸に注意を向ける。雑念に気づくたびに回数を記録し、そっと呼吸に戻る。','「また集中できなかった」ではなく、「4回気づいて戻せた」と記録する。'],
life:['勉強や仕事中に、注意が逸れたことに早く気づけるようになる。','ネガティブな考えが浮かんだとき、事実と思考を区別するきっかけになる。','「集中できない自分」を責める代わりに、観察して調整する姿勢が身につく。'],
summary:['注意は限りある資源で、何に向けるかが体験を形づくる。','心がさまようことは日常的に起こる（報告では約47％）。','メタ認知は、自分の認知状態を観察・評価・調整する働き。','思考を出来事として眺める見方があるが、万能ではなく、診断・治療の代わりでもない。'],
quiz:[
{q:'Killingsworth と Gilbert（2010）の調査で報告された、活動中に心がさまよっていた割合に最も近いものはどれか。',o:['約47％','約5％','約99％','ほぼ0％'],a:0,e:'本講義では約47％と紹介しました。数値の詳細は原典で確認してください。'},
{q:'メタ認知の説明として適切なものはどれか。',o:['自分の認知・思考の状態を観察・評価・調整する働き','超能力の一種','思考を完全に停止させる技術','他人の考えを読み取る能力'],a:0,e:'メタ認知は、自分の認知を一段高い視点から扱う働きです。'},
{q:'「思考と自分を同一視しない」という考え方の説明として適切なものはどれか。',o:['思考を、頭に浮かんだ出来事として観察する。無視や否定をすることではない','嫌な思考を完全に消す','すべての思考を事実として受け入れる','感情を持たないようにする'],a:0,e:'無視や抑え込みではなく、距離をとって眺める見方です。'},
{q:'実践中に強い不快感や体調不良が出た場合の対応として適切なものはどれか。',o:['我慢して続ける','ただちに中止し、続く場合は専門家に相談する','もっと強度を上げる','記録をやめて忘れる'],a:1,e:'実践は安全が最優先です。診断・治療の代わりにはなりません。'}],
refs:['james1890','kahneman1973','killingsworth2010','flavell1979','hayes1999']};

LECTURES['mental-2-1']={
goals:['思考抑制の代表的な研究（白クマ実験）を説明できる','皮肉過程理論の骨子を説明できる','研究結果が一貫しないことを理解し、断定を避けられる','「抑え込む」方法と「気づいて戻す」方法を比較する視点を持つ'],
intro:'「嫌な考えを頭から追い出したい」。誰もが一度は思うことでしょう。では、考えを「止める」ことは可能なのでしょうか。心理学者ダニエル・ウェグナーの有名な実験は、むしろ逆の効果が起こりうることを示しました。しかし話はそれほど単純ではありません。この講義では、研究の成果と限界の両方を見ていきます。',
sections:[
{h:'白クマ実験',p:['ウェグナーらの1987年の研究では、参加者に「白クマのことを考えないように」と指示して思ったことを声に出してもらい、その後に今度は白クマのことを考えてもよいと伝えました。先に抑制を求められた参加者は、その後、白クマについての思考が多くなる傾向を示した、と報告されています。{r:wegner1987} これは「思考抑制のリバウンド」として広く知られるようになりました。']},
{h:'皮肉過程理論',p:['ウェグナーは1994年に、この現象を説明する**皮肉過程理論**を提案しました。{r:wegner1994} 骨子は、思考を抑えるときに、二つの過程が働くというものです。一つは、目標とは別のことを考えようとする**操作過程**。もう一つは、抑えたい思考が出てきていないかをチェックする**監視過程**です。監視過程は、抑えたい対象を探すために、その思考を一時的に活性化させる面があります。疲れていたり、他のことで頭がいっぱいだったり（認知的負荷が高いとき）には、操作過程が弱まり、監視過程が相対的に優位になって、かえって対象が浮かびやすくなる、と説明されます。']},
{h:'結果は一貫しない',p:['ここで大切なのは、「思考抑制は必ず逆効果」とは言えない点です。その後の研究は多数あり、総説でも整理されています。{r:wenzlaff2000} 統制された研究を統合したメタ分析でも、効果は研究や条件によって異なることが検討されています。{r:abramowitz2001} 反動が確認される条件もあれば、確認されない条件もあります。思考の内容、抑える期間、測定の方法、個人の特性などが関わると考えられています。具体的な結果は原典で確認してください。','したがって本教材は、「思考は止められない」とも「抑制は必ず逆効果」とも断定しません。そして、**思考を完全に停止できる、という根拠のない主張もしません。**']},
{h:'もう一つの選択肢：気づいて戻す',p:['抑え込む代わりに、思考が浮かんでもそれに反応しすぎず、気づいたら注意を対象（呼吸など）に戻すという方法があります。これはマインドフルネスの実践や、ACT の認知的脱フュージョンなどで使われる考え方です。{r:hayes1999} ただし、これも万能ではなく、効果は目的や人によって異なります。','どちらが自分に合うかは、観察してみないと分かりません。実験室の課題「抑える方法と気づいて戻す方法の比較」で、回数・主観的疲労を記録して比べてみましょう。']}],
diagram:{type:'table',head:['','抑え込む方法','気づいて戻す方法'],rows:[['やること','特定の思考を考えないようにする','思考が浮かんだら気づき、注意を対象に戻す'],['研究上の位置づけ','反動の報告がある一方、結果は条件により一貫しない','マインドフルネス・ACTなどで用いられる考え方'],['注意点','負荷が高いときに逆効果の可能性が議論されている','万能ではなく、効果は目的・個人で異なる'],['本教材での扱い','自分で比較して観察する','自分で比較して観察する']],cap:'図1：二つの対処方法の整理（結論を断定せず、比較の観点を示す）'},
examples:['課題：5分間、「ある特定の考え」が浮かぶたびに回数を記録する。方法Aは抑え込む、方法Bは気づいて戻す。順番は日を変えて入れ替える。','寝る前の考えごとを抑え込もうとして、かえって目が冴えた経験を、観察記録にしてみる（無理に再現する必要はない）。'],
life:['「考えないようにする」ことに疲れたときの、別の選択肢を知ることができる。','研究結果が一貫しない場合でも、自分で記録して確かめる方法が分かる。','ネットや書籍の断定的な主張（「思考は完全に止められる」など）に注意できる。'],
summary:['白クマ実験などで、抑制後の思考の増加（リバウンド）が報告されている。','皮肉過程理論は、操作過程と監視過程で逆効果を説明する。','後続研究の結果は一貫せず、「必ず逆効果」とも「問題ない」とも断定できない。','「気づいて戻す」方法もあるが、万能ではない。自分で記録して比較する。'],
quiz:[
{q:'Wegner らの1987年の研究で報告された内容として、本講義で説明されたものはどれか。',o:['抑制を求められた後に、その思考が増える傾向（リバウンド）が報告された','抑制すれば思考は完全に消えることが示された','思考抑制には全く効果がないと証明された','睡眠の効果が示された'],a:0,e:'抑制後に対象の思考が増える傾向が報告されました。'},
{q:'後続研究の結果についての説明として適切なものはどれか。',o:['効果は一貫せず、条件によって反動が出たり出なかったりする','反動は常に起こる','反動は一度も確認されていない','研究は一つしかない'],a:0,e:'本教材は、「必ず逆効果」とも断定しません。'},
{q:'皮肉過程理論の説明として適切なものはどれか。',o:['抑制を担う操作過程と、失敗を検出する監視過程があり、負荷が高いと逆効果が起こりうる','思考は超自然的な力で制御される','感情は存在しない','記憶は睡眠中のみ作られる'],a:0,e:'操作過程と監視過程の二つで説明されます。'},
{q:'「気づいて戻す」方法の位置づけとして適切なものはどれか。',o:['思考の完全停止を目的とせず、マインドフルネスや ACT などで用いられる考え方','必ず全員に効果がある万能の方法','思考を消すための唯一の方法','科学とは無関係'],a:0,e:'目的は完全停止ではなく、注意の扱い方の調整です。'}],
refs:['wegner1987','wegner1994','wenzlaff2000','abramowitz2001','hayes1999']};

/* ---------- [1-c2] 精神制御・意識調整：第1〜4章の講義 ---------- */
function mq(q,o,a,e){return {q:q,o:o,a:a,e:e}}
function mkL(id,goals,intro,secs,diagram,examples,life,summary,quiz,refs){LECTURES[id]={goals:goals,intro:intro,sections:secs.map(function(s){return {h:s[0],p:s.slice(1)}}),diagram:diagram,examples:examples,life:life,summary:summary,quiz:quiz,refs:refs}}

mkL('mental-1-2',
['「気づいていない処理」があることと、内省の限界を説明できる','自分の精神状態を、事実の言葉で記録する方法を実践できる','感情に言葉を当てはめる（ラベリング）研究の内容と限界を説明できる'],
'前の講義では、注意が逸れること自体は普通の現象だと確認しました。では、自分の心の状態は、どうすれば正確に観察できるのでしょうか。実は、自分の心を覗き込む「内省」は、思ったほど当てになりません。この講義では、その限界を知ったうえで、観察を記録として残す方法を身につけます。',
[['気づいていない処理と、内省の限界',
 'ニスベットとウィルソンは、人が自分の判断や行動の原因を説明するとき、実際に働いた要因ではなく、もっともらしい理由を述べてしまう場合があることを論じました。{r:nisbett1977} つまり、「なぜそう感じたか」という自己説明は、いつも正確とは限りません。',
 '本教材でいう「無意識」は、神秘的な力を指しません。「自分では気づいていない情報処理がある」という、控えめな意味で使います。だからこそ、頭の中の説明より、回数・時間・状況といった記録のほうを手がかりにします。'],
['思考はどこから浮かぶのか',
 '思考の多くは、記憶、連想、その場の状況、体の状態に応じて、こちらが選ぶ前に浮かびます。課題をしていない安静時に活動が高まる脳領域のまとまりは、デフォルトモード・ネットワークと呼ばれ、心のさまよいとの関連が研究されています。{r:raichle2001} ただし、脳活動と体験との対応は研究の途上にあり、単純な図式で断定はできません。',
 '大切なのは、「浮かんだ思考は、自分が選んだ結論ではなく、頭に現れた出来事である」と観察できることです。浮かぶこと自体を責める必要はありません。'],
['観察を記録する：四つの軸',
 '観察は、次の四つの軸で、短く事実の言葉で書き留めます。①注意の対象（今、何に注意が向いていたか）、②思考の種類（計画・過去の振り返り・心配など）、③感情（名前と強さ0〜10）、④身体の感覚（肩のこわばり、呼吸の浅さなど）。',
 '感情に名前をつけると、扁桃体の反応が弱まったという実験があります。{r:lieberman2007} ただし、これは実験室での研究であり、日常の悩みにそのまま当てはまるとは限りません。記録は、感情を消す道具ではなく、状況を整理する道具として使います。'],
['観察の落とし穴',
 '観察が評価に変わると、記録は自己批判の材料になります。「ダメだ」と書く代わりに「焦り 6/10、胸がそわそわ」と書く。また、観察のしすぎで疲れることもあります。1日に数回、短時間で十分です。{r:kabatzinn1990}']],
{type:'table',head:['観察の軸','問い','記録の例'],rows:[['注意の対象','今、何に注意が向いていたか','画面ではなく、昼食のことを考えていた'],['思考の種類','どんな種類の考えか','計画／過去／心配／空想'],['感情','名前と強さ（0〜10）','焦り 6'],['身体','どこにどんな感覚があるか','肩がこわばる、呼吸が浅い']],cap:'図1：精神状態の観察記録フォーマット（事実の言葉で、評価を交えない）'},
['1日3回（朝・昼・夜）、アラームが鳴った瞬間の四つの軸を30秒で記録する。','「自分はダメだ」と思ったとき、「ダメだという考えが浮かんでいる。焦り 7/10」と書き換えてみる。'],
['気分が悪いときに、原因を決めつける前に、事実を整理できる。','集中の乱れや疲れの傾向（時間帯・状況）を、数字で把握できる。','自分の説明を鵜呑みにしない、批判的な姿勢が身につく。'],
['内省で述べる理由は、実際の原因と一致しない場合がある。','「無意識」は、気づいていない情報処理という控えめな意味で使う。','観察は、注意・思考・感情・身体の四軸で、事実の言葉で記録する。','感情のラベリングの研究は実験室でのもので、日常への一般化は慎重に行う。'],
[mq('Nisbett と Wilson（1977）の議論として、本講義で説明されたものはどれか。',['人は自分の判断の原因を、いつも正確に内省できるとは限らない','内省は常に正確である','無意識は超自然的な力である','思考は完全に制御できる'],0,'自己説明は、もっともらしい理由になってしまう場合があります。'),
 mq('感情のラベリングの研究についての説明として適切なものはどれか。',['言葉を当てはめると扁桃体の反応が弱まったと報告されたが、日常への一般化は慎重に行う','ラベリングは感情を必ず消す','ラベリングは科学的根拠が全くない','ラベリングは他人の感情を操作する技術である'],0,'実験室での結果であり、効果の範囲は慎重に見極めます。'),
 mq('観察記録の書き方として望ましいものはどれか。',['事実の短い言葉で、評価を交えずに書く','「自分はダメだ」と断定して書く','原因を推測して長く書く','記録はせず、頭で覚えておく'],0,'「焦り 6/10、胸がそわそわ」のように、事実の言葉で書きます。'),
 mq('デフォルトモード・ネットワークの説明として適切なものはどれか。',['課題をしていない安静時に活動が高まり、心のさまよいとの関連が研究されている脳領域のまとまり','超能力を司る脳の部位','睡眠中にのみ働く領域','感情を完全に消す回路'],0,'関連の解釈は研究の途上にあります。')],
['nisbett1977','raichle2001','lieberman2007','kabatzinn1990']);

mkL('mental-2-2',
['反芻思考とは何かを説明できる','反復思考に、建設的な面と非建設的な面があるという考え方を説明できる','「気づく→具体化する→注意を切り替える」の手順を実践できる','専門家に相談する目安を理解する'],
'済んだことを何度も頭の中で再生してしまう。答えのない「なぜ」を回し続けてしまう。こうした状態を、心理学では反芻と呼びます。前の講義では、考えを抑え込む方法の難しさを見ました。この講義では、反芻から離れるための、もう少し具体的な道具を見ていきます。',
[['反芻とは何か',
 '反芻とは、特に否定的な内容について、同じ考えを繰り返し考え続けることです。ノーレン＝ホークセマらは、落ち込んだときの反芻的な反応が、抑うつの持続と関連することを報告しました。{r:nolen1991} その後の研究は総説で整理されています。{r:nolen2008}',
 'ただし、考え続けること自体がいつも悪いわけではありません。ワトキンスは、反復思考には建設的なものと非建設的なものがあり、抽象的で「なぜ」ばかりに偏る思考は有害になりやすく、具体的で次の行動に結びつく思考は有益になりうる、と論じています。{r:watkins2008}'],
['注意を切り替える',
 '考えの渦から離れるには、まず「今、同じ考えを回している」と気づくことが出発点になります。そのうえで、注意を別の対象に移します。ただし、人が課題を切り替えるときには、時間のコストや誤りが生じることが知られています。{r:monsell2003} 切り替えは、一瞬で完璧にはできません。うまくいかなくても失敗ではありません。',
 '移す先は、五感（足の裏の感覚、周囲の音）や、短い手作業のように、具体的で感覚に結びつくものが向いています。一時的に離れることと、問題から逃げ続けることは別です。落ち着いてから、必要な課題は具体的に扱います。'],
['三つのステップ',
 '①気づく：「同じ考えを回している」と心の中で言う。②具体化する：「何が起きたか」「次に取れる小さな一歩は何か」を書く。③切り替える：5分間、散歩や手作業など、具体的な対象に注意を向ける。',
 '「なぜ自分はいつもこうなのか」という抽象的な問いは、②で「次に何をするか」という具体的な問いに言い換えます。'],
['注意：専門家に相談する目安',
 '反芻が長く続き、眠れない、食べられない、日常生活に支障が出るといった状態では、自己流の対処だけで抱え込まず、医療機関や専門家に相談してください。この教材は診断や治療の代わりではありません。']],
{type:'flow',items:[['引き金','出来事・気分'],['反芻','同じ考えを回す'],['気づき','ラベリング'],['具体化','次の一歩を書く'],['切り替え','具体的対象へ']],loop:'うまくいかなくても、気づいたこと自体が練習になる',cap:'図1：反芻から離れる流れ（単純化したモデル）'},
['「なぜあんなことを言ったのだろう」と回っているとき、「次に連絡するなら何を伝えるか」を一文だけ書く。','夜に考えが回るとき、起き上がって短いメモを書き、足の裏の感覚に5分間注意を向ける。'],
['夜の考えごとや、失敗の振り返りが長引くときの、具体的な対処ができる。','抽象的な自問を、行動できる問いに言い換える習慣がつく。','つらさが続く場合の、相談の目安が分かる。'],
['反芻は、否定的な内容を繰り返し考え続けること。','反復思考には建設的な面と非建設的な面があり、具体的であるほど有益になりやすいとされる。','切り替えには時間コストがあり、うまくいかなくても失敗ではない。','日常生活に支障が出る場合は、専門家に相談する。'],
[mq('反芻の説明として適切なものはどれか。',['特に否定的な内容を、繰り返し考え続けること','前向きな空想をすること','思考を完全に停止すること','計画を一度で決めること'],0,'同じ否定的な考えの反復を指します。'),
 mq('Watkins（2008）の議論として、本講義で説明されたものはどれか。',['反復思考には建設的なものと非建設的なものがあり、抽象的で「なぜ」に偏る思考は有害になりやすい','考え続けることは常に有益である','考え続けることは常に有害である','反復思考は存在しない'],0,'具体的で行動に結びつく思考のほうが有益になりやすいとされます。'),
 mq('課題の切り替えについて、本講義で説明されたことはどれか。',['切り替えには時間のコストや誤りが生じうる','切り替えにコストは一切ない','切り替えは必ず一瞬で完了する','切り替えはしないほうがよい'],0,'うまく切り替えられなくても、失敗ではありません。'),
 mq('反芻が長く続いて日常生活に支障が出るときの対応として適切なものはどれか。',['医療機関や専門家に相談する','我慢して一人で解決する','睡眠や食事を減らす','記録をやめる'],0,'この教材は診断や治療の代わりではありません。')],
['nolen1991','nolen2008','watkins2008','monsell2003']);

mkL('mental-2-3',
['マインドフルネスの定義の要素を説明できる','認知的脱フュージョンの考え方と、簡単な技法を説明できる','瞑想プログラムの効果についての研究の限界を説明できる'],
'前の講義では、思考を抑え込む方法と、気づいて戻す方法を比べました。この講義では、後者の背景にある二つの考え方、マインドフルネスと認知的脱フュージョンを整理します。どちらも流行語になりやすい分、何が言えて何が言えないのかを、丁寧に見ていきます。',
[['マインドフルネスとは',
 'カバット＝ジンは、マインドフルネスを、意図的に、今この瞬間に、評価的な判断をせずに注意を向けることとして説明しています。{r:kabatzinn2003} 要点は三つです。①意図的であること、②今この瞬間に向けること、③良い・悪いの評価を加えないこと。',
 '「何も考えない状態」ではありません。考えが浮かんでも、それに気づいて、注意を対象に戻す。その繰り返しが実践です。'],
['認知的脱フュージョン',
 'ACT（アクセプタンス＆コミットメント・セラピー）では、思考と自分を同じものとして扱うこと（フュージョン）から、距離をとることを重視します。{r:hayes2006} 簡単な技法には、「私はダメだ」という文を「『私はダメだ』という考えが浮かんでいる」と言い換える方法や、「これは心配の考えだ」と思考に名前をつける方法があります。',
 '目的は、思考を消すことではなく、思考との関係を変えることです。思考を否定するのでも、事実として鵜呑みにするのでもなく、「頭に浮かんだ出来事」として眺めます。'],
['効果についての研究',
 '瞑想プログラムを対象にしたメタ分析では、不安・抑うつ・痛みについて中程度のエビデンスがあると報告された一方、他の多くの指標では根拠が限られるとされました。{r:goyal2014} つまり、効果が報告されている分野はあるが、すべてに効く万能の方法とは言えません。',
 '本教材は、実践を勧めつつ、効果を断定しません。自分の実践を記録して、確かめます。'],
['安全のために',
 '実践中に強い不快感、不安の高まり、現実感の薄れなどが起きたら、中止してください。過去のつらい体験がある場合などは、専門家と相談しながら行うことを勧めます。']],
{type:'table',head:['','マインドフルネス','認知的脱フュージョン'],rows:[['中心となる動作','今この瞬間に、評価せずに注意を向ける','思考を「浮かんだ出来事」として眺める'],['簡単な技法','呼吸への注意、気づいて戻す','「〜という考えが浮かんでいる」と言い換える'],['目的','注意の扱い方を練習する','思考との関係を変える（思考を消さない）'],['注意点','効果は分野により根拠に差がある','思考の無視や否定とは異なる']],cap:'図1：二つの考え方の整理'},

['不安な考えに振り回されそうなとき、距離をとる別の選択肢になる。','「効果が報告されている範囲」と「限られる範囲」を区別して、情報を見られる。','実践を、自分の記録で確かめる姿勢が身につく。'],
['マインドフルネスは、意図的に・今この瞬間に・評価せずに注意を向けること。','脱フュージョンは、思考を消すのではなく、思考との関係を変える考え方。','瞑想の効果は、不安・抑うつ・痛みで中程度の根拠が報告されたが、万能ではない。','不快感が強いときは中止し、必要なら専門家に相談する。'],
[mq('マインドフルネスの定義の要素として、本講義で示されたものはどれか。',['意図的に、今この瞬間に、評価せずに注意を向ける','何も考えない状態を保つ','未来を予測し続ける','感情を完全に消す'],0,'三つの要素で捉えます。'),
 mq('認知的脱フュージョンの例として適切なものはどれか。',['「私はダメだ」を「『私はダメだ』という考えが浮かんでいる」と言い換える','考えが浮かんだら強く打ち消す','考えをすべて事実として受け入れる','感情を無視する'],0,'思考との距離を取る言い換えです。'),
 mq('Goyal ら（2014）のメタ分析の説明として適切なものはどれか。',['不安・抑うつ・痛みについて中程度の根拠が報告された一方、すべてに効く万能の方法とは言えない','すべての指標で大きな効果が確認された','効果はまったく見られなかった','瞑想は医療の代わりになる'],0,'効果の範囲と根拠の強さに注意が必要です。'),
 mq('脱フュージョンの目的として適切なものはどれか。',['思考を消すのではなく、思考との関係を変えること','嫌な思考を完全に停止すること','思考を他人に伝えること','記憶を消すこと'],0,'思考を消すことが目的ではありません。')],
['kabatzinn2003','hayes2006','goyal2014','hayes1999']);

mkL('mental-3-1',
['注意の種類（持続・選択・転換）を説明できる','持続的注意の低下や、不注意による見落としの研究を説明できる','集中力を単一の能力ではなく、複数の側面として捉えられる'],
'「集中力がない」という悩みは、よく聞きます。しかし、集中力とは具体的に何でしょうか。長く続くことなのか、一つに絞ることなのか、切り替えがうまいことなのか。この講義では、注意の種類を分けることで、「集中力」という大きな言葉を、扱いやすい部品に分解します。',
[['注意の種類',
 '注意は、大きく分けて次のように整理できます。持続的注意（長い時間、注意を保つ）、選択的注意（多くの刺激から一つを選ぶ）、転換的注意（注意の向け先を切り替える）。カーネマンは、注意を限られた「努力」の資源として捉えました。{r:kahneman1973}'],
['持続的注意：長く続けるほど落ちる',
 'マックワースは、時計の針の小さな動きを長時間監視させる課題で、時間とともに見落としが増えることを示しました。{r:mackworth1948} 集中が続かないのは、意志が弱いからではなく、持続的注意が長時間で低下しやすい性質があるためだと理解できます。'],
['選択的注意と、見えていないもの',
 'チェリーは、複数の音声の中から一つを選んで聞き取る能力を調べました。{r:cherry1953} 一方、サイモンズとチャブリスの「見えないゴリラ」の実験では、ある課題に注意を向けていた参加者の多くが、画面を横切る予想外のものに気づきませんでした。{r:simons1999} 注意を向けていないものは、目に入っていても気づかないことがある、という教訓です。'],
['没頭（フロー）について',
 'チクセントミハイは、課題の難しさと自分の技能が釣り合うとき、没頭した最適体験が生じやすいと論じました。{r:csik1990} 一般向けの色彩もある理論なので、「条件のひとつの見方」として扱い、自分の記録で確かめます。']],
{type:'table',head:['注意の種類','内容','日常の例'],rows:[['持続的注意','長い時間、注意を保つ','1時間の読書、運転、監視作業'],['選択的注意','多くの刺激から一つを選ぶ','騒がしい場所で相手の声を聞く'],['転換的注意','向け先を切り替える','作業を中断して、また戻る'],['分割的注意','複数に同時に向ける（限界が大きい）','話しながら歩く']],cap:'図1：注意の種類と日常の例'},

['「集中力がない」を、どの種類の問題か分解して考えられる。','長時間作業での集中低下を、性格ではなく性質として理解できる。','「気づかないこと」があるのは普通だと知り、確認の習慣を持てる。'],
['注意は、持続・選択・転換などの種類に分けて考える。','長時間の監視では、時間とともに見落としが増える。','注意を向けていないものには、気づかないことがある。','没頭の条件についての見方は、自分の記録で確かめる。'],

mkL('mental-3-2',
['課題の切り替えやマルチタスクのコストを説明できる','研究結果の限界（相関と因果、追試）を踏まえて情報を読める','自分の作業環境を設計し、効果を測って検証できる'],

[['切り替えコスト',

['マルチタスクの習慣と注意',

['スマートフォンの存在',

['環境を設計し、自分で確かめる',

{type:'table',head:['妨げる要因','設計の例','確かめ方'],rows:[['通知','通知を切る／機内モード','中断回数を記録'],['スマートフォン','別の部屋に置く','集中できた時間を記録'],['机の上','作業に不要な物を片づける','作業開始までの時間を記録'],['作業の切り替え','1回の作業単位を決める','完了までにかかった時間を記録']],cap:'図1：環境設計と検証の例'},
['1週間、スマートフォンを別の部屋に置く日と手元に置く日を交互に設け、25分間の中断回数を記録して比べる。','通知を切った日と切らなかった日で、作業開始までの時間を比べる。'],
['集中できない原因を、環境の面から見直せる。','話題の研究結果に飛びつかず、限界を踏まえて判断できる。','自分に合う環境を、データで選べる。'],
['課題を切り替えると、時間のコストが生じる。','マルチタスクの研究には、相関と因果の区別が必要。','スマートフォンの影響の研究は、追試で結果が一貫しないものがあり、慎重に扱う。','環境設計は、自分の記録で確かめる。'],
[mq('Ophir ら（2009）の研究についての説明として適切なものはどれか。',['相関を見た研究であり、因果関係までは示していない','マルチタスクが注意を悪くすることを証明した','マルチタスクは常に有益だと示した','睡眠の研究である'],0,'因果の向きは、この研究だけでは分かりません。'),
 mq('Ward ら（2017）の結果の扱いとして適切なものはどれか。',['追試で結果が一貫しない報告もあり、慎重に扱う','完全に確立した事実として扱う','研究は存在しない','スマートフォンは無関係と断定する'],0,'効果の大きさや条件はまだ議論されています。'),
 mq('課題の切り替えについて、本講義の説明として適切なものはどれか。',['切り替えには時間のコストが生じる','切り替えはコストなしにできる','マルチタスクは常に効率的','通知は集中に影響しない'],0,'Rubinstein らの実験が示しています。'),
 mq('環境設計に対する本教材の方針として適切なものはどれか。',['妨げる要因を減らし、自分の記録で効果を確かめる','研究の平均値だけを信じる','環境は関係ないと考える','記録はしない'],0,'自分のデータが最も重要です。')],
['rubinstein2001','ophir2009','ward2017','gollwitzer1999']);

mkL('mental-3-3',
['集中を測る指標（時間・中断回数・課題成績・主観評価）を説明できる','訓練の効果についての研究の限界（転移）を説明できる','段階的な集中トレーニングを自分で設計できる'],
'「集中力を鍛える」と言うとき、何がどれだけ向上したら「鍛えた」と言えるのでしょうか。測らなければ、変化は分かりません。この講義では、集中を測る方法と、訓練の効果についての研究の限界を学び、記録を伴うトレーニングを設計します。',
[['集中を測る',
 '日常で使える指標は四つです。①連続して集中できた時間、②中断（気づいて戻した）回数、③課題成績（読めたページ数、正答数など）、④主観的な集中度（0〜10）。客観の指標（①②③）と主観（④）を分けて記録します。',
 '研究では、単純な反応時間を測る課題が、警戒状態の指標として用いられます（精神運動警戒課題）。{r:dinges1985} 日常でこれをそのまま行う必要はありませんが、「同じ条件で繰り返し測る」ことが大切だという点は共通です。'],
['訓練の効果：何が上がったのか',

 'ここから、「訓練した課題が上手くなること」と「集中力全般が上がること」は別だと分かります。本教材の課題でも、「この練習で、この指標がどう変わったか」と、範囲を区切って記録します。'],
['段階的に延ばす',
 '10分→20分→30分と、1日ずつ、または数日ずつ延ばします。途中で無理をせず、中断回数が増えたら前の長さに戻します。実験室の課題（一点集中、音への注意、視覚的注意、10・20・30分実験）で、記録を残してください。'],
['測定の注意',
 '測ること自体が、集中の仕方を変えることがあります。また、日による体調の差も大きいので、1日の結果で判断せず、数日分の傾向を見ます。事前に「何を指標にするか」を決めておくことで、都合のよい数字だけを見てしまうのを防げます。']],
{type:'flow',items:[['測る','時間・回数・主観'],['練習','10→20→30分'],['記録','同じ形式で'],['比較','数日の傾向'],['調整','長さ・方法を見直す']],loop:'指標は事前に決めておく（後から選ばない）',cap:'図1：測定とトレーニングのサイクル'},
['朝の読書を25分、中断回数と読んだページ数を毎日記録し、1週間の平均を比べる。','10分で中断が多い日は、翌日も10分に戻して記録する。'],
['勉強や仕事の集中を、感覚ではなく数字で見られる。','「やった気がする」を避けて、成果を確認できる。','訓練の宣伝文句を、転移の観点から冷静に読める。'],
['集中は、時間・中断回数・課題成績・主観評価で測る。','訓練した課題が上手くなることと、集中力全般が上がることは別。','10→20→30分と段階的に延ばし、無理なら戻す。','指標は事前に決め、数日の傾向で判断する。'],
[mq('Melby-Lervåg と Hulme（2013）のメタ分析で知られる点として適切なものはどれか。',['訓練した課題の成績は上がるが、他の能力への転移は限定的','訓練で知能が大きく上がる','訓練は全く効果がない','訓練は逆効果である'],0,'「訓練した課題」と「全般的な能力」を区別します。'),
 mq('精神運動警戒課題（PVT）の説明として適切なものはどれか。',['単純な反応時間を測る課題で、警戒状態の指標として使われる','記憶力を測る課題','感情を測る質問紙','睡眠の長さを測る装置'],0,'同じ条件で繰り返し測ることが重要です。'),
 mq('集中の測定の記録として適切なものはどれか。',['客観的な指標と主観的な評価を分けて記録する','主観だけで記録する','後から都合のよい指標を選ぶ','記録せず記憶に頼る'],0,'事前に指標を決めておくことが大切です。'),
 mq('集中トレーニングの延ばし方として適切なものはどれか。',['10分→20分→30分と段階的に延ばし、無理なら前の長さに戻す','最初から長時間行う','中断が増えても続ける','毎日違う方法を試して記録しない'],0,'無理をしないことが前提です。')],
['dinges1985','jha2007','melby2013','kahneman1973']);

mkL('mental-4-1',
['感情についての主な理論（ジェームズ、シャクター＝シンガー、構成主義）を説明できる','それらが競合する理論であり、決定版ではないことを理解できる','感情を無理に消さず、認識して扱う姿勢を説明できる'],
'「感情はどこから来るのか」。心臓がどきどきするから不安になるのか、不安だからどきどきするのか。この問いには、複数の理論があり、研究者の間でも議論が続いています。この講義では、主な三つの見方を並べて、感情と身体反応の関係を整理します。',
[['ジェームズの見方：身体反応が先',
 'ウィリアム・ジェームズは、身体の変化の知覚こそが感情である、という説を提示しました。{r:james1884} 「泣くから悲しい」という逆説的な言い方で語られることもあります。感情を、身体の感覚から捉え直す視点です。'],
['シャクター＝シンガーの見方：覚醒と解釈',
 'シャクターとシンガーは、生理的な覚醒と、その状況に対する解釈の組み合わせで、感情が決まると論じました。{r:schachter1962} 同じ動悸でも、状況によって「不安」とも「高揚」とも解釈されうる、という考えです。ただし、この実験は後続の研究で結果が一貫せず、議論が続いています。'],
['構成主義的な見方',
 'バレットは、感情を、脳が身体の感覚と文脈をもとに構成するものとして説明する理論を提唱しています。{r:barrett2017} 感情の「種類」は、あらかじめ決まった箱ではなく、経験や言葉によって形づくられる、という考えです。'],
['どの理論も決定版ではない',
 'これらの理論は、競合しながら並存しており、どれか一つが決定版というわけではありません。本教材では、「出来事→解釈→身体反応→感情の体験→行動」という大まかな流れを手がかりに、身体の感覚と解釈の両方を観察します。感情を消すことを目的とせず、認識して、状況に応じた反応を選べることを目指します。']],
{type:'flow',items:[['出来事','状況'],['解釈','評価・意味づけ'],['身体反応','動悸・緊張'],['感情の体験','名前がつく'],['行動','反応を選ぶ']],loop:'身体反応や行動が、次の解釈に影響する',cap:'図1：感情が生じる流れ（理論により見方が異なる単純化したモデル）'},
['発表前の動悸を、「不安」と呼ぶか、「準備ができている体の反応」と見るかで、感じ方が変わる場合がある。','運動後の動悸と、不安のときの動悸は、感覚が似ていることがある。'],
['緊張したときに、「失敗の予兆」と決めつけず、観察するきっかけになる。','身体の感覚を手がかりに、感情に気づけるようになる。','感情を消そうとせず、選べる反応を考えられる。'],
['感情には、ジェームズ、シャクター＝シンガー、構成主義などの見方がある。','どの理論も決定版ではなく、議論が続いている。','身体の感覚と解釈の両方が、感情の体験に関わると考えられる。','感情は消すのではなく、認識して反応を選ぶ。'],
[mq('ジェームズの説の説明として適切なものはどれか。',['身体の変化の知覚が感情である','感情は身体と無関係である','感情は超自然的に生じる','感情はすべて生まれつき決まっている'],0,'「泣くから悲しい」という言い方で知られます。'),
 mq('Schachter と Singer（1962）の考えとして適切なものはどれか。',['生理的な覚醒と、状況の解釈の組み合わせで感情が決まる','感情は覚醒と無関係','解釈は感情に影響しない','感情は睡眠中にのみ生じる'],0,'後続研究で結果が一貫せず、議論が続いています。'),
 mq('本教材の、感情の理論についての立場として適切なものはどれか。',['競合する理論があり、決定版はないと捉える','ある一つの理論を絶対とする','理論はすべて誤りとする','理論は無視する'],0,'複数の見方を並べて扱います。'),

mkL('mental-4-2',
['ゆっくりした呼吸と漸進的筋弛緩法の考え方を説明できる','無理のない範囲で呼吸法を実践し、前後の変化を記録できる','中止すべき状態と、医師に相談すべき場合を理解する'],

 '練習の例：鼻から4秒かけて吸い、6秒かけて吐く（数え方は目安）。吐く息を少し長くする。無理に深く吸わず、楽な範囲で行います。'],
['漸進的筋弛緩法',

['リラクゼーション反応という考え方',
 'ベンソンは、静かな環境で、同じ語や動作に注意を向けることで生じる、生理的な落ち着きを「リラクゼーション反応」と呼びました。{r:benson1975} 一般向けの書籍であり、個々の主張は研究で確かめられている範囲を区別して読みます。'],
['安全のために',
 '息を止めたり、速く深い呼吸を続けたりしないでください。めまい、しびれ、胸の苦しさなどがあれば、ただちに中止して通常の呼吸に戻します。呼吸器や循環器に持病がある場合、パニックの症状がある場合は、実践の前に医師に相談してください。']],
{type:'table',head:['方法','やること','記録する指標'],rows:[['ゆっくりした呼吸','吸う4秒・吐く6秒（目安）を数分','前後の緊張度（0〜10）、実施時間'],['漸進的筋弛緩法','部位ごとに5秒緊張→緩める','前後の緊張度、緩んだ部位の感覚'],['数を数える呼吸','呼吸を数えて雑念に気づく','数え間違えた回数']],cap:'図1：リラクゼーションの方法と記録'},

['ゆっくりした呼吸は、生理・心理指標と関連すると報告されている。','漸進的筋弛緩法は、緊張と弛緩を意識的に切り替える練習。','息を止めたり、過呼吸にならないよう、無理をしない。','めまいなどがあれば中止し、持病があれば医師に相談する。'],

mkL('mental-4-3',
['感情調整の方略（状況選択・注意・再評価・抑制）の違いを説明できる','認知的再評価の手順を実践できる','「ポジティブに考える」と再評価の違いを説明できる'],

[['感情調整のプロセスモデル',

['再評価の手順',

['感情との距離をとる',

{type:'table',head:['記録項目','内容','例'],rows:[['状況','事実だけ','会議で意見が通らなかった'],['最初の解釈','浮かんだ考え','自分は無能だと思われた'],['感情（強さ）','名前と0〜10','恥ずかしさ 7'],['別の解釈','根拠のある見方','提案の時期が合わなかっただけかもしれない'],['再評価後の感情','0〜10','恥ずかしさ 4']],cap:'図1：認知的再評価の記録フォーマット'},

mkL('mental-4-4',
['ストレスを「出来事と評価・対処の相互作用」として説明できる','問題焦点型と情動焦点型の対処の違いを説明できる','睡眠と感情調整の関連を、限界を踏まえて説明できる','睡眠や気分が長く乱れる場合の相談の目安を理解する'],

['相談の目安',

{type:'flow',items:[['出来事','要求・負荷'],['評価','脅威か／対処できるか'],['対処','問題焦点・情動焦点'],['結果','心身の状態'],['睡眠','回復の土台']],loop:'結果と睡眠の状態が、次の評価に影響する',cap:'図1：ストレスの評価と対処（単純化したモデル）'},

mkL('mental-5-1',
['瞑想を「注意を焦点化する型」と「観察する型」に整理して説明できる','東洋・西洋の瞑想思想の流れを、断定を避けて概観できる','瞑想に伴う有害事象の研究を踏まえ、安全に実践できる'],

[['歴史の概観',

['技法の整理：集中と観察',

 '対処の基本は、無理をしないことです。実践中に強い不快感が起きたら、目を開けて周囲を見る、座るのをやめるなどして中止し、続く場合は専門家に相談してください。']],

mkL('mental-5-2',

[['自己暗示の歴史',

 '臨床・研究では、催眠が痛みの軽減に有効な場合があることが、メタ分析で報告されています。{r:montgomery2000} ただし、暗示への反応しやすさには個人差が大きく、すべての人に同じように効くわけではありません。'],
['誇張された説明について',

['自己催眠・アファメーションの限界',

 '本教材では、自己暗示を「効く／効かない」と断定せず、自分の記録で確かめる対象として扱います。つらくなる場合は、やめてかまいません。']],

mkL('mental-5-3',
['プラセボ効果とノセボ効果を、定義とともに説明できる','「プラセボは常に強力」という主張の根拠が限られることを説明できる','期待と暗示の作用を、自己実験に活かす際の注意を述べられる'],
'薬ではない偽薬で、症状が楽になることがある。逆に、「副作用があるかもしれない」と思うだけで、不調を感じることがある。プラセボ効果とノセボ効果は、期待と暗示が心身に与える影響を示す、興味深い現象です。同時に、誤解の多い分野でもあります。',
[['プラセボ効果',
 'ビーチャーは1955年の論文で、プラセボの効果を強調しました。{r:beecher1955} しかしその後、方法論上の批判があり、結果の解釈は見直されています。無治療の群と比較した系統的レビューでは、プラセボの効果は、主に痛みや吐き気など患者の主観的な評価で見られやすい一方、客観的な指標では明確でない場合が多いと報告されています。{r:hrobj2010} 「プラセボは強力な万能の力」という説明は、この点で誇張です。'],
['偽薬と明かして行うプラセボ',
 'カプチャックらは、偽薬であることを伝えたうえで投与しても、症状が改善したと報告しました。{r:kaptchuk2010} ただし、小規模な研究であり、追試が必要とされています。この結果も、断定せずに受け止めます。'],
['ノセボ効果',
 'ノセボ効果は、否定的な期待によって、症状が悪化したり、副作用が現れたりする現象です。{r:colloca2011} 医療の現場では、説明の仕方が期待に影響することが指摘されています。期待は、注意の向け方を変え、身体の感覚の解釈に影響すると考えられます。'],
['自己実験での注意',
 '自己暗示や儀式の効果を調べるとき、期待そのものが結果に影響します。だからこそ、主観の評価だけでなく、客観的な指標（実行できた日数、課題成績など）も記録し、可能なら比較条件を設けます。「効いた気がする」ことと、「実際に変化した」ことは、区別して記録します。']],
{type:'table',head:['','プラセボ効果','ノセボ効果'],rows:[['期待の向き','肯定的な期待','否定的な期待'],['現れ方','主観的な症状の改善が中心','症状の悪化・副作用の出現'],['研究上の注意','客観指標では明確でないことが多い','説明の仕方が影響しうる'],['自己実験への示唆','主観と客観を分けて記録する','否定的な暗示を避ける言い方にする']],cap:'図1：プラセボ効果とノセボ効果'},
['集中の自己実験で、「この音楽で集中できる」と信じて聞いた日と、何も言わずに聞いた日を比べる。','薬の説明書の副作用を読んだ後に、その症状が気になった経験を、ノセボ効果の観点で振り返る（体調の不安は専門家に相談）。'],
['健康情報の「万能」な主張を、冷静に評価できる。','期待が体験に影響することを前提に、実験を設計できる。','主観と客観を分ける習慣がつく。'],
['プラセボ効果は、主に主観的な評価で見られやすい。','ノセボ効果は、否定的な期待による悪化の現象。','偽薬と明かした投与の研究は、小規模で追試が必要。','自己実験では、主観と客観の指標を分けて記録する。'],
[mq('プラセボ効果についての本講義の説明として適切なものはどれか。',['主に痛みなど主観的な評価で見られやすく、客観指標では明確でないことが多い','常に強力で万能','存在しない','超自然的な力である'],0,'「万能」という説明は誇張です。'),
 mq('ノセボ効果の説明として適切なものはどれか。',['否定的な期待によって、症状が悪化したり副作用が現れたりする現象','肯定的な期待で改善する現象','薬の本来の効果','睡眠の効果'],0,'説明の仕方が期待に影響します。'),
 mq('Kaptchuk ら（2010）の研究の扱い方として適切なものはどれか。',['小規模な研究であり、追試が必要として受け止める','確立した事実として扱う','偽薬は必ず効くと結論する','研究は存在しないとする'],0,'断定を避けます。'),
 mq('自己実験の設計として適切なものはどれか。',['主観の評価と客観の指標を分けて記録する','主観だけで判断する','結果の良い日だけを記録する','期待は影響しないと考える'],0,'期待が結果に影響します。')],
['beecher1955','hrobj2010','kaptchuk2010','colloca2011']);

mkL('mental-6-1',
['文脈の手がかりと習慣の関係を説明できる','学習・作業・休息モードへの切り替えを、手がかりで設計できる','習慣形成の日数には個人差が大きいことを説明できる'],
'「机に向かうと勉強モードになる」「ベッドに入ると眠くなる」。場所や動作が、状態の切り替えのきっかけになることは、日常でよく経験します。この講義では、その仕組みを、習慣と文脈の研究から整理し、自分で意図的に切り替えを設計する方法を学びます。',
[['文脈の手がかり',
 'ウッドとニールは、習慣は、繰り返された行動と、それを行った文脈（場所、時刻、直前の行動など）が結びつくことで、文脈の手がかりによって引き起こされやすくなる、と論じました。{r:wood2007} 同じ場所で同じ作業を繰り返すと、その場所が作業への入りやすさのきっかけになる、という見方です。',
 '環境と想起の関係を示す古典的研究として、学習した環境と同じ環境で想起すると、成績が良かったという報告もあります。{r:godden1975} 場所の影響は、注意や記憶にも及びえます。'],
['モードの切り替えを設計する',
 '三つのモードを、それぞれ別の手がかりで切り替えます。例：学習モード（机に座る→タイマーを置く→最初の課題を声に出す）、作業モード（PCを開く→通知を切る→優先作業を一つ決める）、休息モード（立ち上がる→窓の外を見る→呼吸を数回）。{r:gollwitzer1999} のように、「もしAなら、Bをする」と決めておくと、開始しやすくなります。'],
['習慣になるまでの日数',
 'ラリーらは、日常の行動が習慣になるまでの日数を調べ、個人や行動によって大きく異なると報告しました。{r:lally2010} 「21日で習慣になる」といった決まった数字は、一般化できません。続かなくても、意志の弱さではなく、設計の見直しの材料として扱います。'],
['記録して比較する',
 '手がかりを設けた日と設けなかった日で、作業への入りやすさ（0〜10）、開始までの時間を記録し、比べます。実験室の課題（作業開始前ルーティンの記録）と連動しています。']],
{type:'flow',items:[['手がかり','場所・動作・時刻'],['ルーティン','短い手順'],['状態の切り替え','注意が向く'],['作業開始','最初の一歩'],['記録','入りやすさ（0〜10）']],loop:'記録を見て、手がかりと手順を調整する',cap:'図1：切り替えの設計と検証'},
['勉強専用の机を決め、座ったら必ず「今日の最初の課題」を声に出す。','休憩のたびに立ち上がって窓の外を見て、数回呼吸する。'],
['作業に入るまでの「重さ」を、手がかりで軽くできる。','モードを分けることで、切り替えの疲れを減らせる。','習慣の日数を、他人と比べず、自分のペースで見られる。'],
['習慣は、文脈の手がかりによって引き起こされやすくなる。','モードの切り替えは、手がかりと短い手順で設計できる。','習慣形成に要する日数は個人差が大きい。','記録して比較し、手順を調整する。'],
[mq('Wood と Neal（2007）の考え方として適切なものはどれか。',['習慣は文脈の手がかりによって引き起こされやすくなる','習慣は意志だけで決まる','文脈は習慣と無関係','習慣は21日で必ず形成される'],0,'場所・時刻・直前の行動が手がかりになります。'),
 mq('Lally ら（2010）の報告として適切なものはどれか。',['習慣になるまでの日数は、個人や行動により大きく異なる','21日で必ず習慣になる','習慣は形成されない','日数は全員同じ'],0,'決まった日数への一般化はできません。'),
 mq('切り替えの設計として適切なものはどれか。',['手がかりと短い手順をモードごとに決め、効果を記録する','毎日気分で決める','記録せず感覚で判断する','手がかりを避ける'],0,'実行意図の形（もしAならB）も有効です。'),
 mq('習慣が続かなかったときの捉え方として適切なものはどれか。',['設計を見直す材料として扱う','意志が弱いと責める','記録をやめる','習慣は不可能と結論する'],0,'責めるのではなく、設計の問題として見直します。')],
['wood2007','godden1975','lally2010','gollwitzer1999']);

mkL('mental-6-2',
['儀式の心理学研究の内容と限界を説明できる','「儀式が効く」という主張に潜むバイアスを説明できる','安全で、再現可能な小さな儀式を設計できる'],
'儀式は、宗教、スポーツ、学校、職場など、あらゆる場所にあります。魔術の世界でも、儀式は中心的な要素でした。この講義では、儀式が心理に与える影響を、研究に基づいて検討します。魔術的な説明と、心理学的な説明を、ここでも区別します。',
[['儀式の心理学',
 'ホブソンらは、儀式に関する心理学研究を整理し、儀式が感情の調整、パフォーマンス、集団の結びつきなどに関わるとする枠組みを提案しました。{r:hobson2018} 儀式は、決まった、象徴的な動作の連なりとして、注意を整える働きをもつ可能性があります。'],
['不安とパフォーマンス',
 'ブルックスらは、儀式を行った参加者が、不安が低く、課題の成績が高かったと報告しました。{r:brooks2016} また、縁起を担ぐと課題成績が上がったと報告した研究もありますが、{r:damisch2010} 追試の結果は一貫しません。「儀式をすれば必ず成績が上がる」とは言えません。'],
['儀式の効果を考えるときのバイアス',
 '儀式を行った日の良い結果だけが記憶に残る（確証バイアス）、期待そのものが成績や感じ方を変える（期待効果）、といった影響が入り込みます。{r:colloca2011} 儀式の効果を調べるには、行わなかった日と比べる必要があります。'],
['魔術的な説明と心理学的な説明',
 '魔術の伝統では、儀式は超自然的な力に働きかける行為として説明されることがあります。本教材は、その主張を歴史的・思想的な主張として紹介しますが、事実としては扱いません。一方、心理学的な説明（注意の方向づけ、期待、不安の軽減、習慣の手がかり）は、検証できる形で扱います。'],
['小さな儀式の設計の原則',
 '①短い（1〜3分）、②毎回同じ手順、③象徴や動作に自分なりの意味を与える、④安全で、他人に迷惑をかけない、⑤効果を記録で確かめる、⑥合わなければやめる。']],
{type:'table',head:['観点','魔術的な説明','心理学的な説明'],rows:[['儀式の働き','超自然的な力への働きかけ（歴史的主張）','注意の方向づけ、期待、不安の軽減、習慣の手がかり'],['検証','本教材では事実として扱わない','記録・比較で検証できる'],['扱い方','歴史・思想として紹介','自己実験の対象にする']],cap:'図1：儀式の二つの説明の区別'},
['試験の前に、同じ3つの動作（深呼吸、筆記具を並べる、目標を1文で唱える）を行う日と、行わない日の緊張度を比較する。','作業開始前の儀式を1週間続け、入りやすさ（0〜10）を記録する。'],
['緊張する場面の前の、自分の準備の手順を持てる。','「儀式が効いた」という話を、バイアスを踏まえて受け止められる。','魔術の儀式と心理学を、混同せずに学べる。'],
['儀式は、不安の軽減や注意の方向づけに関わる可能性が研究されている。','効果の研究には、追試で結果が一貫しないものがあり、断定できない。','確証バイアスや期待効果が入り込むため、比較して調べる。','魔術的な説明は歴史的主張、心理学的な説明は検証対象として区別する。'],
[mq('Brooks ら（2016）の報告として適切なものはどれか。',['儀式を行った参加者で、不安が低く成績が高かった','儀式は効果がまったくなかった','儀式は成績を必ず下げた','儀式は魔術的な力を証明した'],0,'効果の一般化は慎重に行います。'),
 mq('儀式の効果を調べるときに、必要なことはどれか。',['行わなかった日と比べる','良かった日だけを記録する','期待を最大にする','記録しない'],0,'確証バイアスを避けます。'),
 mq('魔術的な説明の、本教材での扱いとして適切なものはどれか。',['歴史的・思想的な主張として紹介し、事実としては扱わない','事実として扱う','完全に無視する','絶対に正しいとする'],0,'魔術的な説明と心理学的な説明を区別します。'),
 mq('小さな儀式の設計の原則として適切なものはどれか。',['短く、毎回同じ手順で、安全で、記録で確かめる','長くて複雑','毎回違う手順','記録せずに続ける'],0,'合わなければやめてよいものとします。')],
['hobson2018','brooks2016','damisch2010','colloca2011']);

mkL('mental-6-3',
['単一事例の実験デザイン（ABAなど）の考え方を説明できる','自分用の調整プログラムを、仮説・指標・比較条件つきで設計できる','結果の読み方の落とし穴を説明できる'],
'ここまでで、注意、感情、瞑想、儀式、習慣と、多くの道具を見てきました。最後のまとめとして、「自分に合った調整方法」を、根拠をもって選び、体系化する方法を学びます。鍵は、他人の平均ではなく、自分一人を対象にした小さな実験です。',
[['一人で行う実験：単一事例デザイン',
 'カズディンの解説書にあるように、一人の対象について、介入がない期間（A）と、ある期間（B）を繰り返し、変化を比べる実験の型があります。{r:kazdin2011} 例えば、A（なし）→B（呼吸法）→A（なし）→B（呼吸法）と繰り返し、Bのときに指標が一貫して良ければ、介入の影響がある可能性が高まります。'],
['プログラムの設計',
 '①目的を一つに絞る（例：作業開始の入りやすさ）。②指標を決める（時間、回数、主観0〜10）。③比較条件を決める（A期とB期）。④期間を決める（各期間は数日〜1週間）。⑤安全の基準と中止条件を決める。⑥記録の形式を決める。'],
['結果の読み方',
 '日による変動、季節、体調、睡眠、課題の難易度が、結果に影響します。一度の差で結論を出さず、繰り返しで確かめます。また、主観の指標は期待に影響されやすいので、可能なら客観の指標も組み合わせます。{r:cohen1983}{r:brown2003} のような質問紙は、利用条件を原典で確認したうえで、参考にできます（必須ではありません）。'],
['体系化',
 '効果がありそうだった方法を、「状況→方法→手順→注意点」の一覧にまとめます。例：「集中が切れたとき→呼吸を10回数える→…」「緊張が高いとき→吐く息を長くする→…」。これが、自分用の「技法集」になります。']],
{type:'flow',items:[['A期','介入なし'],['B期','介入あり'],['A期','介入なし'],['B期','介入あり'],['比較','指標の変化']],loop:'結果が一貫していれば、影響の可能性が高まる（確定ではない）',cap:'図1：ABAB型の単一事例デザイン'},
['A期3日（何もしない）、B期3日（作業前に呼吸法）、再びA期、B期と繰り返し、作業の入りやすさ（0〜10）を比べる。','結果をまとめて、「状況→方法→手順→注意点」の一覧に追記する。'],
['自分に合う方法を、他人の平均ではなく自分のデータで選べる。','結果を冷静に読み、早まった結論を避けられる。','自分用の技法集を、長期的に更新できる。'],
['単一事例デザインは、A期とB期を繰り返して介入の影響を調べる型。','目的・指標・比較条件・期間・安全基準を事前に決める。','一度の差で結論を出さず、繰り返しで確かめる。','結果を、状況→方法→手順→注意点の一覧に体系化する。'],

mkL('mental-7-1',
['長期実験の設計（期間、指標、比較、記録）を説明できる','注意の持続時間の変化を測定する計画を立てられる','途中での中止・見直しの基準を設定できる'],

[['問いを立てる',
 '良い問いは、検証可能で、範囲が絞られています。悪い例：「集中力は上がるか」。良い例：「毎朝10分の呼吸瞑想を2週間続けると、読書の連続集中時間（中断が3回以内で続く時間）は、開始前の1週間と比べて長くなるか」。'],
['設計の要素',
 '①期間：ベースライン（何もしない）1週間、介入2〜4週間。②指標：連続集中時間、中断回数、主観の集中度（0〜10）。③条件の統一：時間帯、場所、課題の種類をできるだけそろえる。④記録：毎日、同じ形式で。⑤中止基準：不快感・体調不良、強い負担。'],
['測定の落とし穴',
 '課題の難易度が日によって違うと、集中の指標が変わります。曜日や睡眠の影響もあります。日誌に、睡眠時間・体調・その日の課題を併記しておくと、後で解釈しやすくなります。{r:jha2007} のような研究でも、対象や方法の違いにより、結果の一般化には限界があります。自分の結果も、「自分の場合の傾向」として扱います。'],
['見直しと中止',
 '期間の途中でも、不快感や負担が大きければ、ただちに中止します。また、ベースラインで想定外の変動があった場合は、期間を延ばします。実験は、完遂そのものが目的ではありません。']],
{type:'table',head:['項目','決めること','例'],rows:[['問い','検証可能で範囲が狭い','呼吸瞑想10分で連続集中時間は延びるか'],['期間','ベースライン＋介入','1週間＋2週間'],['指標','客観＋主観','連続集中時間、中断回数、主観0〜10'],['統一する条件','時間帯・場所・課題','朝、同じ机、同じ種類の読書'],['中止基準','不快・負担','不調が出たら中止']],cap:'図1：長期実験の設計項目'},
['朝の読書で、ベースライン1週間→瞑想2週間の、連続集中時間を毎日記録する。','睡眠時間と体調も併記し、変動の原因を後で探る。'],
['自分の問いを、検証できる形に整えられる。','途中で負担が大きければ中止してよい、という安全な進め方ができる。','結果を、自分の場合の傾向として扱える。'],
['良い問いは検証可能で、範囲が絞られている。','ベースラインと介入の期間、指標、統一する条件を決める。','日による変動を考え、睡眠・体調・課題を併記する。','不快や負担があれば、ただちに中止する。'],
[mq('検証可能な問いの例として適切なものはどれか。',['2週間の呼吸瞑想で、読書の連続集中時間が延びるか','集中力は上がるか','人生は良くなるか','運命は変わるか'],0,'範囲を絞り、測定可能にします。'),
 mq('実験で統一すべき条件として適切なものはどれか。',['時間帯・場所・課題の種類','気分','天気予報の結果','他人の意見'],0,'条件をそろえて比較します。'),
 mq('実験中に不快感が強く出たときの対応として適切なものはどれか。',['ただちに中止する','我慢して続ける','期間を延ばす','記録をやめて続ける'],0,'完遂が目的ではありません。'),

['jha2007','kazdin2011','gollwitzer1999']);

mkL('mental-7-2',
['自己暗示・瞑想の効果検証の計画を立てられる','期待効果を考慮した検証デザインを説明できる','結果を、効果の有無ではなく「可能性」として報告できる'],
'自己暗示や瞑想の効果を、自分自身で検証する。この講義では、期待効果という最大の落とし穴を見据えながら、できるだけ誠実に検証する方法を考えます。完璧な検証は一人ではできませんが、できる範囲で工夫することはできます。',
[['期待効果を意識する',
 '自分が自分の実験の被験者であり、結果を判断する人でもあるため、期待が結果に影響しやすくなります。{r:hrobj2010} 対策として、①主観だけでなく客観の指標を組み合わせる、②介入のない期間（A期）と比べる、③指標を事前に決める、④記録を、後から見直さずにその日のうちに書く、があります。'],
['比較のデザイン案',

['指標の選び方',

['報告の仕方',
 '「効果があった」と断定するのではなく、「この期間・この条件で、この指標に、この変化が見られた。期待効果や偶然の変動を排除できていない」と報告します。結果が「効果なし」でも、立派な成果です。何が効かなかったかも、重要な知識です。']],
{type:'table',head:['対策','内容','限界'],rows:[['客観の指標','実行日数・回数・成績','指標の選び方に偏りが出る'],['介入なしの期間','A期と比較','日による変動が混ざる'],['事前の計画','指標・期間を先に決める','後から変えたくなる誘惑'],['ランダム化','順序をコインで決める','一人では盲検化できない']],cap:'図1：期待効果への対策と限界'},
['コイン投げで、「自己暗示あり」の日と「なし」の日を決め、各7日間、作業の入りやすさ（0〜10）と実行できた作業数を記録する。','結果を、「期待効果を排除できていない」と明記して、研究ノートにまとめる。'],
['自分で試した方法を、誠実に評価できる。','「効かない」という結果も、価値ある結果として受け止められる。','他人の「効果があった」という体験談を、冷静に読める。'],
['自分が被験者かつ判断者であるため、期待効果が入りやすい。','客観の指標、介入なしの期間、事前の計画、ランダム化で、影響を減らす。','一人では盲検化できず、期待効果は完全には排除できない。','報告は、「可能性」として、限界とともに書く。'],
[mq('自己実験で期待効果を減らす工夫として適切なものはどれか。',['客観の指標を組み合わせ、介入なしの期間と比べる','主観だけで判断する','結果の良い日だけを記録する','期待を最大にする'],0,'完全には排除できない点も明記します。'),
 mq('結果の報告として適切なものはどれか。',['「この条件でこの変化が見られた。期待効果を排除できていない」と書く','「効果は証明された」と書く','結果が悪ければ報告しない','他人にも効くと断定する'],0,'限界とともに報告します。'),
 mq('「効果なし」という結果の位置づけとして適切なものはどれか。',['何が効かなかったかを知る、立派な成果','失敗なので隠す','再度、良い結果が出るまで繰り返す','無意味'],0,'誠実な検証の成果です。'),

mkL('mental-7-3',
['これまでの記録を統合して、自分用の精神調整プログラムを構築できる','睡眠や生活習慣との関係を、記録から読み取れる','プログラムを定期的に見直す仕組みを作れる','この領域全体の方針（万能視しない、安全第一）を再確認できる'],
'いよいよ、この領域の総まとめです。これまで試した方法、記録した数字、立てた仮説を統合して、「自分のための精神調整プログラム」を構築します。完成形ではなく、更新していく設計図を作ることが、ゴールです。',
[['記録を棚卸しする',

var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtDur(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return pad(h)+':'+pad(m)+':'+pad(s)}
function fmtHM(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h>0?h+'時間'+m+'分':m+'分'+(sec%60)+'秒'}
function fmtDT(t){var d=new Date(t);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}

function defaultState(){return {schemaVersion:SCHEMA,createdAt:Date.now(),awards:{},completed:{},quiz:{},tasks:{},notes:[],timeLog:[],timer:null,readings:{},activity:[],settings:{auto:true,idleMinutes:5,autoPauseHidden:true,lastExport:0},lastLecture:null}}

function num(v,d,min,max){v=Number(v);if(!isFinite(v))return d;if(min!=null&&v<min)return min;if(max!=null&&v>max)return max;return v}
function str(v,max){return typeof v==='string'?v.slice(0,max||20000):''}
function isObj(o){return o&&typeof o==='object'&&!Array.isArray(o)}

/* 検証・正規化（localStorage読込とインポートで共用）。warnings を返す */
function sanitizeState(raw,warnings){
  var s=defaultState(),w=warnings||[];
  if(!isObj(raw))return s;
  s.createdAt=num(raw.createdAt,Date.now(),0);
  if(isObj(raw.awards))Object.keys(raw.awards).slice(0,5000).forEach(function(k){var a=raw.awards[k];if(isObj(a)&&isFinite(Number(a.xp)))s.awards[str(k,120)]={xp:num(a.xp,0,0,10000),domain:str(a.domain,40),ts:num(a.ts,0,0)}});
  if(isObj(raw.completed))Object.keys(raw.completed).forEach(function(k){s.completed[str(k,80)]=num(raw.completed[k],0,0)});
  if(isObj(raw.quiz))Object.keys(raw.quiz).forEach(function(k){var q=raw.quiz[k];if(isObj(q)){var tot=num(q.total,0,0,1000);s.quiz[str(k,80)]={best:num(q.best,0,0,tot),total:tot,last:num(q.last,0,0,tot),ts:num(q.ts,0,0),attempts:num(q.attempts,1,0,100000)}}});
  if(isObj(raw.tasks))Object.keys(raw.tasks).forEach(function(k){var t=raw.tasks[k];if(!isObj(t))return;var m={};if(isObj(t.metrics))Object.keys(t.metrics).forEach(function(mk){m[str(mk,40)]=str(String(t.metrics[mk]),2000)});s.tasks[str(k,80)]={status:['todo','doing','done'].indexOf(t.status)>=0?t.status:'todo',metrics:m,result:str(t.result),reflection:str(t.reflection),date:str(t.date,20),ts:num(t.ts,0,0)}});
  if(Array.isArray(raw.notes))raw.notes.slice(0,5000).forEach(function(n){if(isObj(n)&&n.id)s.notes.push({id:str(n.id,60),date:str(n.date,20),domain:str(n.domain,40),title:str(n.title,200),hypothesis:str(n.hypothesis),done:str(n.done),result:str(n.result),consider:str(n.consider),refs:str(n.refs,2000),updated:num(n.updated,0,0)})});
  if(Array.isArray(raw.timeLog))raw.timeLog.slice(0,20000).forEach(function(l){if(!isObj(l)||!l.id)return;var bd={},tot=0;if(isObj(l.byDate))Object.keys(l.byDate).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){var v=Math.round(num(l.byDate[k],0,0,86400));bd[k]=v;tot+=v}});
    var sec=Math.round(num(l.sec,tot,0,10000000));if(sec!==tot){w.push('学習履歴 '+str(l.id,20)+' の合計秒数が日別内訳と一致しなかったため、内訳の合計に補正しました。');sec=tot}
    s.timeLog.push({id:str(l.id,60),start:num(l.start,0,0),end:num(l.end,0,0),sec:sec,domainId:str(l.domainId,40),lectureId:str(l.lectureId,80),byDate:bd})});
  if(isObj(raw.readings))Object.keys(raw.readings).forEach(function(k){var r=raw.readings[k];if(isObj(r))s.readings[str(k,80)]={status:['none','reading','finished'].indexOf(r.status)>=0?r.status:'none',memo:str(r.memo),updated:num(r.updated,0,0)}});
  if(Array.isArray(raw.activity))raw.activity.slice(-300).forEach(function(a){if(isObj(a))s.activity.push({ts:num(a.ts,0,0),type:str(a.type,30),text:str(a.text,300)})});
  if(isObj(raw.settings)){s.settings.idleMinutes=num(raw.settings.idleMinutes,5,1,120);s.settings.autoPauseHidden=raw.settings.autoPauseHidden!==false;s.settings.auto=raw.settings.auto!==false;s.settings.lastExport=num(raw.settings.lastExport,0,0)}
  s.lastLecture=raw.lastLecture?str(raw.lastLecture,80):null;
  /* 未知のID（現カリキュラムにない）の警告 */
  Object.keys(s.completed).forEach(function(k){if(!IDX[k])w.push('完了済み講義 "'+k+'" は現在のカリキュラムにありません（データは保持されます）。')});
  Object.keys(s.tasks).forEach(function(k){if(!TASKS.some(function(t){return t.id===k}))w.push('課題 "'+k+'" は現在のカリキュラムにありません（データは保持されます）。')});
  /* 進行中タイマー（読込時のみ） */
  if(raw.timer&&isObj(raw.timer)&&Array.isArray(raw.timer.segments)&&warnings===undefined){
    var t=raw.timer,segs=[];t.segments.forEach(function(g){if(isObj(g)&&isFinite(g.s)&&isFinite(g.e)&&g.e>=g.s)segs.push({s:+g.s,e:+g.e})});
    if(t.runningSince&&isFinite(t.runningSince)){var e=Math.max(+t.runningSince,num(t.lastBeat,+t.runningSince));segs.push({s:+t.runningSince,e:e});s._recovered=true}
    s.timer={id:str(t.id,60)||uid(),domainId:str(t.domainId,40),lectureId:str(t.lectureId,80),startedAt:num(t.startedAt,Date.now(),0),segments:segs,runningSince:null,lastBeat:Date.now(),pausedAt:segs.length?segs[segs.length-1].e:Date.now(),manualHold:!!t.manualHold};
  }
  return s;
}

var state;
function loadState(){try{var raw=localStorage.getItem(LS_KEY);if(!raw)return defaultState();return sanitizeState(JSON.parse(raw))}catch(e){return defaultState()}}
var saveFailed=false;
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));saveFailed=false}catch(e){if(!saveFailed){toast('ブラウザへの自動保存に失敗しました。「データ」画面からJSONバックアップを書き出してください。');}saveFailed=true}}

/* ---------- 経験値・レベル・称号 ---------- */
function xpTotal(s){s=s||state;var t=0;Object.keys(s.awards).forEach(function(k){t+=s.awards[k].xp});return t}
function domainXp(did,s){s=s||state;var t=0;Object.keys(s.awards).forEach(function(k){if(s.awards[k].domain===did)t+=s.awards[k].xp});return t}
function levelOf(xp){return Math.floor(Math.sqrt(xp/60))+1}
function levelFloor(l){return 60*(l-1)*(l-1)}
function award(key,xp,domain,text){if(state.awards[key]&&state.awards[key].xp>=xp)return 0;var prev=state.awards[key]?state.awards[key].xp:0;state.awards[key]={xp:xp,domain:domain||'',ts:Date.now()};if(text)logAct('xp',text+'（+'+(xp-prev)+' XP）');return xp-prev}
function logAct(type,text){state.activity.push({ts:Date.now(),type:type,text:text});if(state.activity.length>300)state.activity=state.activity.slice(-300)}
function tasksDone(did){return TASKS.filter(function(t){return(!did||t.domain===did)&&state.tasks[t.id]&&state.tasks[t.id].status==='done'}).length}
function readingsFinished(){return Object.keys(state.readings).filter(function(k){return state.readings[k].status==='finished'}).length}
function titleOf(s){
  s=s||state;var xp=xpTotal(s),lv=levelOf(xp),t=[['見習い研究者',true]];
  t.push(['象徴の探究者',domainXp('chaos',s)+domainXp('kabbalah',s)>=100]);
  t.push(['記憶の修練者',domainXp('memory',s)>=100]);
  t.push(['精神統御の探究者',domainXp('mental',s)>=100]);
  t.push(['集中の修練者',TASKS.filter(function(k){return k.domain==='mental'&&s.tasks[k.id]&&s.tasks[k.id].status==='done'}).length>=3]);
  t.push(['古文書研究者',Object.keys(s.readings).filter(function(k){return s.readings[k].status==='finished'}).length>=3]);
  t.push(['魔術研究者',lv>=5]);t.push(['上級研究者',lv>=8]);
  var earned=t.filter(function(x){return x[1]}).map(function(x){return x[0]});
  return {current:earned[earned.length-1],earned:earned,all:t.map(function(x){return x[0]})};
}

/* =====================================================================
   [3] 学習時間計測
   ===================================================================== */
var lastActivity=Date.now();
function splitByDay(segs,openStart,now){
  var all=segs.slice();if(openStart)all.push({s:openStart,e:now});
  var by={};all.forEach(function(g){var c=g.s;while(c<g.e){var m=new Date(c);m.setHours(24,0,0,0);var end=Math.min(g.e,m.getTime());var k=dkey(c);by[k]=(by[k]||0)+(end-c)/1000;c=end}});
  return by;
}
function timerMs(t,now){t=t||state.timer;if(!t)return 0;now=now||Date.now();var ms=0;t.segments.forEach(function(g){ms+=g.e-g.s});if(t.runningSince)ms+=now-t.runningSince;return ms}
function activeByDate(){return state.timer?splitByDay(state.timer.segments,state.timer.runningSince,Date.now()):{}}
function totalSec(filter){var t=0;state.timeLog.forEach(function(l){if(!filter||filter(l))t+=l.sec});if(state.timer&&(!filter||filter({domainId:state.timer.domainId,lectureId:state.timer.lectureId}))){Object.keys(activeByDate()).forEach(function(k){t+=activeByDate()[k]})}return t}
function todaySec(){var k=dkey(Date.now()),t=0;state.timeLog.forEach(function(l){t+=l.byDate[k]||0});t+=activeByDate()[k]||0;return t}
function studyDays(){var s={};state.timeLog.forEach(function(l){Object.keys(l.byDate).forEach(function(k){if(l.byDate[k]>0)s[k]=1})});Object.keys(activeByDate()).forEach(function(k){s[k]=1});Object.keys(state.completed).forEach(function(k){s[dkey(state.completed[k])]=1});return Object.keys(s).length}

var autoHold=false,lastIdleToast=0,lastSync=0;
function startTimer(domainId,lectureId,auto){
  if(state.timer){if(!auto)toast('すでに学習時間を計測中です。');return}
  var n=Date.now();state.timer={id:uid(),domainId:domainId||'',lectureId:lectureId||'',startedAt:n,segments:[],runningSince:n,lastBeat:n,pausedAt:null,manualHold:false};
  if(!auto){lastActivity=n;toast('学習を開始しました。')}
  save();renderBar();
}
function pauseTimer(at,msg,manual){var t=state.timer;if(!t||!t.runningSince)return;var e=Math.max(t.runningSince,at||Date.now());t.segments.push({s:t.runningSince,e:e});t.runningSince=null;t.pausedAt=e;t.manualHold=!!manual;save();renderBar();if(msg)toast(msg)}
function resumeTimer(){var t=state.timer;if(!t||t.runningSince)return;t.runningSince=Date.now();t.lastBeat=t.runningSince;t.pausedAt=null;t.manualHold=false;save();renderBar()}
function endTimer(opts){
  opts=opts||{};var t=state.timer;if(!t)return;pauseTimer(Date.now());
  var by=splitByDay(t.segments),sec=0,rounded={};Object.keys(by).forEach(function(k){var v=Math.round(by[k]);if(v>0){rounded[k]=v;sec+=v}});
  var start=t.segments.length?t.segments[0].s:t.startedAt,end=t.segments.length?t.segments[t.segments.length-1].e:t.startedAt;
  if(sec>=3){state.timeLog.push({id:t.id,start:start,end:end,sec:sec,domainId:t.domainId,lectureId:t.lectureId,byDate:rounded});var d=domById(t.domainId);logAct('time','学習 '+fmtHM(sec)+'（'+(IDX[t.lectureId]?IDX[t.lectureId].title:d?d.name:'自由研究')+'）')}
  state.timer=null;if(opts.hold)autoHold=true;save();renderBar();
  if(!opts.silent)toast(sec>=3?'学習を保存しました（'+fmtHM(sec)+'）。':'3秒未満のため記録しませんでした。');
  if(opts.render)render();
}
/* 自動計測：いま開いている画面から「学習中かどうか」を判定する */
function studyContext(){
  var r=route();
  if(r.page==='lecture')return (IDX[r.a]&&LECTURES[r.a])?{d:IDX[r.a].domain,l:r.a}:null;
  if(r.page==='domain')return domById(r.a)?{d:r.a,l:''}:null;
  if(r.page==='lab'){var t=r.a?TASKS.filter(function(x){return x.id===r.a})[0]:null;return {d:t?t.domain:'',l:''}}
  if(r.page==='library'||r.page==='notes')return {d:'',l:''};
  return null;
}
function autoSync(){
  if(!state||!state.settings.auto)return;
  var now=Date.now(),t=state.timer,c=studyContext();
  var hidden=(typeof document!=='undefined'&&!!document.hidden)&&state.settings.autoPauseHidden;
  var idle=now-lastActivity>state.settings.idleMinutes*60000;
  var okRun=!!c&&!hidden&&!idle&&!autoHold;
  if(t&&t.runningSince){
    if(!c||hidden||idle){
      pauseTimer(idle?lastActivity:now,null,false);
      if(idle&&now-lastIdleToast>60000){lastIdleToast=now;toast('無操作が続いたため、計測を一時停止しました（操作のなかった時間は加算されません）。')}
    }else if(c.d!==t.domainId||c.l!==t.lectureId){endTimer({silent:true});}
  }else if(t){
    if(t.pausedAt&&now-t.pausedAt>15*60000){endTimer({silent:true});}
    else if(okRun&&!t.manualHold){
      if(c.d!==t.domainId||c.l!==t.lectureId)endTimer({silent:true});else resumeTimer();
    }
  }
  if(!state.timer&&okRun)startTimer(c.d,c.l,true);
}
function tick(){
  if(state.settings.auto)autoSync();
  else{var t0=state.timer;if(t0&&t0.runningSince&&Date.now()-lastActivity>state.settings.idleMinutes*60000)pauseTimer(lastActivity,'無操作が続いたため、計測を一時停止しました（操作のなかった時間は加算されません）。')}
  var t=state.timer;
  if(t&&t.runningSince){var now=Date.now();t.lastBeat=now;if(Math.floor(now/1000)%5===0)save()}
  var el=$('#tbTime');if(el&&state.timer)el.textContent=fmtDur(timerMs()/1000);
  var ht=$('#liveToday');if(ht)ht.textContent=fmtHM(todaySec());
}
function markActive(){lastActivity=Date.now();if(state&&state.settings.auto&&(!state.timer||!state.timer.runningSince)&&lastActivity-lastSync>800){lastSync=lastActivity;autoSync()}}

function pctBar(p){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>'}
function domProgress(d){var ls=[];d.chapters.forEach(function(c){c.lectures.forEach(function(l){ls.push(l[0])})});var cl=ls.filter(function(i){return state.completed[i]}).length;var ts=TASKS.filter(function(t){return t.domain===d.id});var td=ts.filter(function(t){return state.tasks[t.id]&&state.tasks[t.id].status==='done'}).length;var tot=ls.length+ts.length;return {lec:ls.length,lecDone:cl,written:ls.filter(function(i){return LECTURES[i]}).length,tasks:ts.length,tasksDone:td,pct:tot?Math.round(100*(cl+td)/tot):0}}

/* インポート検証：{ok, errors[], warnings[], state, summary} */
function validateImport(text){
  var errors=[],warnings=[],obj;
  if(typeof text!=='string'||!text.trim())return {ok:false,errors:['ファイルが空です。']};
  if(text.length>30000000)return {ok:false,errors:['ファイルが大きすぎます。']};
  try{obj=JSON.parse(text)}catch(e){return {ok:false,errors:['JSONとして読み込めません：'+e.message]}}
  if(!isObj(obj))return {ok:false,errors:['JSONの最上位がオブジェクトではありません。']};
  if(obj.app!=='GRIMOIRE')errors.push('GRIMOIRE のバックアップファイルではありません（app が "GRIMOIRE" ではありません）。');
  if(typeof obj.schemaVersion!=='number'||!isFinite(obj.schemaVersion))errors.push('schemaVersion がありません。');
  else if(obj.schemaVersion>SCHEMA)errors.push('このファイルは新しい形式（schemaVersion '+obj.schemaVersion+'）です。この版（'+SCHEMA+'）では読み込めません。');
  else if(obj.schemaVersion<1)errors.push('schemaVersion が不正です。');
  if(!isObj(obj.data))errors.push('data オブジェクトがありません。');
  else{['awards','completed','quiz','tasks','readings','settings'].forEach(function(k){if(obj.data[k]!==undefined&&!isObj(obj.data[k]))errors.push('data.'+k+' の形式が不正です。')});['notes','timeLog','activity'].forEach(function(k){if(obj.data[k]!==undefined&&!Array.isArray(obj.data[k]))errors.push('data.'+k+' の形式が不正です。')})}
  if(errors.length)return {ok:false,errors:errors};
  var s=sanitizeState(obj.data,warnings);
  var rawCounts={notes:(obj.data.notes||[]).length,timeLog:(obj.data.timeLog||[]).length};
  if(s.notes.length<rawCounts.notes)warnings.push('形式が不正なノート '+(rawCounts.notes-s.notes.length)+' 件を読み飛ばしました。');
  if(s.timeLog.length<rawCounts.timeLog)warnings.push('形式が不正な学習履歴 '+(rawCounts.timeLog-s.timeLog.length)+' 件を読み飛ばしました。');
  return {ok:true,errors:[],warnings:warnings,state:s,exportedAt:obj.exportedAt||'',summary:summarize(s)};
}
function summarize(s){var sec=0;s.timeLog.forEach(function(l){sec+=l.sec});return {xp:xpTotal(s),level:levelOf(xpTotal(s)),title:titleOf(s).current,lectures:Object.keys(s.completed).length,tasks:Object.keys(s.tasks).filter(function(k){return s.tasks[k].status==='done'}).length,notes:s.notes.length,sessions:s.timeLog.length,seconds:sec,readings:Object.keys(s.readings).length}}
/* 統合：和集合。同一キーは新しい方（または大きい方）を採用 */
function mergeStates(a,b){
  var m=JSON.parse(JSON.stringify(a));
  Object.keys(b.awards).forEach(function(k){if(!m.awards[k]||b.awards[k].xp>m.awards[k].xp)m.awards[k]=b.awards[k]});
  Object.keys(b.completed).forEach(function(k){if(!m.completed[k]||b.completed[k]<m.completed[k])m.completed[k]=b.completed[k]});
  Object.keys(b.quiz).forEach(function(k){var x=m.quiz[k],y=b.quiz[k];if(!x||y.best>x.best||(y.best===x.best&&y.ts>x.ts))m.quiz[k]=Object.assign({},y,{best:Math.max(y.best,x?x.best:0),attempts:Math.max(y.attempts,x?x.attempts:0)})});
  Object.keys(b.tasks).forEach(function(k){var x=m.tasks[k],y=b.tasks[k];if(!x||(y.ts||0)>(x.ts||0))m.tasks[k]=y});
  var ids={};m.notes.forEach(function(n){ids[n.id]=n});b.notes.forEach(function(n){if(!ids[n.id])m.notes.push(n);else if(n.updated>ids[n.id].updated)Object.assign(ids[n.id],n)});
  var tl={};m.timeLog.forEach(function(l){tl[l.id]=1});b.timeLog.forEach(function(l){if(!tl[l.id])m.timeLog.push(l)});
  Object.keys(b.readings).forEach(function(k){var x=m.readings[k],y=b.readings[k];if(!x||y.updated>x.updated)m.readings[k]=y});
  var seen={};m.activity.forEach(function(a){seen[a.ts+a.text]=1});b.activity.forEach(function(a){if(!seen[a.ts+a.text])m.activity.push(a)});m.activity.sort(function(x,y){return x.ts-y.ts});m.activity=m.activity.slice(-300);
  if(!m.lastLecture)m.lastLecture=b.lastLecture;
  return m;
}
function applyImport(mode){
  var p=pendingImport;if(!p||!p.ok)return;var keep=state.timer;
  var ns=(mode==='merge')?mergeStates(state,p.state):p.state;
  ns.timer=keep;ns.schemaVersion=SCHEMA;state=sanitizeStateKeep(ns);save();pendingImport=null;
  logAct('data','JSONバックアップを'+(mode==='merge'?'統合':'復元')+'しました');save();
  var sm=summarize(state);render();renderBar();
  toast('復元しました：'+sm.xp+' XP / 講義 '+sm.lectures+' / ノート '+sm.notes+' / 学習 '+fmtHM(sm.seconds));
}
function sanitizeStateKeep(s){var t=s.timer;var c=sanitizeState(JSON.parse(JSON.stringify(Object.assign({},s,{timer:null}))),[]);c.timer=t;return c}

function pageData(){
  var s=summarize(state),le=state.settings.lastExport;
  var h='<h1>データ・設定</h1><div class="card"><h3 style="margin-top:0">バックアップ（JSON）</h3><p class="muted">学習データはこのブラウザの localStorage に自動保存されています。ブラウザのデータを消去すると失われるため、定期的にJSONで書き出してください。最後の書き出し：'+(le?fmtDT(le):'まだありません')+'</p><div class="row"><button class="pri" data-act="export">JSONを書き出す</button><label class="btn" style="margin:0;cursor:pointer">JSONを読み込む<input type="file" id="impFile" accept="application/json,.json" style="display:none"></label></div></div>';
  h+='<div id="impBox"></div>';
  h+='<div class="card"><h3 style="margin-top:0">現在のデータ</h3><p class="sans">'+s.xp+' XP ／ Lv.'+s.level+' ／ '+esc(s.title)+' ／ 講義 '+s.lectures+' ／ 課題 '+s.tasks+' ／ ノート '+s.notes+' ／ 学習 '+fmtHM(s.seconds)+'（'+s.sessions+'セッション）</p></div>';
  h+='<div class="card"><h3 style="margin-top:0">設定</h3><label class="opt"><input type="checkbox" id="s_auto" '+(state.settings.auto?'checked':'')+'>学習時間を自動で計測する（講義・研究室・実験室・文献・ノートを開いている間）</label><label>無操作で自動一時停止するまでの時間（分）</label><input type="number" id="s_idle" min="1" max="120" value="'+state.settings.idleMinutes+'" style="max-width:120px"><label class="opt" style="margin-top:10px"><input type="checkbox" id="s_hidden" '+(state.settings.autoPauseHidden?'checked':'')+'>タブが非表示になったら計測を自動で一時停止する</label><button class="pri" data-act="savesettings" style="margin-top:8px">設定を保存</button></div>';
  h+='<div class="card"><h3 style="margin-top:0">学習時間の計測について</h3><ul class="clean muted"><li>自動計測がONのときは、講義・研究室・実験室・古文書庫・研究ノートを開いている間だけ計測します。書斎・学習履歴・データ画面では計測しません。</li><li>別の講義を開くと、記録は自動的に講義ごとに区切られます。</li><li>一時停止中の時間は加算されません。</li><li>ページを閉じた・再読み込みした場合、最後に確認できた時点までを記録し、一時停止状態で復帰します。</li><li>日付をまたぐ学習は、日別に分けて集計します。</li><li>無操作が続く、またはタブが非表示になると、最後に操作した時点で自動的に一時停止します（操作を再開すると自動で再開します）。</li><li>一時停止が15分を超えると、そこまでの記録を保存して区切ります。</li><li>画面下部のバーで、計測の状態を確認できます。「⏸ 一時停止」を押した場合は、「再開」を押すまで自動再開しません。</li></ul></div>';
  h+='<div class="card"><h3 style="margin-top:0">データの初期化</h3><p class="muted">この端末の学習データをすべて削除します。実行前にJSONバックアップを書き出してください。</p><button class="danger" data-act="reset">すべて削除する</button></div>';
  return h;
}
function showImportPreview(res){
  var box=$('#impBox');if(!box)return;
  if(!res.ok){box.innerHTML='<div class="card" style="border-color:var(--danger)"><h3 style="margin-top:0">読み込みを拒否しました</h3><ul class="clean">'+res.errors.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul></div>';return}
  var s=res.summary,c=summarize(state);
  box.innerHTML='<div class="card" style="border-color:var(--gold2)"><h3 style="margin-top:0">読み込み前の確認</h3><div class="sans" style="overflow-x:auto"><table><tr><th></th><th>ファイル</th><th>現在のデータ</th></tr>'+[['経験値',s.xp+' XP (Lv.'+s.level+')',c.xp+' XP (Lv.'+c.level+')'],['称号',s.title,c.title],['完了講義',s.lectures,c.lectures],['完了課題',s.tasks,c.tasks],['ノート',s.notes,c.notes],['学習時間',fmtHM(s.seconds),fmtHM(c.seconds)],['文献記録',s.readings,c.readings]].map(function(r){return '<tr><th>'+r[0]+'</th><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'}).join('')+'</table></div>'+(res.exportedAt?'<p class="muted">書き出し日時：'+esc(res.exportedAt)+'</p>':'')+(res.warnings.length?'<div class="box warn sans"><b>注意</b><ul class="clean">'+res.warnings.slice(0,12).map(function(w){return '<li>'+esc(w)+'</li>'}).join('')+(res.warnings.length>12?'<li>ほか '+(res.warnings.length-12)+' 件</li>':'')+'</ul></div>':'')+'<label class="opt"><input type="radio" name="impMode" value="merge" checked>統合する（現在のデータを残し、ファイルの内容を加える）</label><label class="opt"><input type="radio" name="impMode" value="overwrite">上書きする（<b>現在のデータはすべて置き換わります</b>）</label><div class="row" style="margin-top:8px"><button class="pri" data-act="doimport">読み込みを実行</button><button data-act="cancelimport">キャンセル</button></div></div>';
}

/* ---- ルーティングと描画 ---- */
function render(){
  var r=route(),h;
  try{
    switch(r.page){
      case 'home':h=pageHome();break;case 'domains':h=pageDomains();break;case 'domain':h=pageDomain(r.a);break;
      case 'lecture':h=pageLecture(r.a);break;case 'lab':h=pageLab(r.a);break;case 'library':h=pageLibrary(r.a);break;
      case 'notes':h=pageNotes();break;case 'history':h=pageHistory();break;case 'data':h=pageData();break;
      default:h=notFound()}
  }catch(e){h='<h1>表示エラー</h1><p class="muted">'+esc(e.message)+'</p>'}
  $('#app').innerHTML=h;renderNav();renderBar();
  var f=$('#impFile');if(f)f.addEventListener('change',function(ev){var file=ev.target.files&&ev.target.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(){pendingImport=validateImport(String(rd.result));showImportPreview(pendingImport)};rd.onerror=function(){showImportPreview({ok:false,errors:['ファイルを読み込めませんでした。']})};rd.readAsText(file)});
  var lq=$('#libQ');if(lq){lq.addEventListener('input',function(){libState.q=lq.value;$('#libList').innerHTML=libList()});$('#libCat').addEventListener('change',function(e){libState.cat=e.target.value;$('#libList').innerHTML=libList()})}
  var nq=$('#noteQ');if(nq)nq.addEventListener('input',function(){noteState.q=nq.value;$('#noteList').innerHTML=noteList()});
  if(!window.__gr_noscroll)window.scrollTo(0,0);
}

/* ---- イベント ---- */
function val(id){var e=document.getElementById(id);return e?e.value:''}
function onClick(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),D=function(k){return el.getAttribute('data-'+k)};markActive();
  switch(a){
    case 'tstart':{var sel=$('#tbDom'),dom=D('d')||(sel?sel.value:'');startTimer(dom,D('l')||'');render();break}
    case 'tpause':pauseTimer(Date.now(),null,true);break;case 'tresume':autoHold=false;resumeTimer();break;
    case 'toggleauto':state.settings.auto=!state.settings.auto;if(state.settings.auto){autoHold=false;autoSync()}else if(state.timer&&state.timer.runningSince)pauseTimer(Date.now(),null,true);save();renderBar();toast('自動計測を'+(state.settings.auto?'ONにしました。':'OFFにしました。手動の開始・一時停止・終了で計測します。'));if(route().page==='data'||route().page==='lecture'||route().page==='domain')render();break;
    case 'tend':if(confirm(state.settings.auto?'ここまでの学習時間を保存して区切りますか？（ページを移動すると、また自動で計測が始まります）':'学習を終了して記録しますか？'))endTimer({hold:true,render:true});break;
    case 'complete':{var id=D('l'),ds=IDX[id].domain;if(!state.completed[id]){state.completed[id]=Date.now();var g=award('lec:'+id,50,ds,'講義を完了：'+IDX[id].title);save();toast('講義を完了しました（+'+g+' XP）');render()}break}
    case 'review':{var id2=D('l'),key='review:'+id2+':'+dkey(Date.now());if(state.awards[key])toast('今日はすでに復習を記録しています。');else{award(key,10,IDX[id2].domain,'復習：'+IDX[id2].title);save();toast('復習を記録しました（+10 XP）')}break}
    case 'quiz':{var lid=D('l'),L=LECTURES[lid],ok=0,answered=0;
      L.quiz.forEach(function(Q,i){var sel=document.querySelector('input[name="q'+i+'"]:checked');var ex=document.getElementById('ex'+i);Q.o.forEach(function(_,j){var o=document.getElementById('o_'+i+'_'+j);if(o)o.className='opt'+(j===Q.a?' right':(sel&&+sel.value===j?' wrong':''))});if(sel){answered++;if(+sel.value===Q.a)ok++}if(ex){ex.className='muted';ex.textContent=Q.e}});
      if(answered<L.quiz.length){var r0=document.getElementById('quizRes');if(r0)r0.textContent='未回答の問題があります。すべて選んでから答え合わせをしてください。';
        L.quiz.forEach(function(Q,i){var ex=document.getElementById('ex'+i);if(ex){ex.className='hide'}});L.quiz.forEach(function(Q,i){Q.o.forEach(function(_,j){var o=document.getElementById('o_'+i+'_'+j);if(o)o.className='opt'})});break}
      var prev=state.quiz[lid]||{best:0,attempts:0};state.quiz[lid]={best:Math.max(prev.best,ok),total:L.quiz.length,last:ok,ts:Date.now(),attempts:prev.attempts+1};
      var gain=award('quiz:'+lid,state.quiz[lid].best*10,IDX[lid].domain,'理解度確認：'+IDX[lid].title+' '+ok+'/'+L.quiz.length);save();
      var r1=document.getElementById('quizRes');if(r1)r1.textContent='結果：'+ok+' / '+L.quiz.length+'（最高 '+state.quiz[lid].best+'）'+(gain?'　+'+gain+' XP':'');break}
    case 'savetask':{var tid=D('t'),T=TASKS.filter(function(x){return x.id===tid})[0],m={},any=false;T.metrics.forEach(function(mm){var v=val('m_'+mm.k);m[mm.k]=v;if(String(v).trim())any=true});
      var st=val('t_status'),result=val('t_result').trim();
      if(st==='done'&&!any&&!result){toast('結果または数値が未記入のため、完了にできません。');break}
      state.tasks[tid]={status:st,metrics:m,result:val('t_result'),reflection:val('t_reflection'),date:val('t_date'),ts:Date.now()};
      var msg='記録を保存しました。';if(st==='done'){var gg=award('task:'+tid,80,T.domain,'実践課題を完了：'+T.title);if(gg)msg+='（+'+gg+' XP）'}else logAct('task','実践課題を記録：'+T.title);
      save();toast(msg);render();break}
    case 'saveread':{var rid=D('r'),rs=val('rd_status');state.readings[rid]={status:rs,memo:val('rd_memo'),updated:Date.now()};var m2='保存しました。';if(rs==='finished'){var g3=award('read:'+rid,20,'','読了：'+REFIDX[rid].title);if(g3)m2+='（+20 XP）'}save();toast(m2);render();break}
    case 'savenote':{var nid=D('n'),rec={id:nid||uid(),date:val('n_date'),domain:val('n_domain'),title:val('n_title').trim(),hypothesis:val('n_hyp'),done:val('n_done'),result:val('n_res'),consider:val('n_con'),refs:val('n_refs'),updated:Date.now()};
      if(!rec.title&&!rec.hypothesis&&!rec.done&&!rec.result&&!rec.consider){toast('内容を入力してください。');break}
      var msg2='保存しました。';
      if(nid){var i=state.notes.findIndex(function(x){return x.id===nid});if(i>=0)state.notes[i]=rec;noteState.edit=null}
      else{state.notes.push(rec);var day=dkey(Date.now()),cnt=Object.keys(state.awards).filter(function(k){return k.indexOf('note:'+day)===0}).length;if(cnt<3){award('note:'+day+':'+rec.id,15,rec.domain,'研究ノート：'+(rec.title||'無題'));msg2+='（+15 XP）'}else logAct('note','研究ノート：'+(rec.title||'無題'))}
      save();toast(msg2);render();break}
    case 'editnote':noteState.edit=D('n');render();break;
    case 'cancelnote':noteState.edit=null;render();break;
    case 'delnote':if(confirm('このノートを削除しますか？（取り消せません）')){state.notes=state.notes.filter(function(x){return x.id!==D('n')});save();render()}break;
    case 'export':doExport();break;
    case 'doimport':{var mode=(document.querySelector('input[name="impMode"]:checked')||{}).value||'merge';if(mode==='overwrite'&&!confirm('現在のデータがファイルの内容で置き換わります。よろしいですか？'))break;applyImport(mode);break}
    case 'cancelimport':pendingImport=null;$('#impBox').innerHTML='';break;
    case 'savesettings':state.settings.idleMinutes=num(val('s_idle'),5,1,120);state.settings.autoPauseHidden=!!document.getElementById('s_hidden').checked;state.settings.auto=!!document.getElementById('s_auto').checked;autoHold=false;autoSync();save();renderBar();toast('設定を保存しました。');break;
    case 'reset':if(confirm('すべての学習データを削除します。よろしいですか？')&&confirm('本当に削除しますか？この操作は取り消せません。')){state=defaultState();save();render();toast('初期化しました。')}break;
  }
}

function init(){
  state=loadState();var recovered=state._recovered;delete state._recovered;
  document.addEventListener('click',onClick);
  ['mousemove','keydown','touchstart','scroll','click','wheel'].forEach(function(e){window.addEventListener(e,markActive,{passive:true})});
  window.addEventListener('hashchange',function(){autoHold=false;autoSync();render()});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      if(state.settings.auto)autoSync();
      else if(state.timer&&state.timer.runningSince&&state.settings.autoPauseHidden)pauseTimer(Date.now(),null);
      if(state.timer&&state.timer.runningSince)state.timer.lastBeat=Date.now();save();
    }else{
      markActive();
      if(!state.settings.auto&&state.timer&&!state.timer.runningSince&&state.settings.autoPauseHidden)toast('タブが非表示の間、計測を一時停止しました。再開するには「再開」を押してください。');
    }
    renderBar();
  });
  window.addEventListener('pagehide',function(){if(state.timer&&state.timer.runningSince)state.timer.lastBeat=Date.now();save()});
  window.addEventListener('storage',function(e){if(e.key===LS_KEY){state=loadState();render()}});
  setInterval(tick,1000);
  autoSync();render();
  if(recovered)toast('前回の計測セッションを復元しました（最後に確認できた時点までを記録しています）。');
  else if(state.timer&&!state.settings.auto)toast('計測セッションが残っています。「再開」または「学習終了」を選んでください。');
}
if(typeof window!=='undefined'){window.GRIMOIRE_TEST={validateImport:validateImport,mergeStates:mergeStates,buildExport:buildExport,splitByDay:splitByDay,sanitizeState:sanitizeState,defaultState:defaultState,xpTotal:xpTotal,levelOf:levelOf,titleOf:titleOf,DOMAINS:DOMAINS,LECTURES:LECTURES,TASKS:TASKS,REFS:REFS,IDX:IDX,pageLecture:pageLecture,pageHome:pageHome,pageDomains:pageDomains,pageDomain:pageDomain,pageLab:pageLab,pageTask:pageTask,pageLibrary:pageLibrary,pageRef:pageRef,pageNotes:pageNotes,pageHistory:pageHistory,pageData:pageData,setState:function(s){state=s},getState:function(){return state},citedBy:citedBy,autoSync:autoSync,studyContext:studyContext,startTimer:startTimer,endTimer:endTimer,pauseTimer:pauseTimer,resumeTimer:resumeTimer,markActive:markActive,tick:tick,totalSec:totalSec,todaySec:todaySec,setLast:function(t){lastActivity=t},resetHold:function(){autoHold=false}};
  if(document&&document.getElementById&&!window.__GR_NOINIT)init();}
